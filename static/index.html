<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="彩票统计">
<meta name="theme-color" content="#e8402a">
<!--PWA:APPLE_ICON-->
<!--PWA:MANIFEST-->
<title>彩票统计 · 双色球 / 大乐透 / 福彩3D / 排列三</title>
<style>
/* ---------- 主题变量 ---------- */
:root{
  --bg:#f2f3f5; --surface:#fff; --surface2:#fafafa; --surface3:#f5f5f5;
  --fg:#1a1a1a; --fg2:#333; --fg3:#555; --fg4:#666; --fg5:#888; --fg6:#999; --fg7:#aaa;
  --bd:#e5e5e5; --bd2:#ddd; --bd3:#f0f0f0; --hover:#f7f7f7;
  --hl:#fff3d6; --brand:#e8402a;
  --warnbg:#fff8e6; --hitbg:#fff5e6; --warnfg:#8a6100;
  --okbg:#e8f5e9; --okfg:#2e7d32; --errbg:#ffebee; --errfg:#c62828;
  --hitbd:#ffd9a6; --hlbd:#f0e2bd;
  color-scheme:light;
}
body.dark{
  --bg:#121212; --surface:#1e1e1e; --surface2:#252525; --surface3:#2b2b2b;
  --fg:#e6e6e6; --fg2:#d8d8d8; --fg3:#c0c0c0; --fg4:#a8a8a8; --fg5:#949494; --fg6:#848484; --fg7:#787878;
  --bd:#333; --bd2:#3d3d3d; --bd3:#2c2c2c; --hover:#2e2e2e;
  --hl:#4a3a14; --brand:#ff5a45;
  --warnbg:#3a2f16; --hitbg:#38301a; --warnfg:#ffcc80;
  --okbg:#1e3320; --okfg:#6fbf73; --errbg:#3a1e20; --errfg:#ff7b72;
  --hitbd:#6b5330; --hlbd:#5a4a26;
  color-scheme:dark;      /* 让下拉框、滚动条等原生控件一起变深 */
}
/* 内联样式里写死的颜色，用属性选择器统一接管（选择器内容不可被变量替换） */
body.dark [style*="color:#aaa"],body.dark [style*="color:#999"],
body.dark [style*="color:#888"],body.dark [style*="color:#bbb"],
body.dark [style*="color:#777"]{color:var(--fg5)!important}
body.dark [style*="color:#666"],body.dark [style*="color:#555"]{color:var(--fg4)!important}
body.dark [style*="color:#333"],body.dark [style*="color:#444"],
body.dark [style*="color:#222"]{color:var(--fg)!important}
body.dark [style*="background:#fafafa"]{background:var(--surface2)!important}
body.dark [style*="background:#fff5e6"],body.dark [style*="background:#fff8e6"],
body.dark [style*="background:#fff3d6"]{background:var(--warnbg)!important}
/* 深色下几个写死的红/绿文字提亮，保证对比度 */
body.dark [style*="color:#c33"],body.dark [style*="color:#c62828"]{color:#ff7b72!important}
body.dark [style*="color:#2e7d32"]{color:#6fbf73!important}
body.dark [style*="color:#e07b00"]{color:#ffb74d!important}
body.dark [style*="background:#b0b0b0"]{background:#555!important}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
 background:var(--bg);color:var(--fg);font-size:14px;-webkit-text-size-adjust:100%;
 padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--bd);
 padding:10px 12px 0;padding-top:calc(10px + env(safe-area-inset-top))}
.lot{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.lot button{flex:1;padding:10px 0;border:1px solid var(--bd2);background:var(--surface);border-radius:8px;
 font-size:15px;font-weight:600;color:var(--fg3);cursor:pointer}
.lot button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* 菜单按钮：纯 CSS 三条杠，不依赖字体，绝不出现问号/方块乱码 */
.menu{width:38px;height:38px;border-radius:8px;border:1px solid var(--bd2);background:var(--surface);flex:none;
 cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.menu i{display:block;width:18px;height:2px;background:var(--fg5);border-radius:1px}
.menu:active{background:var(--surface3)}
.sidemask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:150;display:none}
.sidemask.on{display:block}
.sidepanel{position:absolute;left:0;top:0;bottom:0;width:264px;max-width:82vw;background:var(--surface);
 box-shadow:2px 0 14px rgba(0,0,0,.16);display:flex;flex-direction:column;overflow:auto;
 padding-top:env(safe-area-inset-top);animation:slidein .22s ease}
@keyframes slidein{from{transform:translateX(-100%)}to{transform:translateX(0)}}
.sidehead{padding:16px 16px 12px;font-size:16px;font-weight:700;color:var(--fg);
 border-bottom:1px solid var(--bd3);display:flex;justify-content:space-between;align-items:center}
.sidehead span{color:var(--fg5);font-size:22px;cursor:pointer;line-height:1;padding:0 2px}
.sideitem{padding:13px 16px;font-size:14.5px;color:var(--fg2);border-bottom:1px solid var(--bd3);
 cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sideitem:active{background:var(--hover)}
.sideitem em{font-style:normal;font-size:11.5px;color:var(--fg7);font-weight:400}
.sideitem.danger{color:var(--errfg)}
.sidenote{padding:14px 16px;font-size:11.5px;color:var(--fg7);line-height:1.7;margin-top:auto}
.tabs{display:flex;flex-wrap:wrap;gap:0;overflow:visible}
.tabs button{flex:0 0 auto;min-width:25%;box-sizing:border-box;padding:9px 6px;border:none;background:none;font-size:12.5px;color:var(--fg5);
 border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
main{padding:10px 12px 24px}
.card{background:var(--surface);border-radius:10px;overflow:hidden;margin-bottom:12px;
 box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd3);flex-wrap:wrap}
.bar label{font-size:13px;color:var(--fg4)}
.seg{display:flex;border:1px solid var(--bd2);border-radius:6px;overflow:hidden}
.seg button{padding:5px 12px;border:none;background:var(--surface);font-size:12.5px;color:var(--fg4);cursor:pointer}
.seg button.on{background:var(--brand);color:#fff}
select{padding:6px 8px;border:1px solid var(--bd2);border-radius:6px;font-size:13px;background:var(--surface);color:var(--fg2)}
.chk{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--fg4);cursor:pointer}
.hint{font-size:12px;color:var(--fg6);padding:8px 12px;line-height:1.5}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--bd3)}
th{background:var(--surface2);font-weight:600;color:var(--fg3);cursor:pointer;user-select:none}
th .ar{color:var(--brand);font-size:11px;margin-left:2px}
th.act{color:var(--brand)}
td.l{text-align:left}
tr.hl{background:var(--hl)}
tr.hl td{border-bottom-color:var(--hlbd)}
.balls{display:flex;gap:3px;justify-content:center;align-items:center;flex-wrap:wrap}
.b{width:22px;height:22px;line-height:22px;border-radius:50%;font-size:12px;font-weight:600;
 text-align:center;display:inline-block}
.b.r{background:var(--brand);color:#fff}
.b.bl{background:#2b6cd4;color:#fff}
.b.big{width:28px;height:28px;line-height:28px;font-size:14px}
.b.hit{box-shadow:0 0 0 2px #f9a825;font-weight:700}
.b.dim{opacity:.3;filter:grayscale(1)}
.sep{color:var(--bd2);margin:0 2px}
.more{display:block;width:100%;padding:11px;border:none;background:var(--surface);color:var(--brand);
 font-size:14px;cursor:pointer;border-top:1px solid var(--bd3)}
.state{padding:40px 16px;text-align:center;color:var(--fg5);font-size:14px;line-height:1.8}
.spin{width:26px;height:26px;border:3px solid var(--bd3);border-top-color:var(--brand);border-radius:50%;
 margin:0 auto 12px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.err{color:var(--errfg)}
button.retry{margin-top:10px;padding:8px 18px;border:1px solid var(--brand);background:var(--surface);color:var(--brand);
 border-radius:6px;font-size:14px;cursor:pointer}
.upd{font-size:11px;color:var(--fg7);padding:6px 12px 2px}
.warn{background:var(--warnbg);color:var(--warnfg);font-size:12px;padding:8px 12px;line-height:1.5}
.sec{padding:8px 12px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--fg3);border-bottom:1px solid var(--bd3)}
.note{font-size:11px;color:var(--fg7);padding:8px 12px;line-height:1.6}
/* 走势：点阵 */
.svgwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface)}
svg{display:block}
.legend{display:flex;flex-wrap:wrap;gap:3px;padding:8px 10px;border-top:1px solid var(--bd3)}
.lg{width:26px;height:22px;line-height:22px;text-align:center;font-size:10px;border-radius:3px;
 color:#fff;font-weight:600;cursor:pointer;opacity:.95}
.lg.off{opacity:.28}
.tip{padding:16px 12px;text-align:center;color:var(--fg7);font-size:13px}
.onepick{display:flex;flex-wrap:wrap;gap:4px}
.onb{width:26px;height:24px;line-height:24px;text-align:center;border-radius:4px;
 font-size:11px;font-weight:600;cursor:pointer;color:#fff}
.onb.sel{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--fg2)}
.statcard{margin:2px 12px 10px;padding:12px 12px 6px;background:var(--surface2);border-radius:10px;
 border:1px solid var(--bd3)}
.sctop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.scnum{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;
 border-radius:5px;color:#fff;font-size:12px;font-weight:700;padding:0 6px}
.sctop select{margin-left:auto;font-size:12px;padding:4px 6px;border:1px solid var(--bd2);
 border-radius:6px;background:var(--surface);color:var(--fg3)}
.scmain{display:flex;gap:8px;margin-bottom:10px}
.sci{flex:1;background:var(--surface);border:1px solid var(--bd3);border-radius:8px;padding:9px 4px;text-align:center}
.sci em{display:block;font-style:normal;font-size:19px;font-weight:700;color:var(--fg);line-height:1.25}
.sci span{display:block;font-size:10.5px;color:var(--fg6);margin-top:3px}
.sctbl{border-top:1px solid var(--bd3);padding-top:6px}
.scr{display:flex;justify-content:space-between;align-items:center;padding:5px 2px;
 font-size:12px;border-bottom:1px solid var(--bd3)}
.scr:last-child{border-bottom:none}
.scr span{color:var(--fg5)}
.scr b{color:var(--fg2);font-weight:600}
.onestat{font-size:12px;color:var(--fg4);padding:4px 12px 12px;line-height:1.7}
.onestat b{color:var(--fg2);font-size:13px}
/* 冷热：方格 */
.heatgrid{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px}
.hcell{width:calc((100% - 30px)/7);border-radius:6px;padding:5px 0;text-align:center;color:#fff}
.hn{font-size:13px;font-weight:700;line-height:1.1}
.hc{font-size:9.5px;opacity:.9;line-height:1.2}
.toprow{display:flex;gap:6px;align-items:center;padding:4px 12px;font-size:12px;flex-wrap:wrap}
.chip{display:inline-block;padding:2px 7px;border-radius:10px;color:#fff;font-size:11px;font-weight:600}
.lgd{display:flex;gap:6px;padding:6px 12px 10px;flex-wrap:wrap;font-size:11px;color:var(--fg4);align-items:center}
.lgb{width:16px;height:10px;border-radius:2px;display:inline-block}
/* 我的选号 */
.pick{padding:10px 12px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.nb{width:34px;height:34px;line-height:34px;text-align:center;border-radius:50%;
 border:1px solid var(--bd2);background:var(--surface);font-size:13px;color:var(--fg3);cursor:pointer}
.nb.sel{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
.nb.sel.b{background:#2b6cd4;border-color:#2b6cd4}
.nb.sm{width:28px;height:28px;line-height:28px;font-size:12px;cursor:default;flex-shrink:0}
.nb.sm.b.pin{box-shadow:0 0 0 2px rgba(43,108,212,.35);background:#eaf1ff;color:#184a9e;font-weight:700}
.nb.sm.rbhit{box-shadow:0 0 0 2px rgba(43,108,212,.30);border-color:#5a92e0;color:#184a9e;font-weight:700}
/* 冷 / 温 / 热三档：号码 + 遗漏胶囊 + 出现次数 */
.zgrp{margin:8px 12px 0;padding:8px 10px;border-radius:10px;border-left:4px solid}
.zgrp.cold{background:linear-gradient(90deg,rgba(59,111,212,.13),rgba(59,111,212,.02));border-left-color:#3b6fd4}
.zgrp.warm{background:linear-gradient(90deg,rgba(216,138,31,.13),rgba(216,138,31,.02));border-left-color:#d88a1f}
.zgrp.hot{background:linear-gradient(90deg,rgba(214,58,42,.13),rgba(214,58,42,.02));border-left-color:#d63a2a}
.zgrp .zt{font-size:12px;font-weight:700;margin-bottom:6px}
.zgrp.cold .zt{color:#3b6fd4}
.zgrp.warm .zt{color:#b8751a}
.zgrp.hot .zt{color:#d63a2a}
.zrow{display:flex;flex-wrap:wrap;gap:6px}
.zball{width:54px;box-sizing:border-box;padding:5px 2px 4px;border-radius:10px;background:var(--surface);
 border:1px solid var(--bd2);display:flex;flex-direction:column;align-items:center;gap:2px}
.znum{font-size:21px;font-weight:800;line-height:1.05;color:var(--fg3);font-variant-numeric:tabular-nums}
.zbadge{font-size:10.5px;font-weight:700;color:#fff;border-radius:8px;padding:1px 5px;
 white-space:nowrap;line-height:1.4}
.zgrp.cold .zbadge{background:#3b6fd4}
.zgrp.warm .zbadge{background:#d88a1f}
.zgrp.hot .zbadge{background:#d63a2a}
.zcnt{font-size:10px;color:var(--fg5);white-space:nowrap;line-height:1.2}
.mini{padding:4px 7px;border-radius:5px;border:1px solid var(--brand);background:var(--surface);
 color:var(--brand);font-size:11px;line-height:1.4;cursor:pointer;flex-shrink:0;white-space:nowrap}
.mini.warn{border-color:#c60;color:#c60}
.btns{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.btns button{padding:8px 14px;border-radius:6px;border:1px solid var(--brand);background:var(--surface);
 color:var(--brand);font-size:13px;cursor:pointer}
.btns button.g{border-color:var(--bd2);color:var(--fg4)}
.btns button.p{background:var(--brand);color:#fff}
.btns button.dis{background:var(--surface3);border-color:var(--bd3);color:var(--fg5)}
.prev{background:var(--surface2);border:1px dashed var(--bd2);border-radius:8px;padding:10px;margin:8px 0}
.msg{font-size:12px;line-height:1.9;padding:0 2px}
.msg .e{color:var(--errfg)}
.msg .w{color:var(--warnfg)}
.msg .ok{color:var(--okfg)}
.betcard{border-top:1px solid var(--bd3);padding:12px}
.bettop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kv{font-size:12px;color:var(--fg4);line-height:1.9;margin-top:6px}
.kv b{color:var(--fg2);font-weight:600}
.tagline{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;margin-right:4px}
.tag-ok{background:var(--okbg);color:var(--okfg)}
.tag-no{background:var(--surface3);color:var(--fg5)}
.tag-hot{background:var(--errbg);color:var(--errfg)}
.empty{padding:30px 12px;text-align:center;color:var(--fg7);font-size:13px}
/* 通用表单（中奖核对 / 条件机选 共用） */
.frow{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.flab{font-size:12.5px;color:var(--fg4);flex:none}
.ipt{padding:7px 9px;border:1px solid var(--bd2);border-radius:6px;font-size:13px;background:var(--surface);color:var(--fg2);width:118px}
.ipt.sm{width:74px}
.ipt.wide{width:100%;flex:1;min-width:120px}
.rdo{display:flex;gap:6px;flex-wrap:wrap}
.rdo span{padding:6px 11px;border:1px solid var(--bd2);border-radius:6px;font-size:12.5px;
 color:var(--fg4);cursor:pointer;background:var(--surface)}
.rdo span.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
/* 中奖核对结果 */
.pz{margin:0 12px 12px;padding:14px 12px;border-radius:10px;text-align:center;
 background:var(--surface2);border:1px solid var(--bd3)}
.pz.hit{background:var(--hitbg);border-color:var(--hitbd)}
.pzname{font-size:21px;font-weight:700;color:var(--brand);line-height:1.35}
.pzno{font-size:16px;font-weight:600;color:var(--fg6);line-height:1.35}
.pzamt{font-size:12.5px;color:var(--fg5);margin-top:5px}
.pzsub{font-size:12px;color:var(--fg4);margin-top:9px;line-height:1.8}
.hitrow{display:flex;gap:3px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:10px}
.hitlab{font-size:11.5px;color:var(--fg6);margin:10px 0 5px;text-align:center}
.same{padding:4px 12px 12px}
.srow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd3);
 font-size:13px;flex-wrap:wrap}
.srow:last-child{border-bottom:none}
.srow .yr{flex:none;width:44px;color:var(--fg5);font-size:12px}
.srow .is{flex:none;width:66px;color:var(--fg6);font-size:11.5px}
.srow .dt{flex:none;width:80px;color:var(--fg6);font-size:11.5px}
.srow .bs{flex:1;display:flex;gap:3px;justify-content:flex-end;flex-wrap:wrap}
.sameh{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd3);font-size:11.5px;color:var(--fg7)}
/* 说明弹层 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;
 align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border-radius:12px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
.mh{padding:14px 16px;border-bottom:1px solid var(--bd3);font-size:16px;font-weight:600;
 display:flex;justify-content:space-between;align-items:center}
.mh span{color:var(--fg7);font-size:22px;cursor:pointer;line-height:1}
.mb{padding:12px 16px 18px;font-size:13px;line-height:1.85;color:var(--fg2)}
.mb h4{font-size:13px;color:var(--brand);margin:12px 0 3px}
.mb h4:first-child{margin-top:0}
.mb p{color:var(--fg4)}
.mb b{color:var(--fg2)}
.mb ul{margin:2px 0 0 16px;color:var(--fg4)}

/* ---------- 开奖倒计时 ---------- */
.cdown{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface2);
 border:1px solid var(--bd3);font-size:12px;color:var(--fg4);line-height:1.6}
.cdown b{color:var(--brand);font-size:14px;font-variant-numeric:tabular-nums}
.cdown .sch{color:var(--fg6);font-size:11px}
body.dark .cdown b{color:#ff8a7a}
/* ---------- 自选号码：自动核对结果 ---------- */
.bres{margin-top:8px;padding:7px 9px;border-radius:7px;font-size:12px;line-height:1.5;
 background:var(--surface3);color:var(--fg4)}
.bres.hit{background:var(--hitbg);border:1px solid var(--hitbd);color:var(--warnfg)}
.bres .bn{font-weight:700;font-size:13px}
.bres .ba{font-weight:700}
body.dark .bres.hit{background:#3a2f18;border-color:#6b5525;color:#ffca7a}
/* 注操作按钮 */
.betops{display:flex;gap:6px;margin-top:8px}
.betops button{flex:1;padding:6px 0;border:1px solid var(--bd2);border-radius:6px;
 background:var(--surface);font-size:11.5px;color:var(--fg4);cursor:pointer}
.betops button:active{background:var(--hover)}
.betops button.delbtn{color:#c33;border-color:#e8b4b4}
.betops button.confirm{background:#c33;color:#fff;border-color:#c33}
/* 选号记录：彩种徽章 + 左侧色条，一眼区分双色球 / 大乐透 */
.rechead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.lotbadge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;
 font-weight:700;color:#fff;letter-spacing:.5px}
.lb-ssq{background:#e8402a}
.lb-dlt{background:#1a6fd4}

<script>
/* ---------- 主题：默认跟随时间自动切换（白天浅色 / 夜间深色），可手动锁定 ---------- */
/* 自动档：19:00–次日 07:00 为深色，其余时间浅色 */
/* 只有「浅色 / 深色」两种显示。
   没手动选过 → 跟随时间自动切换（19:00–次日 07:00 深色，其余浅色）；
   手动选过 → 固定住，不再随时间变。
   菜单右侧始终只显示当前是哪一种，不出现「自动（深色）」这类字样。 */
var THEME_MODES=['light','dark'];
function themeModeGet(){
  try{ var v=localStorage.getItem('lc_theme'); }catch(e){ var v=null; }
  if(v==='light'||v==='dark') return v;
  return null;                 /* null = 未手动设置，跟随时间 */
}
function autoDarkNow(){ var h=new Date().getHours(); return (h>=19 || h<7); }
function themeShouldDark(){
  var m=themeModeGet();
  if(m===null) return autoDarkNow();
  return m==='dark';
}
function themeModeText(){ return themeShouldDark()?'深色':'浅色'; }
(function(){
  applyTheme(themeShouldDark());
  /* 未手动设置时每分钟检查一次，跨过 19:00 / 07:00 会自动换肤 */
  setInterval(function(){
    try{
      if(themeModeGet()!==null) return;
      var want=autoDarkNow();
      if(want!==isDark()) applyTheme(want);
    }catch(e){}
  }, 60000);
})();
function isDark(){ try{ return document.body.classList.contains('dark'); }catch(e){ return false; } }
function applyTheme(dark){
  try{
    document.body.classList.toggle('dark', dark);
    document.body.classList.toggle('light', !dark);
    var m=document.querySelector('meta[name=theme-color]');
    if(m) m.setAttribute('content', dark?'#121212':'#e8402a');
    var e=document.getElementById('m-theme'); if(e) e.textContent = themeModeText();
  }catch(e){}
  /* SVG 里的颜色是生成时按当前主题算好的（fill 属性无法被 CSS 变量接管），
     所以切换主题后必须重绘一次，否则走势图仍保留旧主题的浅色横带 */
  try{
    if(typeof render==='function' && typeof D!=='undefined'
       && D && Object.keys(D).length) render();
  }catch(e){}
}
/* 菜单里点一次：浅色 ↔ 深色。
   切到的值若与当前时段相同，就清掉偏好、回到「跟随时间」，
   这样始终只有两个可见状态，也不会被永久锁死。 */
function toggleTheme(){
  var want = themeShouldDark() ? 'light' : 'dark';
  try{
    if(want === (autoDarkNow()?'dark':'light')) localStorage.removeItem('lc_theme');
    else localStorage.setItem('lc_theme', want);
  }catch(e){}
  applyTheme(themeShouldDark());
}
</script>
<script>
var API = (location.pathname.indexOf('/api/')===0 ? '' : './api') ;
var D = {};
/* 静态标记：由构建时注入，true=纯静态托管（无后端） */
var STATIC_BUILD = false;
/* ---------- 访问授权（可选，默认关闭）----------
   构建时若注入了 LICENSE（{salt, expire, codes:[...]}），页面必须先凭授权码激活。
   激活后会绑定当前设备：本机存的是「授权码 + 设备指纹」派生出的密钥，
   换设备用同一个码会失效，需要重新激活；到期后全部失效。

   诚实说明：这是纯前端校验，能挡住拿到链接但没有授权码的人，
   但挡不住懂技术的人（HTML 源码可见，删掉校验即可绕过）。
   真要按设备数硬限制、支持随时吊销，必须有后端配合。 */
var LICENSE = null;
function licH(s){
  /* 同步字符串散列（FNV-1a 变体，三轮不同种子），够用于授权码比对 */
  function one(str, seed){
    var h = seed >>> 0, i;
    for(i=0;i<str.length;i++){
      h ^= str.charCodeAt(i);
      h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0;
    }
    h ^= h >>> 16; h = Math.imul(h, 2246822507) >>> 0;
    h ^= h >>> 13; h = Math.imul(h, 3266489909) >>> 0;
    h = (h ^ (h >>> 16)) >>> 0;      /* 末尾必须转无符号，否则会出现负号 */
    return ('00000000'+h.toString(16)).slice(-8);
  }
  return one(s, 0x811c9dc5) + one(s, 0x01000193) + one('x'+s, 0x9e3779b9);
}
function licFp(){
  var n = navigator || {}, tz = '';
  try{ tz = String(-new Date().getTimezoneOffset()); }catch(e){}
  return licH([n.userAgent, n.language, (n.platform||''), (n.hardwareConcurrency||''),
    (screen?screen.width+'x'+screen.height+'x'+(screen.colorDepth||''):''), tz].join('|'));
}
/* ---------- 设备 ID ----------
   纯指纹会随浏览器升级 / 屏幕更换而变，直接拿它当身份会误伤老用户。
   这里用「本机随机串（长期存 localStorage + cookie 双写）+ 指纹」共同派生，
   并保留最近 3 个历史 ID：指纹变化时能平滑迁移，换设备则因没有历史记录而被拦住。 */
function licRand(){
  var s='', i;
  for(i=0;i<8;i++) s+=('0000'+Math.floor(Math.random()*65536).toString(16)).slice(-4);
  return s;
}
function licDidGet(){
  var v='';
  try{ v=localStorage.getItem('lc_did')||''; }catch(e){}
  if(!v){
    try{
      var m=document.cookie.match(/(?:^|;\s*)lc_did=([^;]*)/);
      if(m) v=decodeURIComponent(m[1]);
    }catch(e){}
  }
  if(!v){
    v=licRand();
    try{ localStorage.setItem('lc_did', v); }catch(e){}
    try{ document.cookie='lc_did='+encodeURIComponent(v)+';path=/;max-age=315360000'; }catch(e){}
  }
  return v;
}
function licDevId(){ return licH(licFp()+'|'+licDidGet()).slice(0,16); }
function licDevHist(){
  var h=[], cur=licDevId();
  try{ h=JSON.parse(localStorage.getItem('lc_didh')||'[]'); }catch(e){ h=[]; }
  if(!(h instanceof Array)) h=[];
  if(h.indexOf(cur)<0){ h.unshift(cur); h=h.slice(0,3);
    try{ localStorage.setItem('lc_didh', JSON.stringify(h)); }catch(e){} }
  return h;
}
function licDevMatch(bound){
  /* 当前 ID 或历史 ID 命中都算「同一台设备」 */
  return !!bound && licDevHist().indexOf(bound)>=0;
}
/* ---------- 云端登记表（可选）----------
   LICENSE.regUrl 指向一个公共 JSON 存储，里面记着「码 → 设备 ID」。
   激活时查表：这个码若已被别的设备占用就拒绝，从根上做到一码一机。
   诚实说明：地址内嵌在页面里，能挡住「一个码发给多个人各自激活」，
   挡不住扒源码清空登记表的人。要不可伪造必须上私有后端。 */
function regUrl(){
  try{ return (LICENSE && (LICENSE.regUrl||'')) || ''; }catch(e){ return ''; }
}
function regFetch(url, method, body){
  var opt={method:method, cache:'no-store', headers:{}};
  if(body!==undefined){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(body); }
  var ctrl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  if(ctrl){ opt.signal=ctrl.signal; var t=setTimeout(function(){ ctrl.abort(); }, 12000); }
  function done(j){ if(ctrl) clearTimeout(t); return j; }
  return fetch(url, opt).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.json();
  }).then(done, function(e){ if(ctrl) clearTimeout(t); throw e; });
}
function regGet(){ return regFetch(regUrl(),'GET').then(function(j){
  if(!j || typeof j!=='object') return {v:1,bind:{}};
  if(!j.bind || typeof j.bind!=='object') j.bind={};
  return j;
}); }
function regPut(j){ return regFetch(regUrl(),'PUT',j); }
function licToday(){
  var d=new Date(), p=function(n){return ('0'+n).slice(-2)};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
/* ---------- 自校验授权码：到期日写在码里 ----------
   12 个字符 = 到期日(payload) + 随机(rand) + 校验(sig)，三组交错排列。
   好处：管理员在页面里签发的码，直接发给对方就能用，不用重新构建页面，
   而且每个码可以有各自的到期日。
   边界：验证密钥明文内嵌在本页，所以它防的是"链接被顺手转发"，
   防不住刻意破解（源码可见）。 */
var B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
var LIC_EPOCH=Date.UTC(2020,0,1);
function b32enc(v,w){var s='';for(var i=0;i<w;i++){s=B32[v&31]+s;v=Math.floor(v/32);}return s;}
function b32dec(s){var v=0;for(var i=0;i<s.length;i++){var k=B32.indexOf(s[i]);v=v*32+(k<0?0:k);}return v;}
function licSigSalt(){ return (LICENSE&&LICENSE.sigSalt)||''; }
function licSig(pay,rnd){
  return b32enc(parseInt(licH(licSigSalt()+'|'+pay+'|'+rnd).slice(0,5),16),4);
}
/* ---------- 设备绑定码（16 位，不需要任何外部服务）----------
   原理：把「设备标签」直接写进授权码里。锁屏页会显示本机设备码（4 位），
   用户把它报给管理员，管理员签发时填入，生成的码就只认这一台设备。
   换设备、换浏览器都激活不了 —— 全程离线，不依赖第三方服务。
   12 位的旧码不含设备标签，仍可在任意设备使用（保持兼容）。 */
function licDevTag(did){
  return b32enc(parseInt(licH('LICDEV|'+(did||licDevId())).slice(0,5),16),4);
}
function licDevShow(){ return licDevTag(licDevId()); }
function licDevTagOk(tag){
  if(!tag || tag==='0000') return true;          /* 未绑定设备的通用码 */
  var h=licDevHist(), i;
  for(i=0;i<h.length;i++){ if(licDevTag(h[i])===tag) return true; }
  return false;
}
function licNorm(c){
  if(!c) return '';
  c=String(c).toUpperCase().replace(/[-\s]/g,'').replace(/O/g,'0').replace(/I/g,'1').replace(/L/g,'1');
  var o=''; for(var i=0;i<c.length;i++){ if(B32.indexOf(c[i])>=0) o+=c[i]; }
  return o;
}
function licFmt(c){
  c=String(c||''); var o=[], i;
  for(i=0;i<c.length;i+=4) o.push(c.substr(i,4));
  return o.join('-');
}
function licRand4(){ var s=''; for(var i=0;i<4;i++) s+=B32[Math.floor(Math.random()*32)]; return s; }
/* dev 为空 → 12 位通用码；dev 为 4 位设备标签 → 16 位设备绑定码 */
function licMake(exp, dev){
  var p=String(exp).split('-');
  var days=Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-LIC_EPOCH)/86400000);
  var pay=b32enc(days,4), rnd=licRand4(), out='';
  if(dev && dev!=='0000'){
    var sg=licSig(pay+dev, rnd), i, j;
    for(i=0;i<16;i++){ j=Math.floor(i/4);
      out += (i%4===0)?pay[j]:((i%4===1)?dev[j]:((i%4===2)?rnd[j]:sg[j])); }
    return out;
  }
  var sg0=licSig(pay,rnd), k, m;
  for(k=0;k<12;k++){ m=Math.floor(k/3); out+=(k%3===0)?pay[m]:((k%3===1)?rnd[m]:sg0[m]); }
  return out;
}
function licParse(code){
  var c=licNorm(code), n=c.length;
  if(n!==12 && n!==16) return {ok:false,why:'授权码格式不对（应为 12 位或 16 位）'};
  var pay,rnd,sg,dev='0000';
  if(n===16){
    pay=c[0]+c[4]+c[8]+c[12]; dev=c[1]+c[5]+c[9]+c[13];
    rnd=c[2]+c[6]+c[10]+c[14]; sg=c[3]+c[7]+c[11]+c[15];
  }else{
    pay=c[0]+c[3]+c[6]+c[9]; rnd=c[1]+c[4]+c[7]+c[10]; sg=c[2]+c[5]+c[8]+c[11];
  }
  if(licSig(pay+((n===16)?dev:''),rnd)!==sg) return {ok:false,why:'授权码无效，请核对后重试'};
  var d=new Date(LIC_EPOCH+b32dec(pay)*86400000), q=function(n){return ('0'+n).slice(-2)};
  return {ok:true,expire:d.getUTCFullYear()+'-'+q(d.getUTCMonth()+1)+'-'+q(d.getUTCDate()),dev:dev};
}
/* 按 (数量,单位) 算到期日；月/年按日历推进，1月31日+1个月=2月28/29日 */
function admExpire(val,unit){
  var d=new Date(), y=d.getFullYear(), m=d.getMonth(), dd=d.getDate();
  var ny,nm,dim;
  if(unit==='day')       { return admFmt(new Date(y,m,dd+val)); }
  else if(unit==='week') { return admFmt(new Date(y,m,dd+val*7)); }
  else if(unit==='month'){ nm=m+val; ny=y+Math.floor(nm/12); nm=((nm%12)+12)%12;
                           dim=new Date(ny,nm+1,0).getDate(); return admFmt(new Date(ny,nm,Math.min(dd,dim))); }
  ny=y+val; dim=new Date(ny,m+1,0).getDate();
  return admFmt(new Date(ny,m,Math.min(dd,dim)));
}
function admFmt(t){ var q=function(n){return ('0'+n).slice(-2)};

/* ---------- 管理员密码（本机修改） ----------
   页面是纯静态的，密码散列构建时烤进 LICENSE.admin.hash，页面内无法改写它。
   所以「修改密码」分两层：
     1) 本机立即生效：把新散列存 localStorage，登录时优先用；
     2) 所有访客生效：导出新 license.json → 重新构建 → 推送（见 admPwdDone）。
   本机记录带 base = 当时的内嵌散列。一旦产物重建换了内嵌密码，
   base 对不上就自动丢弃本机记录，避免新旧两套密码互相打架。 */
var ADM_PWD_KEY='lc_adminpwd';
function admPwdGet(){
  try{
    var j=JSON.parse(localStorage.getItem(ADM_PWD_KEY)||'null');
    return (j && /^[0-9a-f]{24}$/.test(j.hash||'')) ? j : null;
  }catch(e){ return null; }
}
function admPwdSet(o){ try{ localStorage.setItem(ADM_PWD_KEY, JSON.stringify(o)); }catch(e){} }
function admPwdClear(){ try{ localStorage.removeItem(ADM_PWD_KEY); }catch(e){} }
function admNow(){
  var a=admCfg(); if(!a) return null;
  var o=admPwdGet();
  if(o && o.base===a.hash) return {user:a.user, hash:o.hash, local:true, at:o.at||''};
  return {user:a.user, hash:a.hash, local:false, at:''};
}
function admInitMenu(){

  /* 独立的「生成授权码」菜单项：登录后常驻在菜单里，关掉弹窗也能再打开 */
  var g=$('side-admgen'); if(g) g.style.display = (has&&on)?'':'none';
  /* 管理员本人免激活，菜单里再显示「访问授权」就是多余的 */
  var l=$('side-lic'); if(l) l.style.display = (on||!LICENSE)?'none':'';
}

  if(!LICENSE) return;

}

/* ---------- 授权登记管理（管理员解绑设备用）----------
   用户换手机、清了浏览器数据后，旧绑定会拦住他。管理员在这里解绑即可。 */
function admReg(){
  var h='<div class="mh">授权登记<span onclick="closeHelp()">×</span></div><div class="mb">';
  h+='<div id="reg-body"><div style="font-size:13px;color:var(--fg7)">正在读取登记表…</div></div>';
  h+='<div class="btns" style="margin-top:12px"><button class="g" onclick="admShowPanel()">返回</button></div></div>';
  modalBox(h);
  admRegLoad();
}
function admRegLoad(){
  var box=$('reg-body'); if(!box) return;
  regGet().then(function(j){
    var ks=Object.keys(j.bind||{});
    if(!ks.length){ box.innerHTML='<div class="note" style="padding:8px 0">'
      +'还没有任何设备激活过。用户首次激活后会自动登记到这里。</div>'; return; }
    var h='<div class="note" style="padding:8px 0">已绑定 <b>'+ks.length+'</b> 个授权码，一个码对应一台设备。</div>';
    ks.forEach(function(k){
      var b=j.bind[k]||{};
      h+='<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--bd)">'
        +'<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600">'+esc(licFmt(k))+'</div>'
        +'<div style="font-size:11.5px;color:var(--fg7)">设备 '+esc(String(b.dev||'').slice(0,8))
        +' · 激活于 '+esc(b.at||'-')+'</div></div>'
        +'<button class="delbtn" onclick="admRegUnbind(\''+esc(k)+'\')">解绑</button></div>';
    });
    box.innerHTML=h;
  }, function(){
    box.innerHTML='<div class="e">读取失败，请检查网络后重试</div>';
  });
}
function admRegUnbind(k){
  regGet().then(function(j){
    if(j.bind[k]){ delete j.bind[k]; return regPut(j); }
  }).then(function(){ toast('已解绑，该码可在新设备激活'); admRegLoad(); },
          function(){ toast('解绑失败，请检查网络'); });
}

function admLogin(){
  var u=(($('adm-u')&&$('adm-u').value)||'').trim();
  var p=(($('adm-p')&&$('adm-p').value)||'');
  var box=$('adm-msg'), a=admNow();
  function say(t,c){ if(box) box.innerHTML='<div class="'+(c||'e')+'">'+esc(t)+'</div>'; }
  if(!a){ say('本页未配置管理员账号'); return; }
  if(!u||!p){ say('请输入用户名和密码'); return; }
  if(licH('LCADMIN|'+u+'|'+p)!==a.hash){ say('用户名或密码不对'); return; }
  var blocked=licBlocked();          /* 必须在登录标记写入前判断，否则永远是不阻塞 */
  try{ sessionStorage.setItem('lc_admin','1'); }catch(e){}
  admInitMenu(); admAutoLic();
  if(blocked) boot();          /* 之前是锁屏，登录后要真正进入页面 */
  admShowGen();
}
function admLogout(){
  try{ sessionStorage.removeItem('lc_admin'); }catch(e){}
  /* 若本机是靠管理员身份免激活进入的，退出后要回到锁屏，不能继续免费用 */
  var o=licGet();
  if(o && o.code==='ADMIN'){ try{ localStorage.removeItem('lc_lic'); }catch(e){} }
  S.admOut=[];                        /* 清掉本次签发的码，避免退出后还留在内存里 */
  closeHelp();                        /* 关掉弹窗，否则它会盖住锁屏页 */
  closeSide();                        /* 侧边菜单也收起来 */
  admInitMenu(); licInitMenu();
  /* 退出后若不再满足授权，必须回到锁屏：render 在 blocked 时只写锁屏，
     但保险起见这里显式重跑一次 boot 的完整分支 */
  var m=$('main');
  if(licBlocked()){
    if(m) m.innerHTML=renderLock();
    renderLockChrome();
    licInitMenu();
  }else{
    render();
  }
  toast('已退出管理员');
}

function admPwdDownload(name,txt,type){
  if(!txt){ toast('请先完成修改密码'); return; }
  try{
    var b=new Blob([txt],{type:type||'text/plain;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download=name; a.click();
    setTimeout(function(){ try{ URL.revokeObjectURL(a.href); }catch(e){} },1000);
  }catch(e){ toast('下载失败，请改用「复制完整配置」'); }
}

function licExpired(){ return !!(LICENSE && LICENSE.expire && licToday() > LICENSE.expire); }
function licGet(){ try{ return JSON.parse(localStorage.getItem('lc_lic')||'null'); }catch(e){ return null; } }
function licSet(o){ try{ localStorage.setItem('lc_lic', JSON.stringify(o)); }catch(e){} }
function licValid(){
  if(!LICENSE) return true;
  if(admIn()) return true;                 /* 管理员本人免激活 */
  var o=licGet();
  if(!o || !o.code || !o.key) return false;
  /* 自校验码：用它自带的到期日；预置码：用全局到期日 */
  if(o.exp && /^\d{4}-\d{2}-\d{2}$/.test(o.exp)){ if(licToday()>o.exp) return false; }
  else if(licExpired()) return false;
  return o.key === licH(LICENSE.salt+'|'+o.code+'|'+licFp());
}
function licBlocked(){ return !!LICENSE && !licValid(); }
/* 先查预置码表，再按自校验码解析；返回 {ok,expire,why} */
function licCheck(code){
  if(!LICENSE) return {ok:true, expire:''};
  var raw=String(code||'').trim().toUpperCase(), c=licNorm(code);
  var tries=[]; if(raw) tries.push(raw); if(c&&c!==raw) tries.push(licFmt(c));
  for(var i=0;i<tries.length;i++){
    if((LICENSE.codes||[]).indexOf(licH(LICENSE.salt+'|'+tries[i]))>=0){
      if(licExpired()) return {ok:false, why:'授权已于 '+LICENSE.expire+' 到期，请联系管理员续期'};
      return {ok:true, expire:LICENSE.expire||''};
    }
  }
  var r=licParse(c);
  if(!r.ok) return {ok:false, why:r.why};
  if(!licDevTagOk(r.dev))
    return {ok:false, why:'该授权码已绑定其他设备，无法在本机激活（本机设备码 '+licDevShow()+'）'};
  if(licToday()>r.expire) return {ok:false, why:'该授权码已于 '+r.expire+' 到期，请联系管理员续期'};
  return {ok:true, expire:r.expire, dev:r.dev};
}
function licActivate(){
  var el=$('lic-in'), code=((el&&el.value)||'').trim().toUpperCase();
  var box=$('lic-msg');
  function say(t,c){ if(box) box.innerHTML='<div class="'+(c||'e')+'">'+esc(t)+'</div>'; }
  if(!code){ say('请输入授权码'); return; }
  var r=licCheck(code);
  if(!r.ok){ say(r.why||'授权码无效，请核对后重试'); return; }
  var dev=licDevId();
  var save=function(){
    licSet({code:code, dev:dev, key:licH(LICENSE.salt+'|'+code+'|'+licFp()),
            at:Date.now(), exp:r.expire||''});
    licInitMenu(); boot();
  };
  if(!regUrl()){ save(); return; }      /* 未配置登记表：仅本机绑定 */
  say('正在验证，请稍候…','');
  regGet().then(function(j){
    var b=j.bind[licNorm(code)];
    if(b && !licDevMatch(b.dev)){
      say('该授权码已在另一台设备激活（'+(b.at||'')+'），一个授权码只能绑定一台设备。'
          +'如需换机请联系管理员解绑。');
      return;
    }
    if(!b){
      /* 重新读一次再写，尽量降低两设备同时激活时的覆盖概率 */
      return regGet().then(function(j2){
        var b2=j2.bind[licNorm(code)];
        if(b2 && !licDevMatch(b2.dev)){
          say('该授权码已在另一台设备激活（'+(b2.at||'')+'），一个授权码只能绑定一台设备。');
          return;
        }
        j2.bind[licNorm(code)]={dev:dev, at:licToday()};
        return regPut(j2).then(save, function(){
          say('无法写入授权登记，请检查网络后重试');
        });
      });
    }
    save();
  }, function(){
    /* 连不上登记表：本机此前已用同码激活过才放行，否则必须联网 */
    var o=licGet();
    if(o && o.code===code && o.dev && licDevMatch(o.dev)){ save(); return; }
    say('无法连接授权服务器，请联网后重试（首次激活必须联网）');
  });
}
/* 已激活用户每次打开时复查：若登记表中该码已归别的设备（管理员解绑后他人占用），就地锁定 */
function licRecheck(){
  if(!regUrl() || licBlocked()) return;
  var o=licGet(); if(!o || !o.code) return;
  regGet().then(function(j){
    var b=j.bind[licNorm(o.code)];
    if(b && !licDevMatch(b.dev)){
      try{ localStorage.removeItem('lc_lic'); }catch(e){}
      licInitMenu(); render();
      toast('该授权码已在另一台设备激活，本机已退出');
    }else if(!b){
      /* 管理员清空过登记表，补登回来，避免老用户被误锁 */
      j.bind[licNorm(o.code)]={dev:licDevId(), at:licToday()};
      regPut(j)['catch'](function(){});
    }
  }, function(){});       /* 离线时静默放行，不打扰正常使用 */
}
function licDeactivate(){
  var o=licGet();
  try{ localStorage.removeItem('lc_lic'); }catch(e){}
  /* 主动解绑：把登记表中自己的记录删掉，这个码就能换到别的设备用 */
  if(o && o.code && regUrl()){
    regGet().then(function(j){
      if(j.bind[licNorm(o.code)]){ delete j.bind[licNorm(o.code)]; regPut(j)['catch'](function(){}); }
    }, function(){});
  }
  licInitMenu(); render();
}

function lcWrite(lot,d){

           localStorage.removeItem('lcd_'+_all[_i]);
           localStorage.removeItem('lcst_'+_all[_i]); }
         localStorage.setItem('lcd_'+lot, JSON.stringify(d));
         localStorage.setItem('lcst_'+lot, lcStamp(d)); }catch(e2){}
  }

/* ---------- 加载 ---------- */
function load(lot, force){
  /* 静态托管模式：优先读同目录 data/xx.json（无需后端，免备案可分享）
     读不到再回退到后端 /api/history（自建服务器 / 云函数部署时用） */
  return fetch('./data/'+lot+'.json', {cache:'no-store'}).then(function(r){
    if(!r.ok) throw new Error('no-static');
    var ct = r.headers.get('content-type')||'';
    if(ct.indexOf('text/html')>=0) throw new Error('no-static');
    return r.json();
  }).then(function(d){
    if(!d || !d.rows || !d.rows.length) throw new Error('no-static');
    d.staticMode = true; return d;
  }).catch(function(){
    if(S.noApi) throw new Error('数据文件缺失');
    return api('/history?lot='+lot+(force?'&force=1':''));
  }).then(function(d){
    if(!d || !d.rows || !d.rows.length) throw new Error('空数据');
    D[lot]=d; lcWrite(lot,d); return d;
  });
}
function ensure(lot){
  if(D[lot]) return Promise.resolve(D[lot]);
  /* 非内嵌版：先用本机缓存立刻出画面，再后台静默拉新数据 */
  if(typeof EMBEDDED_META==='undefined'){
    var c=lcRead(lot);
    if(c){
      D[lot]=c;
      try{ render(); }catch(e){}
      load(lot).then(function(d){
        if(lcStamp(d)!==lcStamp(c)){ D[lot]=d; lcWrite(lot,d); if(S.lot===lot){ try{ render(); }catch(e){} } }
      }).catch(function(){});
      return Promise.resolve(c);
    }
  }
  showLoading();
  return load(lot).catch(function(e1){
    /* 静态模式下没有后端可重试，直接报错；有后端时强制刷新重试一次 */
    if(S.noApi){ showError((e1.message||String(e1))+'（静态托管模式：请重新上传 data/'+lot+'.json）'); throw e1; }
    return load(lot, true).catch(function(e2){ showError(e2.message||String(e2)); throw e2; });
  });
}

  return o+':'+(n-o);

function sumRed(r){var s=0;for(var i=0;i<r[2].length;i++)s+=r[2][i];return s}
function fmtBalls(r,big){
  var h='<div class="balls">', c=big?'b r big':'b r', cb=big?'b bl big':'b bl';
  for(var i=0;i<r[2].length;i++) h+='<span class="'+c+'">'+pad(r[2][i])+'</span>';
  if(r[3] && r[3].length){
    h+='<span class="sep">+</span>';
    for(var j=0;j<r[3].length;j++) h+='<span class="'+cb+'">'+pad(r[3][j])+'</span>';
  }
  return h+'</div>';
}
function rbOverlap(r){
  var s={};
  for(var i=0;i<r[2].length;i++) s[r[2][i]]=1;
  for(var j=0;j<r[3].length;j++) if(s[r[3][j]]) return true;
  return false;
}
function sameArr(a,b){
  if(!a||!b||a.length!==b.length) return false;
  for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
  return true;
}

/* ---------- 开奖记录 ---------- */
function listRows(){
  var arr=D[S.lot].rows.slice(), k=S.listSort.k, dir=S.listSort.dir;
  arr.sort(function(a,b){
    var x,y;
    if(k===0){x=a[0];y=b[0]}
    else if(k===1){x=a[1];y=b[1]}
    else if(k===2){x=a[0];y=b[0]}
    else if(k===3){
      var oa=0,ob=0,i;
      for(i=0;i<a[2].length;i++) if(a[2][i]%2) oa++;
      for(i=0;i<b[2].length;i++) if(b[2][i]%2) ob++;
      if(oa!==ob) return (oa<ob?-dir:dir);
      x=a[0];y=b[0];
    } else {x=sumRed(a);y=sumRed(b)}
    if(x<y) return -dir; if(x>y) return dir; return a[0]<b[0]?1:-1;
  });
  return arr;
}
function setListQ(v){ S.listQ=v; S.listLimit=60; render(); }
/* 开奖历史：表格 / 走势图 双视图切换。
   两者是同一批数据的两种呈现方式，合并为一个页签，省去来回切页签。
   注意：两个视图的展开量（S.listLimit / S.distLimit）各自独立保留。 */
function histViewBar(){
  var v=S.histView||'list';
  return '<div class="card" style="padding:8px 12px"><div class="seg">'
    +'<button class="'+(v==='list'?'on':'')+'" onclick="S.histView=\'list\';render()">表格</button>'
    +'<button class="'+(v==='trend'?'on':'')+'" onclick="S.histView=\'trend\';render()">走势图</button>'
    +'</div>'
    +'<div class="note" style="margin-top:6px">'
    +(v==='list'?'表格视图：按期号/日期排序、可搜索期号'
                :'走势视图：红球与蓝球画在同一张图，右半部为蓝球')
    +'</div></div>';
}
function renderHist(){
  return histViewBar() + ((S.histView==='trend') ? renderTrend() : renderList());
}
function renderHist3(){
  return histViewBar() + ((S.histView==='trend') ? renderTrend3() : renderList3());
}
function renderList(){
  var all=listRows(), q=String(S.listQ||'').trim();
  if(q){
    all=all.filter(function(r){
      return String(r[0]).indexOf(q)>=0 || String(r[1]).indexOf(q)>=0;
    });
  }
  var show=all.slice(0,S.listLimit);

    +'<div class="frow" style="padding:10px 12px 0;margin-bottom:0">'
    +'<input class="ipt wide" id="lq" type="text" inputmode="numeric" placeholder="搜索期号或日期，如 2026122 或 2026-10-25" '
    +'value="'+esc(S.listQ)+'" oninput="setListQ(this.value)">'
    +(q?'<span style="font-size:12.5px;color:#c33;cursor:pointer;padding:7px 4px" onclick="setListQ(\'\')">清除</span>':'')
    +'</div>'
    +'<div class="bar"><label>'+(q?('匹配 <b>'+all.length+'</b> 期'):('共 '+all.length+' 期'))+'</label>'
    +'<label style="color:#aaa;font-size:12px">默认期号降序 ▼，点击表头切换</label></div>'
    +'<div class="scroll"><table><thead><tr>';
  for(var c=0;c<cols.length;c++)
    h+='<th class="'+(S.listSort.k===c?'act':'')+'" onclick="sortList('+c+')">'
      +cols[c]+(S.listSort.k===c?'<span class="ar">'+(S.listSort.dir===1?'▲':'▼')+'</span>':'')+'</th>';
  h+='</tr></thead><tbody>';
  for(var i=0;i<show.length;i++){
    var r=show[i];
    h+='<tr class="'+(rbOverlap(r)?'hl':'')+'"><td>'+r[0]+'</td><td class="l">'+r[1]+'</td>'
      +'<td>'+fmtBalls(r)+'</td><td>'+oddStr(r)+'</td><td>'+sumRed(r)+'</td></tr>';
  }
  h+='</tbody></table></div>';
  if(q && !all.length)
    h+='<div class="empty">没有匹配的期号<br><span style="font-size:12px">试试输完整期号，如 '+D[S.lot].rows[D[S.lot].rows.length-1][0]+'</span></div>';
  if(S.listLimit<all.length){
    if(S.listLimit<LIST_MAX)
      h+='<button class="more" onclick="S.listLimit+=60;render()">加载更多（还有 '+(all.length-S.listLimit)+' 期）</button>';
    else
      h+='<div class="note" style="text-align:center;padding:10px">已显示 '+Math.min(S.listLimit,all.length)+' 期（上限）· 要查更早的期号请用上方搜索框</div>';
  }
  if(S.listLimit>60)
    h+='<button class="more" onclick="listBackTop()">↑ 回到最新 60 期</button>';
  h+='<div class="note">黄底行 = 该期'+D[S.lot].blueLabel+'与'+D[S.lot].redLabel+'号码有重合</div></div>';
  return h;
}
function sortList(k){
  if(S.listSort.k===k) S.listSort.dir*=-1; else {S.listSort.k=k;S.listSort.dir=1}
  render();
}

/* ---------- 号码走势 ---------- */
/* 只画「历史号码分布」圆点图 + 单号统计卡，不画折线 */

/* ---------- 和值走势（选号型 / 按位型共用） ----------
   和值＝当期号码之和：选号型取红球（前区），按位型取三位数字。
   纵轴固定用「全历史」范围，不随窗口变化而缩放；金色虚线是全历史均值，
   只作参照。折线仅是已开奖结果的连线，不代表任何可外推的规律。 */
function sumTrendBlock(rows, label){
  var d=D[S.lot], all=d.rows, ink=svgInk(), i, v;
  if(!rows||rows.length<2||!all.length) return '';
  var lo=Infinity, hi=-Infinity, tot=0;
  for(i=0;i<all.length;i++){
    v=sumRed(all[i]);
    if(v<lo) lo=v;
    if(v>hi) hi=v;
    tot+=v;
  }
  var avg=tot/all.length, pad=Math.max(2,(hi-lo)*0.08);
  var y0=Math.max(0,Math.floor(lo-pad)), y1=Math.ceil(hi+pad);
  if(y1<=y0) y1=y0+1;
  var N=rows.length, vals=[], wmin=Infinity, wmax=-Infinity;
  for(i=0;i<N;i++){
    vals.push(sumRed(rows[i]));
    if(vals[i]<wmin) wmin=vals[i];
    if(vals[i]>wmax) wmax=vals[i];
  }
  var last=vals[N-1];
  var PL=36, PR=16, PT=16, PB=28, H=196;
  var W=Math.max(320, Math.min(1800, 48+N*14));
  var iw=W-PL-PR, ih=H-PT-PB;
  function X(k){ return PL + (N>1? k*iw/(N-1) : iw/2); }
  function Y(t){ return PT + ih - (t-y0)/(y1-y0)*ih; }
  var accent=isDark()?'#e8b13a':'#c98a00';
  function mini(k,val,col){
    return '<div style="flex:1;min-width:70px;background:var(--surface2);border-radius:8px;padding:7px 9px">'
      +'<div style="font-size:11px;color:var(--fg4,#999)">'+k+'</div>'
      +'<div style="font-size:17px;font-weight:700;'+(col?'color:'+col+';':'')+'">'+val+'</div></div>';
  }
  var h='<div class="sec">和值走势</div>'
    +'<div style="display:flex;gap:8px;padding:9px 12px 2px;flex-wrap:wrap">'
    +mini('最新',last,accent)+mini('全史均值',avg.toFixed(1))
    +mini('本窗口',wmin+'~'+wmax)+mini('全史范围',lo+'~'+hi)
    +'</div>';
  var sv='<div class="svgwrap" style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" '
    +'width="'+W+'" height="'+H+'" style="display:block;background:var(--surface);border-radius:8px">';
  for(var g=0;g<=4;g++){
    var gv=y0+(y1-y0)*g/4, gy=Y(gv);
    sv+='<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)
      +'" stroke="'+ink.line+'" stroke-width="1" opacity=".55"/>'
      +'<text x="'+(PL-7)+'" y="'+(gy+3.5).toFixed(1)+'" font-size="10" fill="'+ink.head
      +'" text-anchor="end">'+Math.round(gv)+'</text>';
  }
  var ay=Y(avg);
  sv+='<line x1="'+PL+'" y1="'+ay.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+ay.toFixed(1)
    +'" stroke="'+accent+'" stroke-width="1.2" stroke-dasharray="5 4" opacity=".85"/>'
    +'<text x="'+(W-PR-2)+'" y="'+(ay-5).toFixed(1)+'" font-size="10" fill="'+accent
    +'" text-anchor="end">均值 '+avg.toFixed(1)+'</text>';
  var pts='';
  for(i=0;i<N;i++) pts+=(i?' ':'')+X(i).toFixed(1)+','+Y(vals[i]).toFixed(1);
  sv+='<polyline points="'+pts+'" fill="none" stroke="#2b6cd4" stroke-width="1.8" '
    +'stroke-linejoin="round" stroke-linecap="round"/>';
  for(i=0;i<N;i++){
    var cx=X(i), cy=Y(vals[i]), rr=(i===N-1)?3.8:1.9;
    sv+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+rr+'" fill="'
      +(i===N-1?accent:'#2b6cd4')+'"/>';
  }
  sv+='<text x="'+X(N-1).toFixed(1)+'" y="'+(Y(last)-9).toFixed(1)+'" font-size="11" '
    +'font-weight="700" fill="'+accent+'" text-anchor="end">'+last+'</text>';
  sv+='<text x="'+PL+'" y="'+(H-8)+'" font-size="10" fill="'+ink.head+'">'+rows[0][0]+'</text>'
    +'<text x="'+(W-PR)+'" y="'+(H-8)+'" font-size="10" fill="'+ink.head
    +'" text-anchor="end">'+rows[N-1][0]+'</text>';
  sv+='</svg></div>';
  h+=sv;
  h+='<div class="lgd"><span class="lgb" style="background:#2b6cd4"></span>每期和值'
    +'<span class="lgb" style="background:'+accent+';margin-left:8px"></span>全历史均值（虚线）'
    +'<span style="margin-left:auto">'+label+'</span></div>';
  h+='<div class="note">和值＝当期'+(isPos()?'三位数字':d.redLabel)+'之和。'
    +'纵轴固定为<b>全历史范围</b>，切换窗口不会改变刻度；连线只是已开奖结果，不代表任何规律。</div>';
  return h;
}

/* 期数范围：近一个月 / 近一年 / 全部（按开奖日期计算） */
function scopeRows(kind){
  var all=D[S.lot].rows;
  if(kind==='all') return {rows:all, n:all.length, label:'全部'};
  /* 按「期数」取窗口（给按位走势用） */
  if(kind==='d10'){
    var s=all.slice(Math.max(0,all.length-10));
    return {rows:s, n:s.length, label:'近 10 期'};
  }
  var days=(kind==='month')?30:(kind==='m3')?90:365;
  var t=new Date(all[all.length-1][1]).getTime();
  var i=all.length-1;
  while(i>0 && new Date(all[i][1]).getTime() > t-days*86400000) i--;
  return {rows:all.slice(i), n:all.length-i,
    label:(kind==='month')?'近一个月':(kind==='m3')?'近三个月':'近一年'};
}
function renderTrend(){
  var d=D[S.lot];
  var all=d.rows.slice().reverse();          /* 最新在前 */
  var lim=S.distLimit||20;
  var disp=all.slice(0,lim);                 /* 当前显示（最新 N 期） */
  var h='<div class="card"><div class="bar"><label>历史号码分布</label>'
   +'<label style="color:#aaa;font-size:12px">共 '+all.length+' 期，默认最新 '+lim+' 期</label></div>';
  h+=distChart(disp,d,all.length,lim);
  h+=sumTrendBlock(disp.slice().reverse(), '最新 '+disp.length+' 期');
  h+=numStatCard();
  h+='<div class="note">左列＝开奖日期，圆点＝该期开出的'+d.redLabel+'。'
    +'均为<b>已开奖结果的统计</b>，每个号码每期出现概率恒定，历史冷热不影响未来。</div></div>';
  return h;
}

/* 历史号码分布图：行=日期，列=号码；左侧 '+d.redLabel+' + 右侧 '+d.blueLabel+' 画在同一个图里 */
function distChart(rows,d,total,lim){
  var max=d.redMax, bmax=d.blueMax||0, padL=54, headH=38;  /* 头部加高，容纳分组标签 */
  var xr=padL-6;                        /* 左列统一右对齐位置 */
  var avail=vw()-26-2;
  var gap=12;                           /* 红球区与蓝球区之间的间隔 */
  var cols=max+bmax;
  var cw=Math.max(11, Math.min(20, (avail-padL-6-gap)/Math.max(1,cols)));
  var rh=Math.max(26, Math.min(30, cw+11));   /* 两行文字需更高行距 */
  var bx0=padL+max*cw+gap;                    /* 蓝球区起点 */
  var H=headH+rows.length*rh+8, W=bx0+bmax*cw+6;
  var ink=svgInk();
  var bcol=isDark()?'#5b8ff9':'#2b6cd4';
  var s='<div class="svgwrap" style="overflow-x:auto"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  /* 顶部号码彩条：红球 */
  for(var n=1;n<=max;n++){
    var x=padL+(n-1)*cw;
    s+='<rect x="'+(x+0.5)+'" y="3" width="'+(cw-2)+'" height="18" rx="2" fill="'+numColor(n,max)+'"/>';
    s+='<text x="'+(x+cw/2)+'" y="'+(16)+'" font-size="8" fill="#fff" text-anchor="middle"'
      +' font-weight="600" pointer-events="none">'+n+'</text>';
  }
  /* 顶部号码彩条：蓝球（同一张图，紧跟在红球右侧） */
  for(var b0=1;b0<=bmax;b0++){
    var bx=bx0+(b0-1)*cw;
    s+='<rect x="'+(bx+0.5)+'" y="3" width="'+(cw-2)+'" height="18" rx="2" fill="'+bcol+'"/>';
    s+='<text x="'+(bx+cw/2)+'" y="'+(16)+'" font-size="8" fill="#fff" text-anchor="middle"'
      +' font-weight="600" pointer-events="none">'+b0+'</text>';
  }
  /* 分组标签：明确标出哪一段是红球、哪一段是蓝球（蓝球区在右侧，窄屏需左右滑动） */
  s+='<text x="'+(padL+max*cw/2)+'" y="34" font-size="8.5" fill="'+ink.head+'" text-anchor="middle"'
    +' font-weight="700" pointer-events="none">'+d.redLabel+' 1~'+max+'</text>';
  if(bmax) s+='<text x="'+(bx0+bmax*cw/2)+'" y="34" font-size="8.5" fill="'+bcol+'" text-anchor="middle"'
    +' font-weight="700" pointer-events="none">'+d.blueLabel+' 1~'+bmax+'</text>';
  /* 红球区 / 蓝球区 之间的分隔线 */
  if(bmax) s+='<rect x="'+(bx0-gap/2)+'" y="2" width="1" height="'+(H-4)+'" fill="'+ink.line+'" opacity=".55"/>';
  s+='<text x="'+xr+'" y="10" font-size="7.5" fill="'+ink.head+'" text-anchor="end">期号</text>';
  s+='<text x="'+xr+'" y="21" font-size="7.5" fill="'+ink.head+'" text-anchor="end">开奖日期</text>';
  /* 逐期 */
  for(var i=0;i<rows.length;i++){
    var y=headH+i*rh, cy=y+rh/2;
    if(i%2===1) s+='<rect x="0" y="'+y+'" width="'+W+'" height="'+rh+'" fill="'+ink.zebra+'"/>';
    /* 第一行：期号（与表格视图一致） */
    s+='<text x="'+xr+'" y="'+(cy-2)+'" font-size="8" fill="'+ink.issue+'" text-anchor="end"'
      +' font-weight="600">'+rows[i][0]+'</text>';
    /* 第二行：完整开奖日期（含年份） */
    s+='<text x="'+xr+'" y="'+(cy+9)+'" font-size="6.8" fill="'+ink.date+'" text-anchor="end">'
      +rows[i][1]+'</text>';
    /* 红球圆点 */
    var arr=rows[i][2].slice().sort(function(a,b){return a-b});
    for(var k2=0;k2<arr.length;k2++){
      var cx=padL+(arr[k2]-1)*cw+cw/2, r=Math.min(cw,rh)/2-1.5;
      s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+numColor(arr[k2],max)+'"/>';
      if(cw>=14) s+='<text x="'+cx+'" y="'+(cy+3.4)+'" font-size="8" fill="#fff" text-anchor="middle"'
        +' font-weight="700" pointer-events="none">'+arr[k2]+'</text>';
    }
    /* 蓝球圆点（同一行，画在红球右侧） */
    var brr=(rows[i][3]||[]).slice().sort(function(a,b){return a-b});
    for(var k3=0;k3<brr.length;k3++){
      var bcx=bx0+(brr[k3]-1)*cw+cw/2, br=Math.min(cw,rh)/2-1.5;
      s+='<circle cx="'+bcx+'" cy="'+cy+'" r="'+br+'" fill="'+bcol+'"/>';
      if(cw>=14) s+='<text x="'+bcx+'" y="'+(cy+3.4)+'" font-size="8" fill="#fff" text-anchor="middle"'
        +' font-weight="700" pointer-events="none">'+brr[k3]+'</text>';
    }
  }
  s+='</svg></div>';
  s+='<div class="note">左两列＝<b>期号</b>（与开奖记录一致）与<b>开奖日期</b>；'
    +'中间彩点为 <b>'+d.redLabel+' 1~'+max+'</b>，右侧蓝点为 <b>'+d.blueLabel+' 1~'+bmax+'</b>'
    +'（两者在<b>同一个图</b>里，中间竖线为分界）。<br>'
    +'<b>蓝球在红球右侧</b>，图较宽时可<b>左右滑动</b>查看蓝球区。<br>'
    +'当前显示最新 <b>'+rows.length+'</b> 期（'+rows[rows.length-1][0]+' '+rows[rows.length-1][1]
    +' ~ '+rows[0][0]+' '+rows[0][1]+'）。</div>';
  /* 加载更多 */
  if(lim<total)
    if(lim<DIST_MAX)
      s+='<button class="more" onclick="S.distLimit+=20;render()">加载更多（还有 '+(total-lim)+' 期）</button>';
    else
      s+='<div class="note" style="text-align:center;padding:10px">已显示 '+Math.min(lim,total)+' 期（上限）</div>';
    if(lim>20)
      s+='<button class="more" onclick="distBackTop()">↑ 回到最新 20 期</button>';
  else if(total>20)
    s+='<button class="more" onclick="S.distLimit=20;render()">收起（仅看最新 20 期）</button>';
  return s;
}

/* 单号统计卡（不含折线图） */
function numStatCard(){
  var d=D[S.lot], max=d.redMax;
  var sel=S.trendNum||1; if(sel>max) sel=S.trendNum=1;
  var sc=scopeRows(S.trendScope||'month');
  var s='<div class="bar"><label>单号统计</label>'
   +'<select onchange="S.trendScope=this.value;render()">'
   +[['month','近一个月'],['year','近一年'],['all','全部']].map(function(o){
      return '<option value="'+o[0]+'"'+((S.trendScope||'month')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')
   +'</select></div>';
  s+='<div class="onepickwrap"><div class="onepick">';
  for(var n=1;n<=max;n++){
    var bg=(n===sel)?numColor(n,max):'#f0f0f0';
    s+='<span class="onb'+(n===sel?' sel':'')+'" style="background:'+bg+';'
      +((n===sel)?'color:#fff':'color:#777')+'" onclick="setNum('+n+')">'+pad(n)+'</span>';
  }
  s+='</div></div>';
  s+=statLine(sel,max,sc.rows,sc.label);
  return s;
}

/* 单号统计卡：历史 + 近期窗口 + 遗漏 */
function statLine(num,max,rowsWin,lab){
  lab=lab||'近一个月';
  var all=D[S.lot].rows, d=D[S.lot], col=numColor(num,max);
  /* 全历史 */
  var tot=0, miss=0, mx=0, k;
  for(k=0;k<all.length;k++){
    if(all[k][2].indexOf(num)>=0){ tot++; if(miss>mx) mx=miss; miss=0; }
    else miss++;
  }
  var avg=tot? (all.length/tot):0;
  var first='—', last='—', lastDate='—';
  for(k=0;k<all.length;k++) if(all[k][2].indexOf(num)>=0){ first=all[k][0]; break; }

function heatData(isBlue){
  var d=D[S.lot], max=isBlue?d.blueMax:d.redMax, key=isBlue?3:2;
  var sc=scopeRows(statWinGet());
  var rows=sc.rows, N=sc.rows.length, cnt=[];
  for(var n=0;n<=max;n++) cnt[n]=0;
  for(var i=0;i<rows.length;i++){
    var arr=rows[i][key];
    for(var j=0;j<arr.length;j++) if(arr[j]>=0&&arr[j]<=max) cnt[arr[j]]++;
  }
  var per=isBlue?d.blueCount:d.redCount, p=per/max, exp=N*p, sd=Math.sqrt(N*p*(1-p))||1, out=[];
  for(var n2=1;n2<=max;n2++) out.push({num:n2,cnt:cnt[n2],exp:exp,z:(cnt[n2]-exp)/sd,dev:cnt[n2]-exp});
  return out;
}

/* ---------- 删除选号时同步取消收藏 ----------
   收藏与选号是两份数据：收藏在 favBets_<彩种>，选号在 myBets_<彩种>。

   点「载入」还能把它填回去 —— 等于删不掉。所以删除时一并解除。 */
function favFindIn(lot, item){
  if(!item) return -1;
  var a=favOfLot(lot), k=favKeyOf(item);
  for(var i=0;i<a.length;i++){ if(favKeyOf(a[i])===k) return i; }
  return -1;
}
/* 解除该彩种下与 item 号码相同的收藏；未收藏返回 null，已收藏返回 {name:''} */

  if(i<0) return null;

}

function getRecs(){

  else a.push({lot:lot, r:(bet.r||[]).slice(), b:(bet.b||[]).slice(),

/* 记录的结果：默认用「购买当期」比对（见 recRow）；保存时间晚于所有已知期次则待开奖 */
var LOTNAME={ssq:'双色球', dlt:'大乐透', '3d':'福彩3D', pls:'排列三'};
/* 每注单价：四种玩法都是 2 元 */
function unitPrice(){ return 2; }

/* 这注票对应哪一期的开奖号？
   以前一律拿「最新一期」比对——10 天前买的票会被拿今天的号去对，结果完全是错的。
   正确做法：买的那期 = 保存时间之后的第一个开奖日。
   opt：{latest:true} 强制用最新一期；{issue:'2026123'} 指定期号。 */
function recRow(rec, opt){
  var d=D[rec.lot]; if(!d||!d.rows||!d.rows.length) return null;
  var rows=d.rows, i;
  if(opt && opt.issue){
    for(i=0;i<rows.length;i++) if(String(rows[i][0])===String(opt.issue)) return rows[i];
    return null;
  }
  if(opt && opt.latest) return rows[rows.length-1];
  var _t=normTs(rec.t);
  if(!_t) return rows[rows.length-1];
  /* rows 按开奖日期升序。从后往前找：最后一个「早于购买时刻」的期次，
     它的下一期就是买的那期。绝大多数记录都是近期买的，这样几乎一次命中。 */
  for(i=rows.length-1;i>=0;i--) if(drawMs(rows[i],rec.lot) < _t) return rows[i+1]||null;
  return rows[0];   /* 买在所有已知期次之前 → 用最早一期，不会返回空 */
}
function recResult(rec, opt){
  var d=D[rec.lot]; if(!d||!d.rows||!d.rows.length) return null;
  var row=recRow(rec,opt), i;
  if(!row) return {state:'wait'};
  var p=betPrizeOf(rec.lot, rec.r, rec.b, row[2], row[3]);
  /* k/hb 仅用于列表里「中 X+Y」的展示；按位玩法显示成「中 X 位」 */
  var rk={},k=0,hb=0,bk={};
  for(i=0;i<row[2].length;i++) rk[row[2][i]]=1;
  for(i=0;i<rec.r.length;i++) if(rk[rec.r[i]]) k++;
  for(i=0;i<row[3].length;i++) bk[row[3][i]]=1;
  for(i=0;i<rec.b.length;i++) if(bk[rec.b[i]]) hb++;
  return {state:'done', p:p, k:k, hb:hb, issue:row[0], date:row[1]};
}
/* 待核对 = 已购买 + 那期已开奖 + 自己还没主动核对过。
   不做成「一进页面就算核对过」，否则提醒永远不出现。 */
function pendCheckList(){
  var all=betsOfAll(), out=[], i;
  for(i=0;i<all.length;i++){
    var b=all[i];
    if(!b.bought || b.chk) continue;
    var r=recResult(b,null);
    if(r && r.state==='done') out.push({lot:b.lot, bet:b, r:r});
  }
  return out;
}
/* 核对完打勾：记下核对的是哪期，换期后重新变回待核对 */
function markChecked(lot, ts, issue){
  var a=[]; try{ a=JSON.parse(localStorage.getItem('myBets_'+lot)||'[]'); }catch(e){ a=[]; }
  var n=0;
  for(var i=0;i<a.length;i++){
    if(ts!=null && a[i].t!==ts) continue;
    if(!a[i].bought) continue;
    a[i].chk=1; a[i].chkIss=String(issue||''); n++;
  }
  try{ localStorage.setItem('myBets_'+lot, JSON.stringify(a)); }catch(e){}
  pendClear();
  return n;
}
/* 角标每次 render 都要算，而「找购买当期」要扫期次表，做个 1.5 秒的短缓存 */

function pendCheckCount(){
  if(_pcCache.t && Date.now()-_pcCache.t < 1500) return _pcCache.n;
  _pcCache={t:Date.now(), n:pendCheckList().length};
  return _pcCache.n;
}

/* 时间统一成毫秒时间戳。早期「猜号存入」把 t 写成 'YYYY-MM-DD HH:mm' 字符串，
   所有按期次比对的地方都会得到 NaN，自动对奖会错用全史最早一期。读时归一化并回写。 */
function normTs(t){
  if(typeof t==='number' && isFinite(t)) return t;
  if(typeof t==='string'){
    var v=Date.parse(t.replace(/-/g,'/'));
    if(isFinite(v)) return v;
  }
  return Date.now();
}
/* 把列表里非数字时间戳就地转成毫秒，返回是否需要回写 */
function normBetList(a){
  var ch=false, i;
  if(!Array.isArray(a)) return false;
  for(i=0;i<a.length;i++){
    if(!a[i]) continue;
    var v=a[i].t?normTs(a[i].t):0;
    if(v!==a[i].t){ a[i].t=v; ch=true; }
  }
  return ch;
}
function fmtTs(t){
  var x=new Date(normTs(t)), p=function(n){return ('0'+n).slice(-2)};
  return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())+' '+p(x.getHours())+':'+p(x.getMinutes());
}
/* 筛选：彩种 / 购买状态 / 开奖状态 / 日期区间。返回原始下标，保证删除、标记仍对准 */
function recFilterGet(){
  /* 记录里全是已购买的注，筛选只保留彩种 / 开奖状态 / 日期 */
  if(!S.recF) S.recF={lot:'',res:'',from:'',to:''};
  return S.recF;
}
function recFiltered(){
  var recs=getRecs(), f=recFilterGet(), out=[], i;
  for(i=0;i<recs.length;i++){
    var rc=recs[i];
    if(f.lot && rc.lot!==f.lot) continue;
    var r=recResult(rc), st=r?r.state:'none';   /* wait=待开奖 done=已开奖 */
    if(f.res==='wait' && st!=='wait') continue;
    if(f.res==='done' && st!=='done') continue;
    var ds=fmtTs(rc.t).slice(0,10);
    if(f.from && ds < f.from) continue;
    if(f.to   && ds > f.to)   continue;
    out.push(i);
  }
  return out;
}
function setRecF(k,v){ recFilterGet()[k]=v; S.recDel=-1; S.recClear=false; render(); }
function resetRecF(){ S.recF={lot:'',res:'',from:'',to:''}; S.recDel=-1; S.recClear=false; render(); }

/* ================= 备份 / 恢复（txt） ================= */
/* 记录存在浏览器 localStorage 里，清缓存 / 换设备 / 换域名就会全丢，
   所以做成 txt：既能双击用记事本看懂，又能原样导回 */
var BK_LOTS=['ssq','dlt','3d','pls'];
function betsOfAll(){
  var out=[], i, j;
  for(i=0;i<BK_LOTS.length;i++){
    var a=[]; try{ a=JSON.parse(localStorage.getItem('myBets_'+BK_LOTS[i])||'[]'); }catch(e){ a=[]; }
    for(j=0;j<a.length;j++)
      out.push({lot:BK_LOTS[i], r:a[j].r||[], b:a[j].b||[], t:a[j].t?normTs(a[j].t):0,
               bought:a[j].bought?1:0, chk:a[j].chk?1:0});
  }
  return out;
}
function favOfAll(){
  var out=[], i, j;
  for(i=0;i<BK_LOTS.length;i++){
    var a=[]; try{ a=JSON.parse(localStorage.getItem('favBets_'+BK_LOTS[i])||'[]'); }catch(e){ a=[]; }
    for(j=0;j<a.length;j++)
      out.push({lot:BK_LOTS[i], name:a[j].name||'', r:a[j].r||[], b:a[j].b||[]});
  }
  return out;
}
/* 收藏一行：彩种|名称|号码 */
function bkFavLine(x){
  var d=D[x.lot], nums;
  if(d && d.positional) nums=(x.r||[]).join(' ');
  else nums=(x.r||[]).map(pad).join(' ')+' + '+(x.b||[]).map(pad).join(' ');
  return (LOTNAME[x.lot]||x.lot)+'|'+(x.name||'')+'|'+nums;
}
/* 一行：彩种|号码|状态|时间 */
function bkLine(x){
  var d=D[x.lot], nums;
  if(d && d.positional) nums=(x.r||[]).join(' ');
  else nums=(x.r||[]).map(pad).join(' ')+' + '+(x.b||[]).map(pad).join(' ');
  return (LOTNAME[x.lot]||x.lot)+'|'+nums+'|'+(x.bought?'已购买':'未购买')+'|'+fmtTs(x.t||Date.now());
}
function ymd(){
  var d=new Date(), p=function(n){return ('0'+n).slice(-2)};
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
}
function backupTxt(){
  /* 只备份「我的选号」里已购买的注：
     选号记录（lc_rec）是已购买注的归档视图，号码都来自 myBets_，
     两段一起导会完全重复；未购买的只是临时草稿，不值得占用备份。 */
  var all=betsOfAll(), bets=[], i;
  for(i=0;i<all.length;i++) if(all[i].bought) bets.push(all[i]);
  var L=[];
  L.push('彩票统计 · 我的选号备份');
  L.push('导出时间：'+fmtDt(new Date()));
  L.push('我的选号 '+bets.length+' 条（仅已购买）');
  L.push('');
  L.push('【说明】本文件可用记事本直接打开和编辑。每行格式为：');
  L.push('        彩种|号码|状态|时间');
  L.push('        号码中红球与蓝球之间用「 + 」分隔；福彩3D / 排列三只有三位数字，没有蓝球。');
  L.push('');
  L.push('════════ 我的选号（'+bets.length+' 条，仅已购买）════════');
  for(i=0;i<bets.length;i++) L.push(bkLine(bets[i]));
  L.push('');
  var favs=favOfAll();
  L.push('════════ 我的收藏（'+favs.length+' 组）════════');
  if(favs.length) L.push('【说明】每行格式为：彩种|名称|号码');
  for(i=0;i<favs.length;i++) L.push(bkFavLine(favs[i]));
  L.push('');
  return L.join('\n');
}
function backupDownload(){
  var all=betsOfAll(), n=0, i;
  for(i=0;i<all.length;i++) if(all[i].bought) n++;
  var nf=favOfAll().length;
  /* 收藏也值得备份：即使还没买过号，收藏的号也不能丢 */
  if(!n && !nf){ toast('没有已购买的选号，也没有收藏，无需备份'); return; }
  var txt=backupTxt();
  try{
    var b=new Blob([txt],{type:'text/plain;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='选号备份_'+ymd()+'.txt'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
    try{ localStorage.setItem('lc_bktime', String(Date.now())); }catch(e){}
    toast('已下载备份（txt）');
  }catch(e){ backupShow(txt); toast('下载失败，已显示内容可手动复制'); }
}
/* 时间串 → 毫秒；解析不了就用当前时间，不丢记录 */
function parseTs(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2}))?/.exec(String(s||'').trim());
  if(!m) return Date.now();
  var t=new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),0);
  return isNaN(t.getTime())?Date.now():t.getTime();
}
function parseBackup(txt){
  /* 分两段：我的选号（彩种|号码|状态|时间）与我的收藏（彩种|名称|号码）。
     用段落标记切换；旧备份里的段名「常用号码本」仍按收藏解析，避免老文件恢复时丢号。 */
  var lines=String(txt||'').split(/\r?\n/), recs=[], bets=[], favs=[], bad=0, i;
  var sec='bets';
  for(i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln) continue;
    if(ln.indexOf('════════')===0){
      sec=(ln.indexOf('常用号码本')>=0||ln.indexOf('我的收藏')>=0||ln.indexOf('我的收藏（')>=0)?'fav':'bets';
      continue;
    }
    if(/^(格式|说明|【说明】|导出时间：|彩票统计|我的选号 \d|选号记录 \d|常用号码本 \d)/.test(ln)) continue;
    /* 导出的说明里有一行「彩种|号码|状态|时间」，别把它当成数据行 */
    if(/^彩种\s*\|\s*号码/.test(ln)) continue;
    if(/^彩种\s*\|\s*名称/.test(ln)) continue;
    var p=ln.split('|');
    if(p.length<2) continue;
    var nm=p[0].trim(), lot=null, k;
    for(k in LOTNAME) if(LOTNAME[k]===nm){ lot=k; break; }
    if(!lot){ bad++; continue; }
    if(sec==='fav'){
      /* 收藏：彩种|名称|号码 */
      if(p.length<3){ bad++; continue; }
      var fs2=p[2].split('+'), fr=[], fb=[], fq;
      var frs=fs2[0].trim().split(/\s+/);
      for(fq=0;fq<frs.length;fq++){ var fv=parseInt(frs[fq],10); if(!isNaN(fv)) fr.push(fv); }
      if(fs2[1]){ var fbs=fs2[1].trim().split(/\s+/);
        for(fq=0;fq<fbs.length;fq++){ var fv2=parseInt(fbs[fq],10); if(!isNaN(fv2)) fb.push(fv2); } }
      if(!fr.length){ bad++; continue; }
      favs.push({lot:lot, name:(p[1]||'').trim().slice(0,60), r:fr, b:fb});
      continue;
    }
    var sp=p[1].split('+'), r=[], b=[], q;
    var rs=sp[0].trim().split(/\s+/);
    for(q=0;q<rs.length;q++){ var v=parseInt(rs[q],10); if(!isNaN(v)) r.push(v); }
    if(sp[1]){ var bs=sp[1].trim().split(/\s+/);
      for(q=0;q<bs.length;q++){ var v2=parseInt(bs[q],10); if(!isNaN(v2)) b.push(v2); } }
    if(!r.length){ bad++; continue; }
    var item={lot:lot, r:r, b:b, t:parseTs(p[3]), bought:((p[2]||'').trim()==='已购买')?1:0};
    recs.push(item); bets.push(item);
  }
  return {recs:recs, bets:bets, favs:favs, bad:bad};
}

  var addF=0, fk=function(x){ return x.lot+'|'+(x.r||[]).join(',')+'|'+(x.b||[]).join(','); };

function analyze(reds,blues){
  var d=D[S.lot], rows=d.rows;
  /* 每条选号都要全史扫描一次，切页签/点球都会重算；结果按「彩种+号码」缓存，
     挂在 d 上——数据重新加载时 d 换新对象，缓存自动失效 */
  var _ck=(reds||[]).slice().sort(function(a,b){return a-b}).join(',')+'/'
         +(blues||[]).slice().sort(function(a,b){return a-b}).join(',');
  if(!d._ac) d._ac={};
  if(d._ac[_ck]) return d._ac[_ck];
  var bs={}, j;
  for(j=0;j<blues.length;j++) bs[blues[j]]=1;
  var exact=null, best={overlap:-1}, recentMax=0, kdist={}, prize={}, total=0;
  var nRec=Math.min(5,rows.length);
  for(var i=0;i<rows.length;i++){
    var r=rows[i], rk={};
    for(j=0;j<r[2].length;j++) rk[r[2][j]]=1;
    var k=0, shared=[];
    for(j=0;j<reds.length;j++) if(rk[reds[j]]){ k++; shared.push(reds[j]); }
    var hitB=0;
    for(j=0;j<r[3].length;j++) if(bs[r[3][j]]) hitB++;
    kdist[k]=(kdist[k]||0)+1;
    if(k===d.redCount && r[2].length===reds.length && !exact) exact={issue:r[0],date:r[1],blue:r[3]};
    if(k>best.overlap || (k===best.overlap && r[0]>best.issue))
      best={overlap:k,issue:r[0],date:r[1],red:r[2],shared:shared};
    if(i>=rows.length-nRec && k>recentMax) recentMax=k;
    if(S.lot==='ssq'){
      var p=ssqPrize(k,hitB>0);
      if(p){ prize[p.name]=(prize[p.name]||0)+1; if(p.amt) total+=p.amt; }
    }
  }
  var _res={exact:exact,best:best,recentMax:recentMax,kdist:kdist,prize:prize,total:total,draws:rows.length};
  d._ac[_ck]=_res;
  return _res;
}
function ssqPrize(k,hb){
  if(k===6) return {name:hb?'一等奖':'二等奖', amt:null};
  if(k===5) return hb?{name:'三等奖',amt:3000}:{name:'四等奖',amt:200};
  if(k===4) return hb?{name:'四等奖',amt:200}:{name:'五等奖',amt:10};
  if(k===3) return hb?{name:'五等奖',amt:10}:null;
  if(hb)    return {name:'六等奖',amt:5};
  return null;
}
/* 大乐透：前区 f 个 + 后区 b 个。一/二/三等奖为浮动奖，四~九等奖固定 */
function dltPrize(f,b){
  if(f===5&&b===2) return {name:'一等奖',amt:null};
  if(f===5&&b===1) return {name:'二等奖',amt:null};
  if(f===5&&b===0) return {name:'三等奖',amt:null};
  if(f===4&&b===2) return {name:'四等奖',amt:3000};
  if(f===4&&b===1) return {name:'五等奖',amt:300};
  if(f===3&&b===2) return {name:'六等奖',amt:200};
  if(f===4&&b===0) return {name:'七等奖',amt:100};
  if((f===3&&b===1)||(f===2&&b===2)) return {name:'八等奖',amt:15};
  if((f===3&&b===0)||(f===2&&b===1)||(f===1&&b===2)||(f===0&&b===2)) return {name:'九等奖',amt:5};
  return null;
}
/* 统一入口：根据彩种算奖级 */
function prizeOf(lot,rh,bh){
  return lot==='ssq' ? ssqPrize(rh,bh) : dltPrize(rh,bh);
}
/* 按「号码 vs 开奖号码」直接算奖级：福彩3D / 排列三是按位玩法，
   必须走 posPrize，不能拿去套大乐透的奖级表（否则会算出错误的奖金） */
function betPrizeOf(lot,r,b,hr,hb){
  var d=D[lot];
  if(d && d.positional) return posPrize(r, hr||[]);
  var rk={},k=0,n=0,bk={},i;
  for(i=0;i<(hr||[]).length;i++) rk[hr[i]]=1;
  for(i=0;i<(r||[]).length;i++) if(rk[r[i]]) k++;
  for(i=0;i<(hb||[]).length;i++) bk[hb[i]]=1;
  for(i=0;i<(b||[]).length;i++) if(bk[b[i]]) n++;
  return prizeOf(lot,k,n);
}

/* ========== 开奖日程 / 倒计时 ========== */
/* 北京时间开奖时刻：双色球 周二·周四·周日 21:15；大乐透 周一·周三·周六 20:30 */
var DRAW={ssq:{days:[2,4,0],h:21,m:15,sch:'周二 · 周四 · 周日 21:15 开奖'},
          dlt:{days:[1,3,6],h:20,m:30,sch:'周一 · 周三 · 周六 20:30 开奖'},
          '3d':{days:[0,1,2,3,4,5,6],h:21,m:15,sch:'每天 21:15 开奖'},
          pls:{days:[0,1,2,3,4,5,6],h:21,m:25,sch:'每天 21:25 开奖'}};
var WD=['周日','周一','周二','周三','周四','周五','周六'];
/* 用 UTC 毫秒表示「北京时间某日 H:M」：Date.UTC(y,m,d,H-8,M) 即北京 H:M */
function drawMs(row,lot){
  var cfg=DRAW[lot], p=String(row[1]).split('-');
  if(p.length<3) return 0;
  return Date.UTC(+p[0], +p[1]-1, +p[2], cfg.h-8, cfg.m, 0);
}
function nextDrawMs(lot){
  /* 注意量纲：now 是「真实 UTC 毫秒」；bj 只用来取北京日期，不能拿来比大小 */
  var cfg=DRAW[lot], now=Date.now(), bj=now+8*3600000, c, t;
  for(var i=0;i<8;i++){
    c=new Date(bj+i*86400000);
    if(cfg.days.indexOf(c.getUTCDay())<0) continue;
    t=Date.UTC(c.getUTCFullYear(),c.getUTCMonth(),c.getUTCDate(),cfg.h-8,cfg.m,0);
    if(t>now) return t;
  }
  return null;
}
var cdTimer=null;
function startCountdown(){
  if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
  function tick(){
    var el=document.getElementById('cdown');
    if(!el) return;
    var cfg=DRAW[S.lot], t=nextDrawMs(S.lot);
    if(!t){ el.innerHTML=''; return; }
    var left=t-Date.now();
    var txt, cls='';
    if(left<=0){
      txt='<b>开奖进行中</b><br><span class="sch">官方数据通常几分钟后更新</span>';
    }else{
      var s=Math.floor(left/1000);
      var dd=Math.floor(s/86400), hh=Math.floor(s%86400/3600),
          mm=Math.floor(s%3600/60), ss=s%60;
      var num = dd>0 ? (dd+' 天 '+hh+' 小时 '+mm+' 分')
              : (hh>0 ? (hh+' 小时 '+mm+' 分 '+ss+' 秒')
                      : (mm+' 分 '+ss+' 秒'));
      txt='距下次开奖 <b>'+num+'</b><br><span class="sch">'+cfg.sch
         +' · 今天 '+WD[new Date(Date.now()+8*3600000).getUTCDay()]+'</span>';
    }
    el.innerHTML=txt;
  }
  tick(); cdTimer=setInterval(tick,1000);
}

/* ========== 自选号码：自动对奖 ========== */
/* 返回 {state:'wait'|'done', p:奖级, k:红球中几个, hb:蓝球中几个, issue:期号} */
function betResult(bet){
  var d=D[S.lot], rows=d.rows, i;
  /* 同 recResult：对的是「买的那期」，不是最新一期 */
  var last=recRow({lot:S.lot, t:bet.t}, null);
  if(!last) return {state:'wait'};
  var rk={};
  for(i=0;i<last[2].length;i++) rk[last[2][i]]=1;
  var k=0;
  for(i=0;i<bet.r.length;i++) if(rk[bet.r[i]]) k++;
  var bk={};
  for(i=0;i<last[3].length;i++) bk[last[3][i]]=1;
  var hb=0;
  for(i=0;i<bet.b.length;i++) if(bk[bet.b[i]]) hb++;
  return {state:'done', p:betPrizeOf(S.lot, bet.r, bet.b, last[2], last[3]),
          k:k, hb:hb, issue:last[0], date:last[1]};
}
function betResHtml(bet){
  var d=D[S.lot], r=betResult(bet);
  if(r.state==='wait')
    return '<div class="bres">⏳ <b>待开奖</b> · 已保存，等下一期开奖后自动比对</div>';
  if(r.p)
    return '<div class="bres hit">🎉 <span class="bn">'+r.p.name+'</span>'
      +(r.p.amt?' · <span class="ba">'+r.p.amt+' 元</span>':' · 浮动奖金')
      +' <span style="opacity:.75">（'+esc(r.issue)+' 期 · '+d.redLabel+'中 '+r.k
      +' · '+d.blueLabel+'中 '+r.hb+'）</span></div>';
  return '<div class="bres">未中奖 <span style="opacity:.75">（'+esc(r.issue)+' 期 · '
    +d.redLabel+'中 '+r.k+' · '+d.blueLabel+'中 '+r.hb+'）</span></div>';
}

/* ========== 复制投注文本 ========== */
function betText(bet){ return bet.r.map(pad).join(' ')+' + '+bet.b.map(pad).join(' '); }
function allBetText(){
  var bets=getBets();
  if(!bets.length) return '';
  return bets.map(betText).join('\n');
}
function copyText(s){
  if(!s) return false;
  var ok=false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(s);
      ok=true;
    }
  }catch(e){ ok=false; }
  if(!ok) ok=legacyCopy(s);
  return ok;
}
/* 智能复制：先试 Clipboard API，等它真正成功再提示；
   失败、拒绝或迟迟不返回，都降级到 execCommand，再不行弹手动复制框。 */
function copySmart(s, okMsg, title){
  s=String(s==null?'':s);
  var done=false;
  function done_ok(){ if(done) return; done=true; toast(okMsg); }
  function fallback(){
    if(done) return; done=true;
    if(legacyCopy(s)) toast(okMsg); else copyFallback(s, title||'复制');
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      var r=navigator.clipboard.writeText(s);
      if(r && typeof r.then==='function'){
        r.then(done_ok, fallback);
        setTimeout(fallback, 1200);      /* 一直不返回也别干等 */
        return;
      }
      done_ok(); return;
    }
  }catch(e){}
  fallback();
}
/* 兜底：隐藏 textarea + execCommand，兼容 file:// 与旧浏览器 */
function legacyCopy(s){
  try{
    var ta=document.createElement('textarea');
    ta.value=s;
    ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.top='0'; ta.style.left='-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, s.length);
    var ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch(e){ return false; }
}
/* 两种自动复制都失败时，弹出可选中文本框让用户手动复制 */
var _cpLast=null;
function copyFallback(t,title){
  _cpLast={t:t,title:title||'复制'};
  _cpDraw();
  /* 若刚被别的弹窗（如首次功能说明）覆盖，再补一次 */
  setTimeout(function(){
    var m=$('modal');
    if(_cpLast && m && m.innerHTML.indexOf('cp-ta')<0) _cpDraw();
  },150);
}
function _cpDraw(){
  var o=_cpLast||{t:'',title:'复制'}, t=o.t, title=o.title;
  var h='<div class="mh">'+(title||'复制')+'<span onclick="closeHelp()">×</span></div><div class="mb">'
    +'<div class="note" style="padding:0 0 10px">浏览器禁止了自动复制，请手动选中下面的内容复制（已帮你全选）。</div>'
    +'<textarea id="cp-ta" readonly style="width:100%;height:120px;font-size:14px;line-height:1.6;'
    +'padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)">'
    +String(t==null?'':t).replace(/</g,'&lt;')+'</textarea>'
    +'<div class="btns" style="margin-top:10px"><button class="p" onclick="cpSelectAll()">全选</button></div>'
    +'</div>';

/* 轻量提示条（替代 alert，避免打断操作） */
var toastTimer=null;
function toast(msg){
  var el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div');
    el.id='toast'; el.className='toastbox';
    document.body.appendChild(el);
  }
  el.textContent=msg; el.className='toastbox on';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ el.className='toastbox'; }, 2200);
}

/* ========== 生成投注图片 ========== */
/* list 可选：传入 cartList() 的 [{i,bet}] 就只画勾选的注，不传则画全部 */
function makeBetImage(list){
  var d=D[S.lot], bets=[], i;
  if(list && list.length){ for(i=0;i<list.length;i++) bets.push(list[i].bet); }
  else bets=getBets();
  var W=680, PAD=30, TITLE=100, FOOT=76, LH=86;
  var H=PAD*2+TITLE+bets.length*LH+FOOT;
  var dpr=Math.min(2, window.devicePixelRatio||1);
  var cv=document.createElement('canvas');
  cv.width=W*dpr; cv.height=H*dpr;
  var g=cv.getContext('2d');
  g.scale(dpr,dpr);
  /* 背景（图片始终用浅色，便于店主阅读） */
  g.fillStyle='#ffffff'; g.fillRect(0,0,W,H);
  g.fillStyle='#e8402a'; g.fillRect(0,0,W,6);
  /* 标题 */
  g.fillStyle='#1a1a1a';
  g.font='700 26px "PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign='left'; g.textBaseline='alphabetic';
  g.fillText(d.name+' 投注单', PAD, PAD+42);
  var up=unitPrice();
  g.fillStyle='#888'; g.font='15px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('共 '+bets.length+' 注 · 每注 '+up+' 元 · 合计 '+(bets.length*up)+' 元', PAD, PAD+68);
  g.strokeStyle='#eee'; g.lineWidth=1;
  g.beginPath(); g.moveTo(PAD,PAD+80); g.lineTo(W-PAD,PAD+80); g.stroke();
  /* 逐注 */
  var y=PAD+TITLE;
  for(var i=0;i<bets.length;i++){
    var bet=bets[i], cy=y+LH/2, x=PAD+18;
    /* 序号 */
    g.fillStyle='#bbb'; g.font='14px "PingFang SC",sans-serif'; g.textAlign='left';
    g.fillText('#'+(i+1), PAD-4, cy+5);
    /* 红球 */
    var lastRedRight = x + (bet.r.length-1)*50 + 20;   /* 最后一个红球的右边缘 */
    for(var j=0;j<bet.r.length;j++){ drawImgBall(g,x,cy,20,'#e8402a',pad(bet.r[j])); x+=50; }
    /* 加号：放在「最后一个红球右边缘」与「第一个蓝球左边缘」的正中间。
       原来写死在 x+8，实测距蓝球左边缘只剩 6px，看着像蓝球的一部分。
       这里改为按两侧边缘算中点，并留出更宽的间隔。 */
    if(bet.b.length){
      var blueStart = x + 46;                          /* 第一个蓝球的圆心 */
      var plusCx = (lastRedRight + (blueStart-20)) / 2;
      g.fillStyle='#999'; g.font='600 20px sans-serif'; g.textAlign='center';
      g.fillText('+', plusCx, cy+7);
      x = blueStart;
    }
    /* 蓝球 */
    for(var k=0;k<bet.b.length;k++){ drawImgBall(g,x,cy,20,'#2b6cd4',pad(bet.b[k])); x+=50; }
    y+=LH;
  }
  /* 页脚 */
  g.textAlign='left'; g.fillStyle='#aaa';
  g.font='12.5px "PingFang SC",sans-serif';
  g.fillText('仅供娱乐 · 请当场核对号码后购买', PAD, H-PAD-16);
  var now=new Date(Date.now()+8*3600000);
  var ts=now.getUTCFullYear()+'-'+pad(now.getUTCMonth()+1)+'-'+pad(now.getUTCDate())
        +' '+pad(now.getUTCHours())+':'+pad(now.getUTCMinutes());
  g.textAlign='right';
  g.fillText('生成于 '+ts, W-PAD, H-PAD-16);
  return cv.toDataURL('image/png');
}
function drawImgBall(g,cx,cy,r,color,txt){
  g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2);
  g.fillStyle=color; g.fill();
  g.fillStyle='#fff';
  g.font='700 '+Math.round(r*0.95)+'px "PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign='center'; g.textBaseline='middle';
  g.fillText(txt, cx, cy+1);
  g.textBaseline='alphabetic';
}

/* ---------- 中奖核对 ---------- */
function toggleChk(n,isBlue){
  var a=isBlue?S.chkBlue:S.chkRed, max=isBlue?D[S.lot].blueCount:D[S.lot].redCount;
  var i=a.indexOf(n);
  if(i>=0) a.splice(i,1);
  else{
    if(a.length>=max) a.shift();          /* 选满时顶掉最早一个 */
    a.push(n); a.sort(function(x,y){return x-y});
  }
  render();
}
/* ───────── 中奖核对：从「我的选号」/「我的收藏」导入 ─────────
   原来要对奖必须手动点 7 次球，而号码往往早就存在本机了。
   这里提供一键导入，消灭重复录入。 */
function chkImportList(){
  var out=[], i, a;
  /* 我的选号（当前彩种） */
  try{
    a=getBets();
    for(i=0;i<a.length;i++){
      if(!a[i]) continue;
      out.push({src:'我的选号', r:a[i].r||[], b:a[i].b||[], lot:S.lot});
    }
  }catch(e){}
  /* 我的收藏（当前彩种） */
  try{
    a=(typeof getFavs==='function')?getFavs():[];
    for(i=0;i<a.length;i++){
      if(!a[i]) continue;
      out.push({src:'我的收藏', name:a[i].name||'', r:a[i].r||[], b:a[i].b||[], lot:S.lot});
    }
  }catch(e){}
  return out;
}
function chkImportShow(){
  var list=chkImportList(), d=D[S.lot], h='', i;
  if(!list.length){
    modalPanel('导入号码', '<div class="empty">「我的选号」和「我的收藏」里都还没有号码。<br>'
      +'<span style="font-size:12px">先在「我的选号」里添加一注，或直接点球输入</span></div>');
    return;
  }
  h+='<div class="note">点一条即可导入到上方号码盘。共 '+list.length+' 条。</div>';
  for(i=0;i<list.length;i++){
    var it=list[i], nums='';
    if(isPos()){
      nums=(it.r||[]).join(' ');
    }else{
      nums=(it.r||[]).map(pad).join(' ')+' + '+(it.b||[]).map(pad).join(' ');
    }
    h+='<div class="bitem" style="cursor:pointer" onclick="chkImportDo('+i+')">'
      +'<div style="font-size:12px;color:var(--fg5)">'+esc(it.src)
      +(it.name?' · '+esc(it.name):'')+'</div>'
      +'<div>'+fmtBalls({2:it.r,3:it.b},true)+'</div></div>';
  }
  modalPanel('导入号码', h);
}
function chkImportDo(i){
  var list=chkImportList(), it=list[i];
  if(!it) return;
  if(isPos()){
    /* 按位玩法：三位数字写进 S.chk3（百位/十位/个位） */
    var r=it.r||[];
    S.chk3=[ (r.length>0?r[0]:null), (r.length>1?r[1]:null), (r.length>2?r[2]:null) ];
  }else{
    S.chkRed=(it.r||[]).slice();
    S.chkBlue=(it.b||[]).slice();
  }
  closeHelp();
  render();
}
function clearChk(){ S.chkRed=[]; S.chkBlue=[]; render(); }
function setChkMode(m){ S.chkMode=m; render(); }
function setChkIssue(v){ S.chkIssue=v; S.chkMode='issue'; render(); }
function findRow(issue){
  var rows=D[S.lot].rows, s=String(issue).trim();
  for(var i=rows.length-1;i>=0;i--) if(String(rows[i][0])===s) return rows[i];

function renderCheck(){

  if(S.chkMode==='issue'){

   +'<span class="'+(S.chkMode==='latest'?'on':'')+'" onclick="setChkMode(\'latest\')">最新一期</span>'

  for(var j=1;j<=d.blueMax;j++)

   +'<button class="g" onclick="clearChk()">清空</button>'

   + fmtBalls(target,true) +'</div>';

   +'<div style="margin-top:5px">'
   +(S.chkRed.length||S.chkBlue.length
      ? fmtBalls({2:S.chkRed,3:S.chkBlue},true)
      : '<span style="font-size:12.5px;color:#bbb">尚未选择</span>')
