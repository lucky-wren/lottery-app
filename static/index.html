      +(rbm!=='any' ? ' · 红蓝重合：'+(rbm==='avoid'?'避开重合':'必须重合') : '')
      +'</div>';
    if(!isP && d.blueMax && rbm!=='any'){
      var _rok=0, _rj, _rk, _rq, _rm, _rh;
      for(_rj=0;_rj<L.length;_rj++){
        _rm={}; _rh=0;
        for(_rk=0;_rk<L[_rj].r.length;_rk++) _rm[L[_rj].r[_rk]]=1;
        for(_rq=0;_rq<(L[_rj].b||[]).length;_rq++) if(_rm[L[_rj].b[_rq]]) _rh++;
        if(rbm==='must'?_rh>0:_rh===0) _rok++;
      }
      h+='<div class="note">'+esc(d.redLabel)+'与'+esc(d.blueLabel)
        +(rbm==='must'?'必须重合':'避开重合')+'：<b>'+_rok+'/'+L.length+' 注达标</b>'
        +(rbm==='must'?'（重合的'+esc(d.redLabel)+'已描蓝边）':'')
        +'。<b>这只是号码形态，不改变中奖概率</b>。</div>';
    }
    if(L.length>1){
      var _all=true;
      for(var _z=0;_z<L.length;_z++) if(!(S.guessOpen&&S.guessOpen[_z])){ _all=false; break; }
      h+='<div style="padding:0 12px 2px;display:flex;justify-content:flex-end">'
        +'<button class="mini" onclick="guessToggleAll()">'
        +(_all?'收起全部分析':'展开全部分析')+'</button></div>';
    }
    for(var i2=0;i2<L.length;i2++){
      var g=L[i2], j2;
      h+='<div style="padding:8px 12px;border-top:1px solid var(--line)">';
      h+='<div style="display:flex;align-items:center;gap:4px;flex-wrap:nowrap">';
      h+='<span style="font-size:11px;color:var(--fg5);min-width:14px;flex-shrink:0">'+(i2+1)+'</span>';
      var _rbset={}; for(j2=0;j2<(g.b||[]).length;j2++) _rbset[g.b[j2]]=1;
      for(j2=0;j2<g.r.length;j2++)
        h+='<span class="nb sm'+((rbm==='must'&&_rbset[g.r[j2]])?' rbhit':'')+'">'+pad(g.r[j2])+'</span>';
      for(j2=0;j2<(g.b||[]).length;j2++)
        h+='<span class="nb sm b'+(g._bluePinned?' pin':'')+'">'+pad(g.b[j2])+'</span>';
      var _op=!!(S.guessOpen&&S.guessOpen[i2]);
      var _sv=!!(S.guessSaved&&S.guessSaved[i2]);
      h+='<button class="mini" style="margin-left:auto'+(_sv?';color:#2a7':'')+'" title="存入我的选号" '
        +'onclick="guessSave('+i2+')">'+(_sv?'已存入 ✓':'存入')+'</button>';
      h+='<button class="mini'+(g._ok?'':' warn')+'" onclick="guessToggle('+i2+')">'+(_op?'收起':'分析')+'</button>';
      h+='</div>';
      var mf=g._m;
      if(mf&&_op){
        var mt;
        if(isP) mt='和值 '+mf.sum+' · 跨度 '+mf.span+' · 同位重号 '+mf.repeat
                  +' · '+(mf.kind==='baozi'?'豹子':(mf.kind==='z3'?'组三':'组六'));
        else mt='和值 '+mf.sum+' · 奇偶 '+mf.odd+':'+(g.r.length-mf.odd)
                  +' · 连号 '+mf.link+' · 重号 '+mf.repeat+' · 跨度 '+mf.span
                  +' · 区间 '+mf.zc.join('-');
        h+='<div style="font-size:11px;color:var(--fg5);margin-top:4px">'+mt
          +' <span style="color:'+(g._ok?'#888':'#c60')+'">'
          +(g._ok?'符合历史形态':'已放宽')+'</span></div>';
      }
      if(_op) h+='<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)">'
                +guessDetail(i2)+'</div>';
      h+='</div>';
    }
    if(L.length>1&&!isP){
      var mx=0, tt=0, pp=0, ai, bi3;
      for(ai=0;ai<L.length;ai++) for(bi3=ai+1;bi3<L.length;bi3++){
        var ov=guessOverlap(L[ai].r, L[bi3].r);
        mx=Math.max(mx,ov); tt+=ov; pp++;
      }
      h+='<div class="note">本批 '+L.length+' 注两两相比：红球重合平均 '
        +(pp?(tt/pp).toFixed(2):'0')+' 个，最多 '+mx+' 个。'
        +'重合越少，越不会出现「买两注其实差不多」的浪费。</div>';
    }
    var rOK=0, rBad=0;
    for(var _ri=0;_ri<L.length;_ri++){
      if(L[_ri]._recent && L[_ri]._recent.viol===0) rOK++; else rBad++;
    }
    h+='<div class="note">近 '+rN+' 期避重（'+(rStrict?'并集':'逐期')
      +' ≤ '+rM+' 个）：<b>'+rOK+'/'+L.length+' 注达标</b>'
      +(rBad?('，'+rBad+' 注未完全达标（已取最接近的一注，点「分析」看逐期矩阵）'):'')
      +'。<b>这只是号码形态，不改变中奖概率</b>。</div>';
    var _saved=0, _sk;
    for(_sk in (S.guessSaved||{})) if(S.guessSaved[_sk]) _saved++;
    h+='<div class="note">号码可点「存入」进入「我的选号」，标记已买后才归档到选号记录'
      +(_saved?('，本批已存入 <b>'+_saved+'</b> 注 <button class="mini" style="margin-left:6px" onclick="setTab(\'mine\')">去查看 →</button>'):'')
      +'。再次点「换一批」会得到<b>不同</b>的一组——这正是因为它本质是随机的。</div>';
  }else{
    h+='<div class="empty">点上面的「生成号码」，按所选偏好生成一注或多注</div>';
  }
  h+='</div>';

  /* ─── 偏好回放：把「偏好有没有用」算出来 ─── */
  h+='<div class="card"><div class="sec">偏好回放（关键）</div>'
   +'<div class="note">对最近 24 期，每一期<b>只用该期之前的数据</b>按各偏好生成一注，'
   +'统计平均命中几个号。理论期望命中数 = '+(isP?'3 × 1/10 = <b>0.30</b>'
     :(d.redCount+' × '+d.redCount+'/'+d.redMax+' = <b>'+th.red.toFixed(2)+'</b>'))
   +'。<br>新增<b>「近 '+rN+' 期避重」</b>一列：同一期再用当前避重口径'
   +'（'+(rStrict?'并集':'逐期')+' ≤ '+rM+' 个）生成一注单独统计，'
   +'避重所用的近几期同样只取该期<b>之前</b>的数据。<br>'
   +'<b>重点看「形态典型」这一行和新增列</b>：施加了形态与避重约束后，'
   +'命中数依然围绕理论值波动——这就是这些约束<b>不改变中奖概率</b>的直接证据。</div>';
  if(S.guessBT){
    h+='<div style="overflow-x:auto"><table class="tb"><thead><tr>'
      +'<th>偏好</th><th>平均命中'+(isP?'位数':'红球')+'</th>'
      +(isP?'':'<th>平均命中'+esc(d.blueLabel||'蓝球')+'</th>')
      +'<th>近 '+rN+' 期避重</th><th>与理论值偏差</th></tr></thead><tbody>';
    var best=null, worst=null;
    for(var bi=0;bi<STRS.length;bi++){
      var key=STRS[bi][0], r=S.guessBT[key];
      if(!r) continue;
      var dev=r.red-th.red, nm=guessStratName(key);
      if(best===null||dev>best.dev) best={k:nm,dev:dev,v:r.red,n:r.n};
      if(worst===null||dev<worst.dev) worst={k:nm,dev:dev,v:r.red,n:r.n};
      var rdv=(r.rRed===null||r.rRed===undefined)?null:(r.rRed-th.red);
      h+='<tr><td>'+nm+'</td>'
        +'<td><b>'+r.red.toFixed(2)+'</b></td>'
        +(isP?'':'<td>'+r.blue.toFixed(2)+'</td>')
        +'<td>'+(rdv===null?'—':'<b>'+r.rRed.toFixed(2)+'</b>'
          +' <span style="font-size:11px;color:'+(Math.abs(rdv)<0.25?'#888':'#c33')+'">'
          +(rdv>=0?'+':'')+rdv.toFixed(2)+'</span>')+'</td>'
        +'<td style="color:'+(Math.abs(dev)<0.25?'#888':'#c33')+'">'
        +(dev>=0?'+':'')+dev.toFixed(2)+'</td></tr>';
    }
    h+='<tr style="background:var(--surface2)"><td><b>理论值</b></td>'
      +'<td><b>'+th.red.toFixed(2)+'</b></td>'
      +(isP?'':'<td>'+th.blue.toFixed(2)+'</td>')
      +'<td><b>'+th.red.toFixed(2)+'</b></td><td>—</td></tr>';
    h+='</tbody></table></div>';
    var span=best&&worst?(best.v-worst.v):0;
    h+='<div class="note">每种偏好各模拟 '+(best.n||0)+' 次，最高 '+best.v.toFixed(2)+'（'+best.k
      +'），最低 '+worst.v.toFixed(2)+'（'+worst.k+'），差距 '+span.toFixed(2)+' 个号。'
      +'<br>多回放几次你会发现：<b>名次每次都在变</b>——这正是随机波动的特征，'
      +'说明没有任何一种偏好（包括形态典型）真正优于机选。<br>'
      +'<b>新增的避重列同样围绕理论值波动</b>——加上「与近几期不重号」这条约束，'
      +'命中数也没有变高，它只让号码看起来不像刚开过的那几期。'
      +'这是本页想让你看到的事实，而不是它的缺陷。</div>';
    h+='<div style="padding:0 12px 10px"><button class="more" onclick="guessRunBT()">重新回放</button></div>';
  }else{
    h+='<div style="padding:0 12px 10px"><button class="more" onclick="guessRunBT()">'
      +'开始回放（约需 1~3 秒）</button></div>';
  }
  h+='</div>';
  return h;
}

var TABS=[
  /* 开奖历史：表格 / 走势图 双视图，同一批数据两种呈现 */
  {id:'hist',  name:'开奖历史', a:'renderHist',  b:'renderHist3'},
  /* 号码统计：出现次数 / 冷热分布 / 遗漏排行 三视图 */
  {id:'stat',  name:'号码统计', a:'renderStat',  b:'renderStat3'},
  /* 区间分布：独立页签，按三分区统计 */
  {id:'zone',  name:'区间分布', a:'renderZone'},
  /* 按位玩法没有蓝球、固定奖金没有奖池，这两个页签自动隐藏 */
  {id:'blue',  name:'蓝球分析', a:'renderBlue', hidePos:true},
  {id:'pool',  name:'奖池走势', a:'renderPool', hidePos:true},
  /* 我的选号：上半是选号区，下半是已保存记录 */
  {id:'mine',  name:'我的选号', a:'renderMine',  b:'renderMine3', extra:['renderRec']},
  {id:'fav',   name:'我的收藏', a:'renderFavTab'},
  {id:'check', name:'中奖核对', a:'renderCheck', b:'renderCheck3'},
  {id:'fsdt',  name:'复式/胆拖', a:'renderFsdt'},
  /* 猜号参考：按历史形态画像生成号码 + 多注反雷同 */
  {id:'guess', name:'猜号参考', a:'renderGuess'}
];
function tabDef(id){ for(var i=0;i<TABS.length;i++) if(TABS[i].id===id) return TABS[i]; return null; }
/* 按函数名调用并兜错：某个页签渲染抛异常时只那块显示错误，不整页白屏 */
function tabCall(n){
  try{ var f=window[n]; return typeof f==='function' ? f() : ''; }
  catch(e){ return '<div class="empty">「'+esc(n)+'」渲染出错<br><span style="font-size:12px">'
                  +esc(String(e&&e.message||e))+'</span></div>'; }
}
/* 生成页签栏：内容没变就不重绘，避免每帧重建 DOM */
function visibleTabs(){
  var P=isPos(), out=[], i;
  for(i=0;i<TABS.length;i++){
    var t=TABS[i];
    if(t.hidePos && P) continue;      /* 按位玩法隐藏必然空白的页签 */
    out.push(t);
  }
  return out;
}
function renderTabs(){
  var el=document.getElementById('tabs'); if(!el) return;
  var ts=visibleTabs(), h='<button id="t-menu" onclick="openSide()">菜单</button>', i;
  for(i=0;i<ts.length;i++){
    var t=ts[i];
    h+='<button id="t-'+t.id+'" class="'+(S.tab===t.id?'on':'')+'" onclick="setTab(\''+t.id+'\')">'+t.name+'</button>';
  }
  if(el.innerHTML!==h) el.innerHTML=h;
  /* 待核对角标：单独更新这一个按钮，不重建整条页签栏 */
  var pc=pendCheckCount(), tr=document.getElementById('t-mine');
  if(tr){
    var want='我的选号'+(pc?'<span class="tabdot">'+pc+'</span>':'');
    if(tr.innerHTML!==want) tr.innerHTML=want;
  }
}
function render(){
  /* 未激活授权时直接显示锁屏，不渲染任何数据 */
  if(licBlocked()){ var ml=$('main'); if(ml) ml.innerHTML=renderLock(); renderLockChrome(); licInitMenu(); return; }
  if(!D[S.lot]){showLoading();return}
  ['ssq','dlt','3d','pls'].forEach(function(l){
    var b=$('b-'+l); if(b) b.className = S.lot===l?'on':'';
  });
  renderTabs();
  /* 本机存下的页签 id 若已失效（老版本残留），回退到第一个可见页签，避免空白 */
  if(!tabDef(S.tab)){ var vt=visibleTabs(); S.tab = vt.length? vt[0].id : 'hist'; renderTabs(); }
  var m=$('main'), h=head()+latest();
  var P=isPos(), td=tabDef(S.tab), ei;
  if(td){
    h+=tabCall(P&&td.b?td.b:td.a);
    if(td.extra) for(ei=0;ei<td.extra.length;ei++) h+=tabCall(td.extra[ei]);
  }else h+=renderMine();
  /* 页签较多时，让当前页签滚到可见处 */
  var tb=$('t-'+S.tab);
  if(tb && tb.scrollIntoView) try{ tb.scrollIntoView({block:'nearest',inline:'center'}); }catch(e){}
  m.innerHTML=h;
  startCountdown();          /* 倒计时每秒自更新，只改这一个元素，不整页重绘 */
}
/* 顶部「当前时间」每秒自更新：只改 #nowtm 这一个元素，不整页重绘，
   因此不会影响你正在选号 / 输入的内容。锁屏页没有该元素时自动跳过 */
function startNowClock(){
  if(window.__nowTimer) return;
  window.__nowTimer=setInterval(function(){
    try{
      var el=document.getElementById('nowtm');
      if(!el) return;
      var t=fmtDt(new Date());
      if(el.textContent!==t) el.textContent=t;
    }catch(e){}
  },1000);
}
/* 「我的选号」每张卡片都要全史扫描一次，20 注 × 7765 期就是十几万次迭代。
   首屏渲染后利用空闲时间分批预热缓存，之后切页签/点球就能直接命中，
   不再每次全量重算。每帧只算 8ms，切了彩种立即停止，不干扰操作。 */
function warmAnalyze(){
  var lot=S.lot, a=[], i=0;
  try{ a=JSON.parse(localStorage.getItem('myBets_'+lot)||'[]'); }catch(e){ return; }
  if(!a.length) return;
  (function step(){
    if(S.lot!==lot) return;            /* 中途切彩种，放弃这一轮 */
    var t0=Date.now(), n=0;
    while(i<a.length && Date.now()-t0<8){
      try{ if(a[i] && a[i].r) analyze(a[i].r, a[i].b||[]); }catch(e){}
      i++; n++;
    }
    if(i<a.length) setTimeout(step,30);
  })();
}
function boot(){
  if(licBlocked()){ var mb=$('main'); if(mb) mb.innerHTML=renderLock(); renderLockChrome(); licInitMenu(); return; }
  ensure(S.lot).then(function(){
    render();
    setTimeout(warmAnalyze, 60);   /* 首屏出来后再预热，不拖慢首次渲染 */
    licRecheck();          /* 复查登记表：该码是否被别的设备占用 */
    var seen=null; try{ seen=localStorage.getItem(HELP_SEEN); }catch(e){}
    if(!seen) showHelp();
  }).catch(function(){});
}
licInitMenu();
startNowClock();
boot();
</script>
