/* ---------- 条件机选 ---------- */
/* 理论均值：红球个數 × (1+最大号)/2 */
function sumMid(){
  var d=D[S.lot];
  return Math.round(d.redCount*(1+d.redMax)/2);
}
/* 和值预设范围：low/mid/high 三档，UI 与实际筛选共用同一套数值 */
function sumRange(k){
  var m=sumMid(), d=D[S.lot];
  var span=Math.round(d.redMax*0.45);
  if(k==='low')  return [m-span, m-Math.round(span*0.25)];
  if(k==='mid')  return [m-Math.round(span*0.35), m+Math.round(span*0.35)];
  if(k==='high') return [m+Math.round(span*0.25), m+span];
  return null;
}
function sumPreset(k){ S.genSum=sumRange(k); render(); }
function setGen(field,v){ S[field]=v; render(); }
/* 判断一组红球是否满足当前条件 */
function matchCond(r){
  var d=D[S.lot], i, s=0;
  for(i=0;i<r.length;i++) s+=r[i];
  var g=S.genSum;
  if(g && g[0]>0 && s<g[0]) return false;
  if(g && g[1]>0 && s>g[1]) return false;
  if(S.genOdd!=='any'){
    var odd=0; for(i=0;i<r.length;i++) if(r[i]%2) odd++;
    if((odd+':'+(r.length-odd))!==S.genOdd) return false;
  }
  if(S.genBig!=='any'){
    var mid=Math.floor((d.redMax+1)/2), big=0;
    for(i=0;i<r.length;i++) if(r[i]>mid) big++;
    if((big+':'+(r.length-big))!==S.genBig) return false;
  }
  if(S.genZone!=='any'){
    var z1=Math.ceil(d.redMax/3), z2=Math.ceil(d.redMax*2/3), c1=0,c2=0,c3=0;
    for(i=0;i<r.length;i++){ if(r[i]<=z1)c1++; else if(r[i]<=z2)c2++; else c3++; }
    if((c1+':'+c2+':'+c3)!==S.genZone) return false;
  }
  return true;
}
/* 条件机选同样先定蓝球再采红球：must 把蓝球数字放进红球，
   avoid 从红球里排掉蓝球数字，再交给 matchCond 检查形态。
   蓝球由调用方先定好并传入，重试时保持不变，避免红球种子与蓝球对不上。 */
function genRedCand(d, blues){
  var rb=S.guessRB||'any', ban={}, seed=0, pool=[], i, v, r=[], k=0;
  if(rb==='avoid'){
    for(i=0;i<blues.length;i++) if(blues[i]<=d.redMax) ban[blues[i]]=1;
  }else if(rb==='must'){
    for(i=0;i<blues.length;i++) if(blues[i]<=d.redMax) pool.push(blues[i]);
    if(pool.length) seed=pool[Math.floor(Math.random()*pool.length)];
  }
  if(seed){ r.push(seed); ban[seed]=1; }
  while(r.length<d.redCount && k++<2000){
    v=1+Math.floor(Math.random()*d.redMax);
    if(ban[v]||r.indexOf(v)>=0) continue;
    r.push(v);
  }
  return r.sort(function(a,b){return a-b});
}
function genPlanBlues(d, idx){
  if(isPos()||!d.blueMax) return [];
  return guessPlanBlues(guessBlueSpec(), idx, (d.blueCount||1), d.blueMax);
}
function genByCond(){
  var d=D[S.lot], i, tries=0, found=null, MAX=60000;
  var plan0=genPlanBlues(d,0);
  var n=Math.max(1,Math.min(5,S.genCount||1));
  while(tries<MAX){
    tries++;
    var r=genRedCand(d,plan0);
    if(matchCond(r)){ found=r; break; }
  }
  if(!found){
    S.genMsg='条件太严，试了 '+MAX+' 次也没凑出来，放宽一点再试。';
    render(); return;
  }
  if(n===1){
    /* 单注：填入上方选号区，可再自行调整 */
    S.pickRed=found.slice();
    S.pickBlue=plan0.slice();
    S.genMsg='已生成（随机尝试 '+tries+' 次命中）· 和值 '+sumRed({2:found});
  } else {
    /* 多注：直接加入已保存列表，避免互相覆盖 */
    var a=getBets(), made=[], used={}, k;
    for(k=0;k<n;k++){
      var rr=null, t2=0;
      while(t2<MAX){
        t2++;
        var planK=genPlanBlues(d,k), cand=genRedCand(d,planK);
        if(!matchCond(cand)) continue;
        var key=cand.join(',');
        if(used[key]) continue;
        rr=cand; used[key]=1; break;
      }
      if(!rr) break;
      made.push({r:rr.slice(), b:planK.slice(), t:Date.now()+k});
    }
    if(!made.length){
      S.genMsg='条件太严，没能生成，放宽一点再试。';
    } else {
      for(k=0;k<made.length;k++){ a.push(made[k]); }
      saveBets(a);
      var sums=[], z;
      for(z=0;z<made.length;z++) sums.push(sumRed({2:made[z].r}));
      S.genMsg='已生成 <b>'+made.length+'</b> 注并加入列表（和值 '+sums.join(' / ')+'）'
        +(made.length<n?('，条件太严只凑出 '+made.length+' 注'):'')+'。';
    }
  }
  render();
}
function renderGen(){
  var d=D[S.lot], rc=d.redCount, m=sumMid(), g=S.genSum;
  var oddOpts=['any'], i;
  for(i=0;i<=rc;i++) oddOpts.push(i+':'+(rc-i));
  var bigOpts=['any'];
  for(i=0;i<=rc;i++) bigOpts.push(i+':'+(rc-i));
  /* 三区比：全组合很多，只列常用的几组 */
  var zoneOpts=['any','2:2:2','3:2:1','1:2:3','2:3:1','1:3:2','3:1:2','2:1:3','4:1:1','1:1:4','1:4:1'];

  var h='<div class="prev" style="margin-top:10px;background:#fafafa">'
   +'<div style="font-size:12.5px;color:#666;font-weight:600;margin-bottom:8px">条件机选</div>';

  /* 和值 */
  h+='<div class="frow"><span class="flab">和值</span><div class="rdo">'
   +'<span class="'+(!g?'on':'')+'" onclick="sumPreset(\'any\')">不限</span>';
  ['low','mid','high'].forEach(function(k){
    var lab=k==='low'?'偏低':(k==='mid'?'居中':'偏高');
    var v=sumRange(k);
    var on = g && g[0]===v[0] && g[1]===v[1];
    h+='<span class="'+(on?'on':'')+'" onclick="sumPreset(\''+k+'\')">'+lab+' '+v[0]+'~'+v[1]+'</span>';
  });
  h+='</div></div>';

  /* 奇偶比 */
  h+='<div class="frow"><span class="flab">奇偶比</span><div class="rdo">';
  for(i=0;i<oddOpts.length;i++)
    h+='<span class="'+(S.genOdd===oddOpts[i]?'on':'')+'" onclick="setGen(\'genOdd\',\''+oddOpts[i]+'\')">'
      +(oddOpts[i]==='any'?'不限':oddOpts[i])+'</span>';
  h+='</div></div>';

  /* 大小比 */
  h+='<div class="frow"><span class="flab">大小比</span><div class="rdo">';
  for(i=0;i<bigOpts.length;i++)
    h+='<span class="'+(S.genBig===bigOpts[i]?'on':'')+'" onclick="setGen(\'genBig\',\''+bigOpts[i]+'\')">'
      +(bigOpts[i]==='any'?'不限':bigOpts[i])+'</span>';
  h+='</div></div>';

  /* 三区比 */
  h+='<div class="frow"><span class="flab">三区比</span><div class="rdo">';
  for(i=0;i<zoneOpts.length;i++)
    h+='<span class="'+(S.genZone===zoneOpts[i]?'on':'')+'" onclick="setGen(\'genZone\',\''+zoneOpts[i]+'\')">'
      +(zoneOpts[i]==='any'?'不限':zoneOpts[i])+'</span>';
  h+='</div></div>';

  /* 生成注数：1~5。1 注填入上方选号区；多注直接加入已保存列表 */
  h+='<div class="frow"><span class="flab">注数</span><div class="rdo">';
  for(i=1;i<=5;i++)
    h+='<span class="'+((S.genCount||1)===i?'on':'')+'" onclick="S.genCount='+i+';render()">'+i+'</span>';
  h+='</div></div>';

  h+='<div class="btns" style="margin-top:2px">'
   +'<button class="p" onclick="genByCond()">生成'+((S.genCount||1)>1?(S.genCount)+' 注':'一注')+'</button>'
   +'<button class="g" onclick="S.genSum=null;S.genOdd=\'any\';S.genBig=\'any\';S.genZone=\'any\';S.genMsg=\'\';render()">重置条件</button>'
   +'</div>';
  if(S.genMsg) h+='<div class="msg" style="margin-top:8px"><div class="'+(/太严/.test(S.genMsg)?'e':'ok')+'">'+S.genMsg+'</div></div>';
  h+='<div style="font-size:11px;color:#aaa;line-height:1.6;margin-top:8px">'
    +'大小号以 '+(Math.floor((d.redMax+1)/2))+' 为界，三区按 1-'+Math.ceil(d.redMax/3)+' / '
    +(Math.ceil(d.redMax/3)+1)+'-'+Math.ceil(d.redMax*2/3)+' / '+(Math.ceil(d.redMax*2/3)+1)+'-'+d.redMax+' 划分。<br>'
    +'条件只是筛出<b>符合特征</b>的号码，不提高中奖概率——每注概率完全相同。</div>';
  h+='</div>';
  return h;
}

/* 用页内输入框代替 prompt()：
   prompt 在微信内置浏览器、部分 App 内置 webview、以及「添加到桌面」后的
   独立窗口里可能被拦截，重复弹出还会被浏览器静默屏蔽（点了没反应、也没提示），

/* ================= 二维码同步（换手机不丢收藏） =================
   把四个彩种的收藏编成一段紧凑文本 → 生成二维码。
   另一台手机用微信/系统相机扫出文本，粘进「扫码导入」即可。
   纯前端完成，不需要服务器。数据量大到二维码装不下时提示改用 txt 备份。 */
var SYNC_HEAD='LOTSYNC1';

function syncText(){
  var out=[SYNC_HEAD], n=0, i, j;
  for(i=0;i<BK_LOTS.length;i++){
    var lot=BK_LOTS[i], a=favOfLot(lot);
    for(j=0;j<a.length;j++){
      var it=a[j], nums='', bit=lotIsPos(lot);

      for(var k=0;k<(it.r||[]).length;k++) nums+= bit? String(it.r[k]) : pad(it.r[k]);
      for(var k2=0;k2<(it.b||[]).length;k2++) nums+= bit? String(it.b[k2]) : pad(it.b[k2]);
      out.push(SYNC_CODE[lot]+':'+nums+':'+(it.name||'').replace(/[:\n]/g,' '));

  var lines=String(t||'').split('\n'), res={ssq:[],dlt:[],'3d':[],pls:[]}, bad=0, n=0, i;
  for(i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(!ln || ln===SYNC_HEAD || ln.indexOf('彩票统计')===0) continue;
    var p=ln.split(':'), lot=SYNC_LOT[p[0]];
    if(!lot || !p[1]){ bad++; continue; }
    var s=p[1], r=[], b=[], ok=true, k;
    if(lot==='3d'||lot==='pls'){
      if(s.length!==3){ bad++; continue; }
      for(k=0;k<3;k++) r.push(parseInt(s[k],10));
    } else if(lot==='ssq'){
      if(s.length!==14){ bad++; continue; }
      for(k=0;k<12;k+=2) r.push(parseInt(s.substr(k,2),10));
      b.push(parseInt(s.substr(12,2),10));
    } else {
      if(s.length!==14){ bad++; continue; }
      for(k=0;k<10;k+=2) r.push(parseInt(s.substr(k,2),10));
      for(k=10;k<14;k+=2) b.push(parseInt(s.substr(k,2),10));
    }
    res[lot].push({name:(p[2]||'').trim(), r:r, b:b, ts:Date.now()});

  return {data:res, n:n, bad:bad};
}

  var add=0, dup=0, i, j;
  for(i=0;i<BK_LOTS.length;i++){
    var lot=BK_LOTS[i], cur=favOfLot(lot), inc=res[lot]||[];

      for(m=0;m<cur.length;m++) if(favKeyOf(cur[m])===k){ found=m; break; }
      if(found>=0){ dup++; continue; }

  return {add:add, dup:dup};

/* ================= 守号追踪 =================
   老彩民常守一组号守很久。这里回答三个问题：
   守了多少期、期间中过什么、历史上最接近的一次是什么样。
   只统计期数和奖级次数，不涉及金额——这是娱乐工具，不做盈亏账。 */
function tsDay(ts){
  var d=new Date((ts||0)+8*3600000);
  function p2(x){ return (x<10?'0':'')+x; }
  return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate());
}
function hitOfBet(lot,it,row){
  var hr=row[2]||[], hb=row[3]||[], j, rk={}, bk={}, k=0, nb=0;
  for(j=0;j<hr.length;j++) rk[hr[j]]=1;
  for(j=0;j<(it.r||[]).length;j++) if(rk[it.r[j]]) k++;
  for(j=0;j<hb.length;j++) bk[hb[j]]=1;
  for(j=0;j<(it.b||[]).length;j++) if(bk[it.b[j]]) nb++;
  var pos=0, off=0;
  if(lot==='3d'||lot==='pls'){
    for(j=0;j<3;j++) if((it.r||[])[j]===hr[j]) pos++;
    var A={},B={},q;
    for(q=0;q<3;q++){ A[(it.r||[])[q]]=(A[(it.r||[])[q]]||0)+1; B[hr[q]]=(B[hr[q]]||0)+1; }
    var same=0;
    for(q=0;q<=9;q++) same+=Math.min(A[q]||0,B[q]||0);
    off=(same===3&&pos<3)?3:0;
  }
  return {k:k, hb:nb, pos:pos, off:off,
          p:betPrizeOf(lot, it.r||[], it.b||[], hr, hb)};
}
function favGTrack(lot, i){
  var it=favOfLot(lot)[i];
  if(!it){ toast('找不到这组号码'); return; }
  var d=D[lot];
  if(!d||!d.rows||!d.rows.length){
    toast('请先切换到'+(LOTNAME[lot]||lot)+'，加载数据后再看追踪'); return;
  }
  var pos=lotIsPos(lot), rows=d.rows, start=tsDay(it.ts||Date.now());
  var kept=0, winN=0, wins={}, best=null, cnt={}, j, k, recent=[];
  for(j=0;j<rows.length;j++){
    var row=rows[j];
    if(String(row[1])<start) continue;
    kept++;
    var h=hitOfBet(lot,it,row);
    if(h.p){ winN++; wins[h.p.name]=(wins[h.p.name]||0)+1; }
    var score=pos? (h.pos*2+h.off) : (h.k*2+h.hb);
    if(!best||score>best.score) best={score:score,k:h.k,hb:h.hb,pos:h.pos,off:h.off,p:h.p,issue:row[0],date:row[1]};
    for(k=0;k<(row[2]||[]).length;k++) cnt[row[2][k]]=(cnt[row[2][k]]||0)+1;
    recent.push({issue:row[0],date:row[1],h:h});
  }
  /* rows 升序（旧→新），「最近 12 期」取末尾；顺序保持旧→新，左旧右新 */
  if(recent.length>12) recent=recent.slice(recent.length-12);
  var m=$('modal'); if(!m) return;
  var h2='<div style="margin-bottom:8px">'+fmtBalls({2:it.r,3:it.b},false)+'</div>';
  h2+='<div class="kv"><span>收藏于</span><b>'+tsDay(it.ts||Date.now())+'</b></div>';
  h2+='<div class="kv"><span>已守期数</span><b>'+kept+' 期</b></div>';
  h2+='<div class="kv"><span>期间中奖</span><b>'+(winN? winN+' 次' : '0 次')+'</b></div>';
  var wk=[], nm;
  for(nm in wins) if(wins.hasOwnProperty(nm)) wk.push(nm+' ×'+wins[nm]);
  if(wk.length) h2+='<div style="font-size:12px;color:var(--fg5);margin:4px 0 8px">'+esc(wk.join('、'))+'</div>';
  if(best){
    var bt=pos? ('位置对 '+best.pos+' 位'+(best.off?'（数字全中、顺序不同）':''))
             : ('红球 '+best.k+' 个'+(best.hb?' + 蓝球 '+best.hb:''));
    h2+='<div class="kv"><span>最好一次</span><b>'+esc(bt)+(best.p?('（'+esc(best.p.name)+'）'):'')+'</b></div>';
    h2+='<div style="font-size:12px;color:var(--fg5);margin:2px 0 8px">'+best.issue+' 期 · '+best.date+'</div>';
  }
  if(!pos){
    var cs=[];
    for(k=0;k<(it.r||[]).length;k++) cs.push(pad(it.r[k])+'×'+(cnt[it.r[k]]||0));
    h2+='<div style="font-size:12px;color:var(--fg5);margin:8px 0">守号期间各号码开出次数：'
       +esc(cs.join('  '))+'</div>';
  }
  if(recent.length){
    var bar='';
    for(j=0;j<recent.length;j++){
      var rc=recent[j], v=pos? rc.h.pos : rc.h.k, col=(rc.h.p? '#e33' : (v>=3? '#f0a' : '#888'));
      bar+='<span title="'+rc.issue+' 期 · '+rc.date+'" style="display:inline-block;width:18px;'
         +'margin:0 2px;text-align:center;font-size:11px;color:'+col+'">'+v+'</span>';
    }
    h2+='<div style="font-size:12px;color:var(--fg5);margin:8px 0 2px">最近 '
       +recent.length+' 期命中个数（红色=中奖）</div><div>'+bar+'</div>';
  }
  h2+='<div class="note" style="margin-top:10px">守号追踪只是<b>历史比对</b>，'
     +'不构成任何预测；每期开奖都是独立事件。</div>';
  h2+='<div class="btns" style="margin-top:12px"><button onclick="closeHelp()">关闭</button></div>';
  modalPanel('守号追踪 · '+esc(LOTNAME[lot]||lot)+' '+esc(it.name||'未命名'), h2);
}

/* ---------- 手输 / 粘贴号码 ---------- */
/* 把一段文本解析成号码。支持：
   02 11 13 14 16 26 + 01 / 02,11,13,14,16,26,01 / 2 11 13 14 16 26+1
   02111314162601（14 位连写） / 1 2 3 或 123（按位玩法）            */
function numsOf(str, perDigit){
  var t=String(str||'').trim(); if(!t) return [];
  var toks=t.split(/[^0-9]+/).filter(function(x){return x!==''});
  var out=[], i, k, s;
  if(toks.length===1 && toks[0].length>1){
    s=toks[0];
    if(perDigit){ for(k=0;k<s.length;k++) out.push(parseInt(s[k],10)); }
    else if(s.length%2===0){ for(k=0;k<s.length;k+=2) out.push(parseInt(s.substr(k,2),10)); }
    else out.push(parseInt(s,10));
    return out;
  }
  for(i=0;i<toks.length;i++) out.push(parseInt(toks[i],10));
  return out;
}
function parseNumsText(txt, lot){
  var d=D[lot||S.lot], P=!!d.positional, i;
  var s=String(txt||'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248);});
  s=s.replace(/[\r\n\t]+/g,' ').trim();
  if(!s) return {ok:false, err:'请先粘贴或输入号码'};
  var p=s.search(/[+＋]/), L=s, R='';
  if(p>=0){ L=s.slice(0,p); R=s.slice(p+1); }
  var red, blue=[];
  if(P){
    red=numsOf(L,true).concat(R?numsOf(R,true):[]);
    if(red.length!==3) return {ok:false, err:'需 3 位数字，当前识别到 '+red.length+' 位'};
    var lo=(d.minNum===0||d.minNum)?d.minNum:0;
    for(i=0;i<3;i++){
      if(isNaN(red[i])||red[i]<lo||red[i]>9)
        return {ok:false, err:'第 '+(i+1)+' 位「'+red[i]+'」超出范围（'+lo+'-9）'};
    }
    return {ok:true, r:red, b:[]};
  }
  red=numsOf(L,false); blue=R?numsOf(R,false):[];
  /* 没有 + 号时：个数正好等于 红+蓝，则末尾几个当蓝球 */
  if(!R && red.length===d.redCount+d.blueCount){
    blue=red.slice(d.redCount); red=red.slice(0,d.redCount);
  }
  if(red.length!==d.redCount)
    return {ok:false, err:d.redLabel+'需 '+d.redCount+' 个，当前识别到 '+red.length+' 个'};
  if(blue.length!==d.blueCount)
    return {ok:false, err:d.blueLabel+'需 '+d.blueCount+' 个，当前识别到 '+blue.length+' 个'};
  for(i=0;i<red.length;i++)
    if(isNaN(red[i])||red[i]<1||red[i]>d.redMax)
      return {ok:false, err:d.redLabel+'「'+red[i]+'」超出范围 1-'+d.redMax};
  for(i=1;i<red.length;i++)
    if(red.indexOf(red[i])!==i)
      return {ok:false, err:d.redLabel+'不能重复：「'+pad(red[i])+'」重复了'};
  for(i=0;i<blue.length;i++)
    if(isNaN(blue[i])||blue[i]<1||blue[i]>d.blueMax)
      return {ok:false, err:d.blueLabel+'「'+blue[i]+'」超出范围 1-'+d.blueMax};
  red.sort(function(a,b){return a-b}); blue.sort(function(a,b){return a-b});
  return {ok:true, r:red, b:blue};
}

/* ================= 勾选要买的注 → 生成投注图片 =================
   选完号到店里这一步以前完全没有工具接手：一堆历史记录混在一起，
   分不清这回到底要买哪几注。勾选后生成一张可以直接递给老板看的单子。 */
function betKeyOf(bet){ return (bet.r||[]).join(',')+'|'+(bet.b||[]).join(','); }
function cartGet(){ if(!S.cart) S.cart=[]; return S.cart; }
function cartHas(bet){ return cartGet().indexOf(betKeyOf(bet))>=0; }
function cartToggleAt(i){ var a=getBets(); if(a[i]) cartToggle(a[i]); }
function cartToggle(bet){
  var c=cartGet(), k=betKeyOf(bet), i=c.indexOf(k);
  if(i>=0) c.splice(i,1); else c.push(k);
  render();
}
/* 只按号码匹配，不按序号——删除中间的注之后序号会串位 */
function cartList(){
  var bets=getBets(), out=[], i;
  for(i=0;i<bets.length;i++) if(cartHas(bets[i])) out.push({i:i, bet:bets[i]});
  return out;
}
function cartClear(){ S.cart=[]; render(); }
function slipBuyAll(){
  var list=cartList(), a=getBets(), n=0, i, j;
  for(i=0;i<list.length;i++){
    var x=list[i].bet;
    for(j=0;j<a.length;j++){
      if(a[j].t!==x.t || betKeyOf(a[j])!==betKeyOf(x)) continue;
      if(a[j].bought) break;
      a[j].bought=1; a[j].chk=0; n++;
      /* 标记已买即归档：选号记录只保存已购买的注 */
      archiveBought(S.lot, a[j]);
      break;
    }
  }
  saveBets(a); S.cart=[]; pendClear();
  closeHelp(); render();
  toast(n ? ('已标记 '+n+' 注为已购买，并归档到选号记录') : '这些注之前已经标记过了');
}

/* ================= 重复 / 相似提醒 =================
   守号的人常改两个数又存一遍，等于重复花钱买几乎同一组号 */
function isPosLot(lot){ var d=D[lot]; return !!(d && d.positional); }
function sameCount(a,b){
  var m={}, i, n=0;
  for(i=0;i<a.length;i++) m[a[i]]=1;
  for(i=0;i<b.length;i++) if(m[b[i]]) n++;
  return n;
}
function simCheck(lot, bet){
  var all=betsOfAll(), i, same=null, sim=null, P=isPosLot(lot);
  var rb=bet.r||[], bb=bet.b||[];
  for(i=0;i<all.length;i++){
    var o=all[i];
    if(o.lot!==lot || o.t===bet.t) continue;
    var k=sameCount(o.r||[], rb);
    if(k===rb.length && sameCount(o.b||[], bb)===bb.length){ if(!same) same={o:o}; continue; }
    var need = P ? 2 : rb.length-1;   /* 按位玩法对上 2 位算像；其余差 1 个算像 */
    if(!sim && k>=need && k>0) sim={o:o, k:k};
  }
  return {same:same, sim:sim};
}
function simSay(sm){
  if(sm.same) return '这注已经在「我的选号」里了（'+fmtTs(sm.same.o.t)+' 保存过），不必重复添加。';
  if(sm.sim) return '注意：与 '+fmtTs(sm.sim.o.t)+' 保存的那注高度相似'
    +'（'+redLabelOf()+'重合 '+sm.sim.k+' 个），等于花两份钱买几乎同一组号。';
  return '';
}
function redLabelOf(){ var d=D[S.lot]; return d? d.redLabel : '号码'; }

/* ═══════ 我的选号：拆成「选号盘 / 操作区 / 卡片列表」三块 ═══════
   原来 109 行全挤在一个函数里，改任何一小段都要在长函数中定位。
   现在每块一个函数，renderMine 只负责拼装。 */
function minePickPad(d){
  var h='<div class="pick">'
   +'<div style="font-size:12px;color:#666">'+d.redLabel+' 已选 <b>'+S.pickRed.length+'</b>/'+d.redCount+'</div><div class="grid">';
  for(var i=1;i<=d.redMax;i++)
    h+='<span class="nb'+(S.pickRed.indexOf(i)>=0?' sel':'')+'" onclick="togglePick('+i+',false)">'+pad(i)+'</span>';
  h+='</div><div style="font-size:12px;color:#666">'+d.blueLabel+' 已选 <b>'+S.pickBlue.length+'</b>/'+d.blueCount+'</div><div class="grid">';
  for(var j=1;j<=d.blueMax;j++)
    h+='<span class="nb'+(S.pickBlue.indexOf(j)>=0?' sel b':'')+'" onclick="togglePick('+j+',true)">'+pad(j)+'</span>';
  return h+'</div>';
}
function renderMine(){
  var d=D[S.lot], bets=getBets(), c=pickCheck();
  var h='<div class="card"><div class="sec">选号（'+d.name+'）</div>'
   + minePickPad(d);
  /* 手输 / 粘贴号码 */

  /* 预览 + 实时校验提示 */
  h+='<div class="prev"><div style="font-size:12px;color:#888;margin-bottom:6px">当前选择</div>'
   + fmtBalls({2:S.pickRed,3:S.pickBlue},true)
   +'<div class="msg" style="margin-top:8px">';
  if(!S.pickRed.length && !S.pickBlue.length){
    h+='<span style="color:#aaa">请从上方选择号码</span>';
  } else {
    c.err.forEach(function(m){ h+='<div class="e">✗ '+esc(m)+'</div>'; });
    c.warn.forEach(function(m){ h+='<div class="w">! '+esc(m)+'</div>'; });
    if(c.ok) h+='<div class="ok">✓ 号码有效，可添加</div>';
  }
  h+='</div></div>';
  h+='<div class="btns">'
   +'<button class="'+(c.ok?'p':'dis')+'" onclick="addBet()">添加</button>'
   +'<button onclick="randPick()">随机一注</button>'
   +'<button class="g" onclick="clearPick()">清空选择</button>'
   +favBtnCur()
   +'</div>';
  h+='<div class="note" style="margin:8px 12px 0">生成号码请到<b>「猜号参考」</b>：'
   +'可指定蓝球 / 后区、近 N 期避重与形态约束，每注点「存入」即回到本页。'
   +'<button class="mini" style="margin-left:8px" onclick="guessGo()">去生成号码 →</button></div>';
  h+='</div>';

  h+='<div class="sec">已保存 '+bets.length+' 注'
   +(bets.length?'<span style="float:right;font-weight:400;color:#c33;cursor:pointer" onclick="clearBets()">清空</span>':'')+'</div>';
  /* 重复 / 相似提醒：添加后短暂显示 */
  if(S.simMsg) h+='<div class="simwarn">⚠️ '+esc(S.simMsg)+'</div>';
  /* 勾选要买的注入口 */
  if(bets.length){
    var cl=cartList();
    h+='<div class="cartbox"><div class="cbhd"><span>已勾选 <b>'+cl.length+'</b> 注'
      +(cl.length?('　合计 <b style="color:#c62828">'+(cl.length*unitPrice())+'</b> 元'):'')+'</span>'
      +(cl.length?'<span style="color:#c33;cursor:pointer" onclick="cartClear()">清空勾选</span>':'')+'</div>'
      +'<div style="font-size:11.5px;color:var(--fg5);margin-top:5px">'
      +'勾上这回要买的注 → 生成一张可以给店主看、能转发的投注图片。</div>'
      +'<div class="btns" style="margin:8px 0 0">'
      +'<button class="p" onclick="showBetImage()">生成投注图片</button></div></div>';
  }
  if(!bets.length)
    h+='<div class="empty">还没有自选号码<br><span style="font-size:12px">在上面选好号码后点「添加」；点「随机一注」会先填好，再点「添加」才会保存</span></div>';
  /* 全部操作：复制 / 生成图片 */
  if(bets.length)
    h+='<div class="betops" style="margin:8px 12px 0">'
      +'<button onclick="copyAllBets()">复制全部文本</button></div>';
  /* 中奖汇总 */
  if(bets.length){
    var won=0, amt=0, pend=0, nb=0;
    for(var m=0;m<bets.length;m++){
      if(bets[m].bought) nb++;
      var rr=betResult(bets[m]);
      if(rr.state==='wait'){ pend++; continue; }
      if(rr.p){ won++; if(rr.p.amt) amt+=rr.p.amt; }
    }
    var sum='';
    if(won) sum+=' 🎉 <b>'+won+'</b> 注中奖'+(amt?('，固定奖共 <b>'+amt+'</b> 元'):'');
    if(pend) sum+=' ⏳ <b>'+pend+'</b> 注待开奖';
    if(!won && !pend) sum=' 本轮均未中奖';
    h+='<div class="bres" style="margin:8px 12px 0">自动对比最新一期：'+sum+'</div>';
    h+='<div class="bres" style="margin:6px 12px 0">已买 <b>'+nb+'</b> 注 · 未买 <b>'
      +(bets.length-nb)+'</b> 注<span style="opacity:.75">（添加选号默认「未购买」；'
      +'点「标记为已买」后<b>不能改回</b>）</span></div>';
  }
  for(var b=0;b<bets.length;b++){
    var bet=bets[b], r={2:bet.r,3:bet.b}, a=analyze(bet.r,bet.b);
    h+='<div class="betcard"><div class="bettop"><div>'+fmtBalls(r,true)+'</div></div>'
      /* 勾选这回要买的注（已买过的就不必再勾了） */
      +(bet.bought?'':'<label class="cartchk"><input type="checkbox" '
        +(cartHas(bet)?'checked':'')+' onchange="cartToggleAt('+b+')">'
        +'加入这次要买的</label>')
      +'<div style="font-size:12px;color:#666;margin-top:6px">和值 '+sumRed(r)+' · 奇偶比 '+oddStr(r)
      +(rbOverlap(r)?' · <span style="color:#c33">'+d.blueLabel+'与'+d.redLabel+'有重合</span>':'')+'</div>';
    /* 自动核对结果 */
    h+=betResHtml(bet);
    /* -2 购买状态 */
    var isB2=bet.bought?1:0;
    h+='<div style="margin-top:6px"><span class="buyflag '+(isB2?'on':'')+'">'
      +(isB2?'✅ 已购买':'⚪ 未购买')+'</span></div>';
    /* 复制 / 图片 */
    h+='<div class="betops">'
      +'<button onclick="copyBet('+b+')">复制这注</button>'
      +'<button onclick="showBetImage()">生成图片</button>'
      +'<button onclick="backtestShow('+b+')">历史比对</button>'
      +favBtnFor(b)
      +(isB2?'':'<button onclick="toggleBetBought('+b+')">标记为已买</button>')
      +'<button class="delbtn" onclick="delBet('+b+')">删除</button></div>';
    if(a.exact)
      h+='<div class="kv"><span class="tagline tag-hot">历史开出过</span>'
        +esc(a.exact.issue)+' 期（'+esc(a.exact.date)+'）'+d.blueLabel+' '+a.exact.blue.map(pad).join(' ')+'</div>';
    else
      h+='<div class="kv"><span class="tagline tag-no">历史未出现过</span>该组'+d.redLabel+'在 '+a.draws+' 期中从未开出</div>';
    h+='<div class="kv">全史最相近 <b>'+esc(a.best.issue)+'</b>（'+esc(a.best.date)+'）重合 <b>'+a.best.overlap+'</b> 个'
      +' ['+a.best.shared.map(pad).join(' ')+']</div>';
    h+='</div>';
  }
  h+='<div class="note">自选号码保存在本机浏览器，不会上传。以上为历史统计，'
    +'任何号码的中奖概率相同，不构成预测。</div></div>';
  return h;
}

/* 统一时间格式：YYYY-MM-DD HH:MM:SS */
function fmtDt(dt){
  var p=function(x){return (x<10?'0':'')+x;};
  return dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate())+' '
       + p(dt.getHours())+':'+p(dt.getMinutes())+':'+p(dt.getSeconds());
}
/* 普通用户激活后，页面最顶端常驻显示授权到期时间（管理员免激活，不显示） */
function licDaysLeft(exp){
  try{
    var a=new Date(exp+'T00:00:00'), b=new Date(licToday()+'T00:00:00');
    return Math.max(0, Math.round((a-b)/86400000));
  }catch(e){ return 0; }
}
function licTopBar(){
  if(!LICENSE) return '';
  if(admIn()) return '';                 /* 管理员本人免激活 */
  var o=licGet(); if(!o||!o.code) return '';
  var exp=(o.exp && /^\d{4}-/.test(o.exp))?o.exp:(LICENSE.expire||'');
  if(!exp) return '';
  var days=licDaysLeft(exp), warn=days<=7;
  return '<div class="upd" style="'+(warn?'color:#c33;font-weight:600':'')+'">'
    +'授权有效期至 '+esc(exp)+'（还剩 '+days+' 天）</div>';
}
/* 数据新鲜度：返回距「数据更新时刻」的天数；取不到时间返回 -1 */
function dataAgeDays(){
  var d=D[S.lot]; if(!d) return -1;
  var ts=Number(d.updatedAt)*1000, t=null;
  if(ts>0) t=new Date(ts);
  else if(d.buildDate){
    var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d.buildDate));
    if(m) t=new Date(+m[1],+m[2]-1,+m[3]);
  }else if(d.rows && d.rows.length){
    var m2=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d.rows[d.rows.length-1][1]));
    if(m2) t=new Date(+m2[1],+m2[2]-1,+m2[3]);
  }
  if(!t || isNaN(t.getTime())) return -1;
  return Math.floor((Date.now()-t.getTime())/86400000);
}
function head(){
  var d=D[S.lot], ts=Number(d&&d.updatedAt)*1000, t=(ts>0)?new Date(ts):null;
  var txt=t?fmtDt(t):((d&&d.buildDate)?String(d.buildDate)
      :((d&&d.rows&&d.rows.length)?String(d.rows[d.rows.length-1][1]):'未知'));
  var s=licTopBar();
  s+='<div class="upd">数据更新于 '+txt
    +' · 当前时间 <span id="nowtm">'+fmtDt(new Date())+'</span></div>';
  /* 数据新鲜度提醒：CI 抓取可能因网络被风控失败，数据会悄悄停在几天前，
     页面上看不出来，所以超过 3 天就明确提示 */
  var age=dataAgeDays();
  if(age>=3)
    s+='<div class="upd" style="color:#c33;font-weight:600">⚠️ 数据已 '+age+' 天未更新</div>';
  if(d.stale) s+='<div class="card"><div class="warn">当前展示的是上次成功抓取的数据快照。</div></div>';
  return s;
}
/* 金额简写：1056837777 → 10.57 亿 */
function moneyShort(v){

/* 当前奖池：只在该奖池对应期号与最新一期一致时才显示，避免显示过期金额 */

/* ================= 按位玩法：福彩3D / 排列三 ================= */
/* 与双色球/大乐透的区别：3 位数字、每位 0-9、可重复、有顺序 */
function isPos(){ var d=D[S.lot]; return !!(d&&d.positional); }
function span3(r){ var a=r[2]; return Math.max.apply(null,a)-Math.min.apply(null,a); }
function form3(a){
  var u={}, i, n=0;
  for(i=0;i<a.length;i++){ if(!u[a[i]]){u[a[i]]=1;n++;} }
  return n===1?'豹子':(n===2?'组三':'组六');
}
function posCnt(rows,pos){
  var cnt=[],i; for(i=0;i<=9;i++) cnt[i]=0;
  for(i=0;i<rows.length;i++){ var v=rows[i][2][pos]; if(v>=0&&v<=9) cnt[v]++; }
  return cnt;
}
/* 3D / 排列三 奖级：直选 1040、组三 346、组六 173（固定奖） */
function posPrize(my, hit){
  var i, straight=true;
  for(i=0;i<3;i++) if(my[i]!==hit[i]) straight=false;
  if(straight) return {name:'直选', amt:1040, desc:'三位数字与顺序完全相同'};
  var a=my.slice().sort().join(','), b=hit.slice().sort().join(',');
  if(a!==b) return null;
  return form3(hit)==='组三' ? {name:'组选三', amt:346, desc:'数字相同、顺序不限（含两个相同数字）'}
                            : {name:'组选六', amt:173, desc:'数字相同、顺序不限（三个数字各不相同）'};
}
function posBetResult(bet){
  var d=D[S.lot], rows=d.rows;
  /* 同 recResult：对的是「买的那期」，不是最新一期 */
  var last=recRow({lot:S.lot, t:bet.t}, null);
  if(!last) return {issue:'', p:null, hit:[], wait:1};
  var hit=last[2], p=posPrize(bet.r, hit);
  return {issue:last[0], p:p, hit:hit, date:last[1]};
}

/* 3D / 排列三 出现次数：与双色球一致，默认按出现次数升序，表头可切字段与升降序 */
function freq3Block(p,d,rows,N){
  var so=S.fSort3['p'+p], cnt=posCnt(rows,p), arr=[], n;
  for(n=0;n<=9;n++) arr.push({num:n, cnt:cnt[n], pct:cnt[n]/N*100});

/* ================= 复式 / 胆拖 ================= */
function C(n,k){
  if(k<0||k>n||n<0) return 0;
  k=Math.min(k,n-k); var r=1,i;
  for(i=1;i<=k;i++){ r=r*(n-k+i)/i; }
  return Math.round(r);
}
function toggleFs(arr,n){
  var i=arr.indexOf(n);
  if(i>=0) arr.splice(i,1); else arr.push(n);
  arr.sort(function(a,b){return a-b});
  render();
}
function comboList(arr,k){
  var out=[];
  (function rec(start,cur){
    if(cur.length===k){ out.push(cur.slice()); return; }
    for(var i=start;i<arr.length;i++){ cur.push(arr[i]); rec(i+1,cur); cur.pop(); }
  })(0,[]);
  return out;
}
function fsCalc(){
  /* 返回 {ok, notes, amt, detail, msg} */
  var d=D[S.lot];
  if(isPos()){
    var a=S.fs3, i, n=a[0].length*a[1].length*a[2].length;
    if(!n) return {ok:false, msg:'请为每一位至少选一个数字'};
    var list=[];
    if(n<=200){
      for(i=0;i<a[0].length;i++) for(var j=0;j<a[1].length;j++) for(var k=0;k<a[2].length;k++)
        list.push([a[0][i],a[1][j],a[2][k]]);
    }
    return {ok:true, notes:n, amt:n*2, list:list,
            msg:'直选复式：百位 '+a[0].length+' 个 × 十位 '+a[1].length+' 个 × 个位 '+a[2].length+' 个'};
  }
  if(fsIsFushi()){
    var R=S.fsRed.length, B=S.fsBlue.length;
    if(R<d.redCount) return {ok:false, msg:d.redLabel+'至少选 '+d.redCount+' 个（当前 '+R+' 个）'};
    if(B<d.blueCount) return {ok:false, msg:d.blueLabel+'至少选 '+d.blueCount+' 个（当前 '+B+' 个）'};
    var c=C(R,d.redCount)*C(B,d.blueCount);
    var l2=[];
    if(c<=200){
      var rc=comboList(S.fsRed,d.redCount), bc=comboList(S.fsBlue,d.blueCount);
      for(var x=0;x<rc.length;x++) for(var y=0;y<bc.length;y++) l2.push({r:rc[x], b:bc[y]});
    }
    return {ok:true, notes:c, amt:c*2, list:l2,
            msg:'复式：'+d.redLabel+'选 '+R+' 个（C('+R+','+d.redCount+')='+C(R,d.redCount)+'）'
                +' × '+d.blueLabel+'选 '+B+' 个（C('+B+','+d.blueCount+')='+C(B,d.blueCount)+'）'};
  }
  /* 胆拖 */
  var dan=S.fsDan.length, tuo=S.fsTuo.length, B2=S.fsBlue.length;
  if(dan<1) return {ok:false, msg:'请至少选 1 个胆码'};
  if(dan>=d.redCount) return {ok:false, msg:'胆码最多选 '+(d.redCount-1)+' 个（当前 '+dan+' 个）'};
  if(dan+tuo<d.redCount) return {ok:false, msg:'胆码 + 拖码至少要 '+d.redCount+' 个（当前 '+(dan+tuo)+' 个）'};
  if(B2<d.blueCount) return {ok:false, msg:d.blueLabel+'至少选 '+d.blueCount+' 个（当前 '+B2+' 个）'};
  var need=d.redCount-dan;
  var c3=C(tuo,need)*C(B2,d.blueCount);
  var l3=[];
  if(c3<=200){
    var tc=comboList(S.fsTuo,need), b3=comboList(S.fsBlue,d.blueCount);
    for(var m=0;m<tc.length;m++) for(var q=0;q<b3.length;q++)
      l3.push({r:S.fsDan.concat(tc[m]).sort(function(a,b){return a-b}), b:b3[q]});
  }
  return {ok:true, notes:c3, amt:c3*2, list:l3,
          msg:'胆拖：胆码 '+dan+' 个 + 拖码 '+tuo+' 个（C('+tuo+','+need+')='+C(tuo,need)+'）'
              +' × '+d.blueLabel+' '+C(B2,d.blueCount)};
}
/* ================= 复式缩水 =================
   复式覆盖所有组合，里面难免混着「和值极端」「全奇全偶」这类你不想要的注。
   缩水就是先定一组条件，把这些组合剔掉，只留下符合的——注数和金额都会降下来。
   ⚠️ 缩水只是少买几注，同样不改变中奖概率的数学期望。 */
function fsLastRed(){
  var d=D[S.lot]; if(!d||!d.rows||!d.rows.length) return [];
  var r=d.rows[d.rows.length-1];
  return (r&&r[2])?r[2]:[];
}
function fsRV(v, def){ var n=parseInt(v,10); return (v===''||v==null||isNaN(n))?def:n; }
function fsStat(arr, redMax){
  var sum=0, odd=0, big=0, i;
  for(i=0;i<arr.length;i++){ sum+=arr[i]; if(arr[i]%2) odd++; if(arr[i]>redMax/2) big++; }
  var run=1, mx=arr.length?1:0;
  for(i=1;i<arr.length;i++){
    if(arr[i]===arr[i-1]+1){ run++; if(run>mx) mx=run; } else run=1;
  }
  return {sum:sum, odd:odd, big:big, run:mx};
}
/* 红球组合是否通过缩水条件 */
function fsPassRed(arr){
  var d=D[S.lot], st=fsStat(arr,d.redMax), lo, hi;
  lo=fsRV(S.fsSumMin,-1e9); hi=fsRV(S.fsSumMax,1e9);
  if(st.sum<lo||st.sum>hi) return false;
  lo=fsRV(S.fsOddMin,0);    hi=fsRV(S.fsOddMax,d.redCount);
  if(st.odd<lo||st.odd>hi) return false;
  lo=fsRV(S.fsBigMin,0);    hi=fsRV(S.fsBigMax,d.redCount);
  if(st.big<lo||st.big>hi) return false;
  if(st.run>fsRV(S.fsRunMax,d.redCount)) return false;
  var last=fsLastRed(), rep=0, i;
  for(i=0;i<arr.length;i++) if(last.indexOf(arr[i])>=0) rep++;
  lo=fsRV(S.fsRepMin,0); hi=fsRV(S.fsRepMax,d.redCount);
  if(rep<lo||rep>hi) return false;
  return true;
}
/* 3D / 排列三：按位组合是否通过 */
function fsPass3(t){
  var sum=t[0]+t[1]+t[2];
  var sp=Math.max(t[0],t[1],t[2])-Math.min(t[0],t[1],t[2]);
  var lo=fsRV(S.fs3SumMin,0),  hi=fsRV(S.fs3SumMax,27);
  if(sum<lo||sum>hi) return false;
  lo=fsRV(S.fs3SpanMin,0); hi=fsRV(S.fs3SpanMax,9);
  if(sp<lo||sp>hi) return false;
  var form=(t[0]===t[1]&&t[1]===t[2])?'bz':(t[0]===t[1]||t[1]===t[2]||t[0]===t[2])?'z3':'z6';
  if(S.fs3Form && S.fs3Form!=='any' && S.fs3Form!==form) return false;
  return true;
}
/* 生成完整组合列表（用于缩水）。注数过大就不生成，避免卡死 */
function fsFullList(){
  var r=fsCalc(), d=D[S.lot];
  if(!r.ok) return {ok:false, msg:r.msg};
  var cap=30000;
  if(r.notes>cap) return {ok:true, tooMany:true, notes:r.notes, amt:r.amt, list:[]};
  var list=[], i, j;
  if(isPos()){
    for(var a=0;a<S.fs3[0].length;a++) for(var b=0;b<S.fs3[1].length;b++) for(var c=0;c<S.fs3[2].length;c++)
      list.push([S.fs3[0][a],S.fs3[1][b],S.fs3[2][c]]);
  }else{
    var rc, bc=comboList(S.fsBlue,d.blueCount);
    if(fsIsFushi()) rc=comboList(S.fsRed,d.redCount);
    else{
      var need=d.redCount-S.fsDan.length;
      var tc=comboList(S.fsTuo,need);
      rc=[];
      for(i=0;i<tc.length;i++) rc.push(S.fsDan.concat(tc[i]).sort(function(x,y){return x-y}));
    }
    for(i=0;i<rc.length;i++) for(j=0;j<bc.length;j++) list.push({r:rc[i], b:bc[j]});
  }
  return {ok:true, notes:r.notes, amt:r.amt, list:list};
}
/* 缩水结果：{on, orig, kept, amt, list, tooMany} */
function fsShrunk(){
  var full=fsFullList();
  if(!full.ok) return {on:false, orig:0, kept:0, amt:0, list:[]};
  if(!S.fsShrink) return {on:false, orig:full.notes, kept:full.notes, amt:full.amt, list:full.list};
  if(full.tooMany) return {on:true, tooMany:true, orig:full.notes, kept:0, amt:0, list:[]};
  var out=[], i, P=isPos();
  for(i=0;i<full.list.length;i++){
    var it=full.list[i];
    if(P){ if(fsPass3(it)) out.push(it); }
    else { if(fsPassRed(it.r)) out.push(it); }
  }
  return {on:true, orig:full.notes, kept:out.length, amt:out.length*2, list:out};
}
/* ================= 遗漏排行榜 =================
   当前遗漏 = 该号码距上一次开出，已经连续多少期没出现。
   遗漏越大＝越久没出（越"冷"）。同样是已开奖结果的统计，没有预测能力。 */
function missRankData(isBlue){
  var d=D[S.lot], max=isBlue?d.blueMax:d.redMax, key=isBlue?3:2, n, i;
  var rows=d.rows||[], out=[];
  for(n=1;n<=max;n++){
    var m=-1, ld='';
    for(i=rows.length-1;i>=0;i--){
      if((rows[i][key]||[]).indexOf(n)>=0){ m=rows.length-1-i; ld=rows[i][1]||''; break; }
    }
    out.push({num:n, miss:(m<0?rows.length:m), never:(m<0), last:ld});
  }
  out.sort(function(a,b){ return b.miss-a.miss || a.num-b.num; });
  return out;
}
/* 3D / 排列三：按位统计 */
function missRankData3(p){
  var d=D[S.lot], rows=d.rows||[], out=[], n, i;
  for(n=0;n<=9;n++){
    var m=-1, ld='';
    for(i=rows.length-1;i>=0;i--){
      if(rows[i][2] && rows[i][2][p]===n){ m=rows.length-1-i; ld=rows[i][1]||''; break; }
    }
    out.push({num:n, miss:(m<0?rows.length:m), never:(m<0), last:ld});
  }
  out.sort(function(a,b){ return b.miss-a.miss || a.num-b.num; });
  return out;
}

  }

function renderMiss(){

/* ================= 历史比对（最相近的开奖） =================
   把这一注放进全部历史逐期比对：如果历史上每期都买它，会中几次、拿多少固定奖。
   注意这只是「事后统计」，用来看看这注在历史上的表现，没有任何预测能力。 */
function backtest(bet){
  var d=D[S.lot], rows=d.rows||[], i, j, P=isPos();
  var red=bet.r||[], blue=bet.b||[], n=rows.length, list=[];
  for(i=0;i<n;i++){
    var r=rows[i], ds=r[2]||[];
    if(P){
      /* 按位玩法：pos=位置完全一致的位数；any=三个数字都出现过（不论位置） */
      var pos=0, any=0, pool={};
      for(j=0;j<3;j++) if(ds[j]===red[j]) pos++;
      for(j=0;j<3;j++) pool[ds[j]]=(pool[ds[j]]||0)+1;
      for(j=0;j<3;j++) if(pool[red[j]]>0){ any++; pool[red[j]]--; }
      list.push({issue:r[0],date:r[1],red:ds,blue:[],k:pos,hb:any-pos,pos:pos,any:any});
    }else{
      var rk={}, k=0;
      for(j=0;j<ds.length;j++) rk[ds[j]]=1;
      for(j=0;j<red.length;j++) if(rk[red[j]]) k++;
      var hb=0, bl=r[3]||[];
      for(j=0;j<bl.length;j++) if(blue.indexOf(bl[j])>=0) hb++;
      list.push({issue:r[0],date:r[1],red:ds,blue:bl,k:k,hb:hb,pos:k,any:k});
    }
  }
  /* 排序：吻合个数降序 → 次级（蓝球/错序）降序 → 期号降序（近期优先） */
  list.sort(function(a,b){
    if(b.k!==a.k) return b.k-a.k;
    if(b.hb!==a.hb) return b.hb-a.hb;
    if(String(b.issue)!==String(a.issue)) return String(b.issue)>String(a.issue)?-1:1;
    return 0;
  });
  return {n:n, list:list, top:list.slice(0,10), P:P};
}

/* ================= 区间分布（三分区） =================
   双色球 1-11 / 12-22 / 23-33，大乐透 1-12 / 13-24 / 25-35。
   按位玩法（福彩3D / 排列三）每位只有 0-9，用 0-4 / 5-9 两分区。 */
var ZONES={
  ssq:[[1,11],[12,22],[23,33]],
  dlt:[[1,12],[13,24],[25,35]],
  '3d':[[0,4],[5,9]],
  pls:[[0,4],[5,9]]
};
var ZONE_NAMES={
  ssq:['一区 1-11','二区 12-22','三区 23-33'],
  dlt:['一区 1-12','二区 13-24','三区 25-35'],
  '3d':['小区 0-4','大区 5-9'],
  pls:['小区 0-4','大区 5-9']
};
var ZONE_COLORS=['#e8402a','#2b6cd4','#1a9c46'];
function zoneIdx(n){
  var zs=ZONES[S.lot]||ZONES.ssq, i;
  for(i=0;i<zs.length;i++) if(n>=zs[i][0] && n<=zs[i][1]) return i;
  return -1;
}

/* ================= 奖池 / 销量 / 一等奖走势 =================
   数据来自官方接口每期的 poolmoney / poolBalance，
   取最近 120 期（大乐透 100 期）。福彩3D / 排列三无奖池。 */
function poolHistOf(d){ return (d && d.poolHist) || []; }
function fmtMoney(v){
  if(v==null) return '—';
  if(v>=1e8) return (v/1e8).toFixed(2)+' 亿';
  if(v>=1e4) return (v/1e4).toFixed(1)+' 万';
  return String(v);
}
/* ---------- 蓝球 / 后区独立分析 ---------- */
/* 计算每个蓝球的：出现次数、占比、当前遗漏、最大遗漏、平均间隔、上次开出日期 */
function blueStat(){
  var d=D[S.lot], max=d.blueMax, sc=scopeRows(S.blueWin||'all'), rows=sc.rows, N=rows.length;
  var out=[], n, i;
  for(n=1;n<=max;n++){
    var cnt=0, cur=-1, mx=0, run=0, seen=false, last='', ld='';
    for(i=0;i<rows.length;i++){
      var hit=(rows[i][3]||[]).indexOf(n)>=0;
      if(hit){
        if(seen && run>mx) mx=run;
        run=0; seen=true; cnt++; ld=rows[i][1]; last=rows[i][0];
      } else if(seen) run++;
    }
    if(seen && run>mx) mx=run;
    /* 当前遗漏：从最后一期往前，直到开出该号 */
    cur=0;
    for(i=rows.length-1;i>=0;i--){
      if((rows[i][3]||[]).indexOf(n)>=0) break;
      cur++;
    }
    if(!seen) cur=N;   /* 窗口内从未出现 */
    /* 占比：该号出现次数 ÷ 后区总开出个数（N × 每期个数），全部号码合计为 100% */
    var slots=N*(d.blueCount||1);
    out.push({num:n, cnt:cnt, pct:slots?(cnt/slots*100):0, cur:cur, mx:mx,
              gap:cnt?Math.round(N/cnt):0, lastDate:ld, lastIssue:last, seen:seen});
  }
  return {rows:out, N:N, label:sc.label, max:max};
}
/* ───────── 蓝球分析：表头点击多选条件 + 综合评分排序 ─────────
   每个已选条件把号码按该指标的名次折算成 0~100 分（越符合方向分越高），
   多条件等权平均得「综合分」，按综合分降序排列。
   例：出现次数↑ + 当前遗漏↓ → 次数少且遗漏久的号一起顶到最前。
   名次制不受个别极端值影响；并列取平均名次，从未开出的号得 0 分。
   S.blueSorts = [{k:字段, dir:1升序 / -1降序}, ...] */
var BLUE_SORT_ORDER=['num','cnt','pct','cur','mx','gap','lastDate'];
var BLUE_SORT_DEF={num:1,cnt:-1,pct:-1,cur:-1,mx:-1,gap:-1,lastDate:-1};
var BLUE_SORT_NAME={num:'号码',cnt:'出现次数',pct:'占比',cur:'当前遗漏',
  mx:'最大遗漏',gap:'平均间隔',lastDate:'上次开出'};
var BLUE_SORT_MARK=['①','②','③'];
function blueSortIdx(k){ var i=BLUE_SORT_ORDER.indexOf(k); return i<0?99:i; }
function blueSortKeys(){
  /* 兼容旧的单列状态：显式设置 S.blueSort 时重置为单列 */
  if(S.blueSort){
    var old=S.blueSort;
    S.blueSorts=[{k:old, dir:old==='num'?1:-1}];
    delete S.blueSort;
  }
  if(!S.blueSorts || !S.blueSorts.length) S.blueSorts=[{k:'cnt',dir:-1}];
  /* 综合分等权平均，与条件先后无关；按列顺序归一只为表头角标稳定 */
  S.blueSorts.sort(function(a,b){return blueSortIdx(a.k)-blueSortIdx(b.k)});
  return S.blueSorts;
}
/* 字段值数值化；null 表示无值（窗口内从未开出） */
function blueScoreVal(o,k){
  if(k==='lastDate'){
    if(!o.seen || !o.lastDate) return null;
    var t=new Date(String(o.lastDate).replace(/-/g,'/')).getTime();
    return isNaN(t)?null:t;
  }
  return o[k];
}
/* 单一条件的名次分：最符合方向的号 100 分，最不符合的 0 分，并列取平均名次 */
function blueRankScores(arr,k,dir){
  var i,j,r,t,sc={},vals=[],idx=[],n,s;
  for(i=0;i<arr.length;i++) vals.push(blueScoreVal(arr[i],k));
  for(i=0;i<arr.length;i++) if(vals[i]!=null) idx.push(i);
  n=idx.length;
  if(!n){ for(i=0;i<arr.length;i++) sc[arr[i].num]=0; return sc; }
  idx.sort(function(x,y){
    var c=dir===1?(vals[x]-vals[y]):(vals[y]-vals[x]);
    return c || (arr[x].num-arr[y].num);
  });
  for(i=0;i<n;){
    j=i;
    while(j+1<n && vals[idx[j+1]]===vals[idx[j]]) j++;
    r=(i+j)/2;
    s=n<=1?100:(n-1-r)/(n-1)*100;
    for(t=i;t<=j;t++) sc[arr[idx[t]].num]=s;
    i=j+1;
  }
  for(i=0;i<arr.length;i++) if(vals[i]==null) sc[arr[i].num]=0;
  return sc;
}
/* 给每行算综合分（0~100），多条件等权平均；无值（从未开出）固定排最后 */
function blueScoreRows(arr){
  var ks=blueSortKeys(), i, j, maps=[];
  for(i=0;i<ks.length;i++) maps.push(blueRankScores(arr,ks[i].k,ks[i].dir));
  for(i=0;i<arr.length;i++){
    var o=arr[i], sum=0, miss=false;
    for(j=0;j<maps.length;j++){
      sum+=(maps[j][o.num]||0);
      if(blueScoreVal(o,ks[j].k)==null) miss=true;
    }
    o._sc=maps.length?sum/maps.length:0;
    o._miss=miss;
  }
  return arr;
}
/* 综合分降序；无值行垫底，同分按号码升序，保证结果确定 */
function blueSortCmp(a,b){
  if(!!a._miss!==!!b._miss) return a._miss?1:-1;
  var c=(b._sc||0)-(a._sc||0);
  return c || (a.num-b.num);
}
function blueApplySort(arr){ return blueScoreRows(arr).sort(blueSortCmp); }
function blueSortSet(k){
  /* 未参与 → 加入（默认方向）；已参与 → 只翻方向。取消交给表头 ×。 */
  var ks=blueSortKeys(), i, idx=-1, def=BLUE_SORT_DEF[k];
  if(def==null) return;
  for(i=0;i<ks.length;i++) if(ks[i].k===k){ idx=i; break; }
  S.blueSortHint='';
  if(idx<0){
    if(ks.length>=3){
      var gone=ks.pop();
      S.blueSortHint='最多 3 个条件，已移除「'+(BLUE_SORT_NAME[gone.k]||gone.k)+'」';
    }
    ks.push({k:k, dir:def});
  }else{
    ks[idx].dir=-ks[idx].dir;
  }
  delete S.blueSort;
  render();
}
function blueSortRemove(k){
  var ks=blueSortKeys(), i;
  for(i=0;i<ks.length;i++) if(ks[i].k===k){ ks.splice(i,1); break; }
  if(!ks.length) ks.push({k:'cnt',dir:-1});   /* 至少保留一个条件 */
  S.blueSortHint='';
  delete S.blueSort;
  render();
}
function blueSortReset(){
  S.blueSorts=[{k:'cnt',dir:-1}];
  S.blueSortHint='';
  delete S.blueSort;
  render();
}

/* ───────── 公共骨架 ─────────

      +(it[3]?'<div style="font-size:11px;color:var(--fg5)">'+esc(it[3])+'</div>':'')
      +'</div>';

}

  /* 汇总卡 */

  h+=statCards([

    ['当前遗漏最久', pad(curMaxN), '#3b6fd4', '已 '+curMax+' 期未出'],
    ['历史最大遗漏', pad(mxAllN), '', mxAll+' 期']
  ]);
  /* 三档遗漏条：冷 / 温 / 热 */
  var byCur=st.rows.slice().sort(function(a,b){return b.cur-a.cur});

  function barOf(list, title, cls){

    for(var k=0;k<list.length;k++){

  h+=barOf(byCur.slice(0,third),'冷区（遗漏最长）','cold');
  h+=barOf(byCur.slice(third,third*2),'温区','warm');
  h+=barOf(byCur.slice(third*2),'热区（近期开出）','hot');
  h+='<div style="font-size:11px;color:var(--fg5);padding:6px 12px 0">'
    +'大字是<b>号码</b>，彩色胶囊是<b>当前遗漏期数</b>，下方小字是<b>累计出现次数</b>；三档按遗漏从长到短排列</div>';
  /* 完整表格 */

        +BLUE_SORT_MARK[pos]+(keys[pos].dir===1?'↑':'↓')+'</span>'
        +'<span title="取消该列" style="margin-left:4px;color:var(--fg5);font-size:12px;cursor:pointer"'
        +' onclick="event.stopPropagation();blueSortRemove(\''+k+'\')">×</span>'
      : '';
    return '<th style="cursor:pointer;white-space:nowrap" title="点击加入排序；再点切换升降；× 取消"'
      +' onclick="blueSortSet(\''+k+'\')">'+t+mark+'</th>';
  }
  /* 当前条件：用「＋」连接，强调等权而不是先后 */
  var sortTxt=keys.map(function(o,i){
    return (BLUE_SORT_NAME[o.k]||o.k)+' '+(o.dir===1?'↑':'↓');
  }).join(' ＋ ');
  h+='<div class="bar" style="font-size:12px;gap:8px;flex-wrap:wrap">'
    +'<span style="color:var(--fg5)">综合排序</span><b>'+esc(sortTxt)+'</b>'
    +'<span style="color:var(--fg5)">各条件等权，综合分越高越靠前</span>'
    +'<button class="mini" style="margin-left:auto" onclick="blueSortReset()">恢复默认</button></div>';
  h+='<div style="overflow-x:auto;margin-top:10px"><table class="tb"><thead><tr>'
    +th('num',esc(d.blueLabel))+th('cnt','出现次数')+th('pct','占比')
    +th('cur','当前遗漏')+th('mx','最大遗漏')+th('gap','平均间隔')+th('lastDate','上次开出')
    +'<th title="各排序条件名次分的等权平均，越高越靠前" style="white-space:nowrap">综合分</th>'
    +'</tr></thead><tbody>';
  for(var j=0;j<arr.length;j++){
    var o=arr[j];
    h+='<tr><td><span class="nb b" style="min-width:auto">'+pad(o.num)+'</span></td>'
      +'<td>'+o.cnt+'</td><td>'+o.pct.toFixed(2)+'%</td>'
      +'<td'+(o.cur>=30?' style="color:#c33;font-weight:600"':'')+'>'+o.cur+'</td>'
      +'<td>'+o.mx+'</td><td>'+o.gap+'</td>'
      +'<td>'+(o.seen?esc(o.lastDate||'—'):'—')+'</td>'
      +'<td style="min-width:76px"><div style="display:flex;align-items:center;gap:5px">'
      +'<b'+(o._sc>=80?' style="color:var(--brand)"':'')+'>'+Math.round(o._sc)+'</b>'
      +'<span style="flex:1;min-width:26px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden">'
      +'<span style="display:block;height:100%;width:'+Math.round(o._sc)+'%;background:var(--brand)"></span>'
      +'</span></div></td></tr>';
  }
  h+='</tbody></table></div>';
  h+='<div class="note"><b>点表头加条件</b>，再点切升↑降↓，点 × 取消（最多 3 项）；'
    +'各条件等权折算成综合分，越高越靠前。'
    +'<b>当前遗漏</b>=距上次开出连续多少期没出；<b>平均间隔</b>=总期数÷出现次数。</div></div>';
  return h;
}

  h+='<div style="display:flex;gap:8px;padding:0 12px 8px;flex-wrap:wrap">'
    +'<div style="flex:1;min-width:96px;background:var(--surface2);border-radius:8px;padding:8px 10px">'

    +'<div style="font-size:17px;font-weight:700;color:#e8402a">'+fmtMoney(poolV)+'</div></div>'
    +'<div style="flex:1;min-width:96px;background:var(--surface2);border-radius:8px;padding:8px 10px">'
    +'<div style="font-size:11px;color:var(--fg5)">当期销量</div>'

    +'<div style="flex:1;min-width:96px;background:var(--surface2);border-radius:8px;padding:8px 10px">'
    +'<div style="font-size:11px;color:var(--fg5)">一等奖单注</div>'
    +'<div style="font-size:17px;font-weight:700;color:#1a9c46">'+fmtMoney(p1V)+'</div></div>'
    +'</div>';
  /* 折线图 */
  var vals=[], labels=[], i;
  for(i=0;i<ph.length;i++){ var v=ph[i][KI.i]; if(v!=null){ vals.push(v); labels.push(ph[i]); } }
  var N=vals.length;
  if(N>=2){
    var W=Math.max(320, vw()-24), H=200, PL=52, PT=14, PB=26;
    var iw=W-PL-14, ih=H-PT-PB;
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals);
    var span=(mx-mn)||1, pad=span*0.08;
    var lo=mn-pad, hi=mx+pad;
    function X(i){ return PL + (N>1? i*iw/(N-1) : iw/2); }
    function Y(v){ return PT + ih - (v-lo)/(hi-lo)*ih; }
    var ink=(typeof svgInk==='function')?svgInk():{zebra:'#eee',head:'#aaa'};
    var sv='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'" '
          +'style="display:block;background:var(--surface);border-radius:8px">';
    for(var g=0;g<=4;g++){
      var vv=lo+(hi-lo)*g/4, yy=Y(vv);
      sv+='<line x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-14)+'" y2="'+yy.toFixed(1)+'" '
         +'stroke="'+ink.zebra+'" stroke-width="1"/>'
         +'<text x="'+(PL-6)+'" y="'+(yy+4).toFixed(1)+'" font-size="9" fill="'+ink.head
         +'" text-anchor="end">'+fmtMoney(Math.round(vv))+'</text>';
    }
    var pts='', ar='';
    for(i=0;i<N;i++) pts+=(i?' ':'')+X(i).toFixed(1)+','+Y(vals[i]).toFixed(1);
    ar='M'+X(0).toFixed(1)+','+(PT+ih)+' L'+pts.replace(/ /g,' L')+' L'+X(N-1).toFixed(1)+','+(PT+ih)+' Z';
    sv+='<path d="'+ar+'" fill="'+KI.c+'" opacity="0.08"/>';
    sv+='<polyline points="'+pts+'" fill="none" stroke="'+KI.c+'" stroke-width="1.8" stroke-linejoin="round"/>';
    for(i=0;i<N;i++) sv+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(vals[i]).toFixed(1)+'" r="1.8" fill="'+KI.c+'"/>';
    sv+='<text x="'+PL+'" y="'+(H-8)+'" font-size="10" fill="'+ink.head+'">'+esc(labels[0][0])+'</text>'
       +'<text x="'+(W-14)+'" y="'+(H-8)+'" font-size="10" text-anchor="end" fill="'+ink.head+'">'
       +esc(labels[N-1][0])+'</text>';
    sv+='</svg>';
    h+='<div style="padding:0 12px">'+sv+'</div>';
    h+='<div class="note" style="padding:6px 12px 0">'+esc(KI.t)+'：'
      +'最低 '+fmtMoney(mn)+' · 最高 '+fmtMoney(mx)+' · 最新 '+fmtMoney(vals[N-1])+'</div>';
  }
  /* 明细表（最近 20 期，倒序） */
  var show=ph.slice(-20).reverse();
  h+='<div class="sec">最近 '+show.length+' 期明细</div>';
  h+='<div class="scroll" style="max-height:300px"><table><thead><tr>'
    +'<th>期号</th><th>开奖日期</th><th>奖池</th><th>销量</th><th>一等奖</th></tr></thead><tbody>';
  for(i=0;i<show.length;i++)
    h+='<tr><td>'+esc(show[i][0])+'</td><td>'+esc(show[i][1]||'')+'</td>'
      +'<td>'+fmtMoney(show[i][2])+'</td><td>'+fmtMoney(show[i][3])+'</td>'
      +'<td>'+fmtMoney(show[i][4])+'</td></tr>';
  h+='</tbody></table></div>';
  h+='<div class="note">奖池与销量逐期波动属正常现象；一等奖为浮动奖，'
    +'金额随中奖注数和奖池变化。数据来自官方接口，仅供了解，不构成任何购买建议。</div></div>';
  return h;
}

/* 渲染开奖号码，命中的号码金色描边，未命中的灰掉 */
function fmtBallsHit(red,blue,hr,hb){
  var h='<div class="balls">', i;
  for(i=0;i<red.length;i++)
    h+='<span class="b r'+(hr[red[i]]?' hit':' dim')+'">'+pad(red[i])+'</span>';
  if(blue && blue.length){
    h+='<span class="sep">+</span>';
    for(i=0;i<blue.length;i++)
      h+='<span class="b bl'+(hb[blue[i]]?' hit':' dim')+'">'+pad(blue[i])+'</span>';
  }
  return h+'</div>';
}

    +'每期开奖都是独立事件，过去的表现不影响未来，没有任何预测能力。</div>';
  h+='<div class="betops" style="margin:0 12px 12px"><button onclick="closeHelp()">关闭</button></div>';
  modalBox(h);

  return h;

/* 缩水结果复制成文本 */
function fsShrinkCopy(){
  var sr=fsShrunk();
  if(!sr.on){ toast('请先开启缩水过滤'); return; }
  if(sr.tooMany){ toast('注数过多，无法生成明细'); return; }
  if(!sr.kept){ toast('没有组合符合条件，请放宽条件'); return; }
  var t='', i;
  if(isPos()){
    for(i=0;i<sr.list.length;i++) t+=sr.list[i].join(' ')+'\n';
  }else{
    for(i=0;i<sr.list.length;i++)
      t+=(sr.list[i].r||[]).map(pad).join(' ')+' + '+(sr.list[i].b||[]).map(pad).join(' ')+'\n';
  }
  t+='—— 缩水后 '+sr.kept+' 注，'+moneyFull(sr.amt)+' 元（原 '+sr.orig+' 注）';

/* ───────── 新功能④ 重号 / 连号 / 同尾 统计 ─────────
   号码统计的第 4 个视图。这些都是真实存在的规律统计（不是预测）：
     重号 = 当期号码里，上一期也出现过的号码个数
     连号 = 当期是否存在相邻号码（如 12、13）
     同尾 = 当期个位数相同的号码对数（如 03、13、23 尾数都是 3） */
function shapeStats(rows){
  var i, rep=[], link=0, tail=0, n=rows.length;
  var dist={};          /* 重号个数 → 期数 */
  for(i=1;i<n;i++){
    var cur=rows[i][2]||[], prev=rows[i-1][2]||[];
    var c=0, k, j2;
    for(k=0;k<cur.length;k++) if(prev.indexOf(cur[k])>=0) c++;
    rep.push(c); dist[c]=(dist[c]||0)+1;
    /* 连号：排序后相邻差 1 */
    var srt=cur.slice().sort(function(a,b){return a-b;});
    var has=false;
    for(j2=1;j2<srt.length;j2++) if(srt[j2]-srt[j2-1]===1){ has=true; break; }
    if(has) link++;
    /* 同尾：个位数相同的号码，取最大同尾组的个数 -1 记为「同尾对数」 */
    var t={};
    for(k=0;k<cur.length;k++){ var u=cur[k]%10; t[u]=(t[u]||0)+1; }
    var mx=0; for(var kk in t) if(t[kk]>mx) mx=t[kk];
    tail += (mx>1 ? mx-1 : 0);
  }
  var tot=rep.length||1;
  return {tot:tot, dist:dist, link:link, tail:tail, avgRep:(rep.reduce(function(a,b){return a+b;},0)/tot)};
}

/* ───────── 猜号参考 ─────────
   诚实前提（写进代码，也写进界面）：
   彩票每期开奖是独立随机事件，历史号码在数学上无法推算下期结果。
   本页不是「预测器」，它做两件诚实的事：
   1) 按「历史形态画像」生成号码——和值、奇偶、连号、重号、区间、跨度都落在
      历史常见范围内，并强制多注之间不雷同，避免花两份钱买几乎同一组号。
   2) 用「偏好回放」把各偏好（含形态典型）的历史命中算出来，与理论值并列，
      让你亲眼看到：它们和随机机选没有实质差别。
   形态约束不改变任何中奖概率（每个组合的概率始终完全相同），它只解决
   「号码看起来很怪」和「多注雷同浪费钱」这两个体验问题。 */
function guessNow(){
  var t=new Date(), p=function(x){return (x<10?'0':'')+x};
  return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate())+' '+p(t.getHours())+':'+p(t.getMinutes());
}
/* 只统计 [0,upto) 期，避免回放时用到「未来数据」 */
function guessStatArr(key, upto, min, max, posIdx){
  var d=D[S.lot], rows=d.rows, n, i, cnt=[];
  for(n=min;n<=max;n++) cnt[n]=0;
  for(i=0;i<upto;i++){
    var arr=rows[i][key]||[];
    if(posIdx>=0){ var v=arr[posIdx]; if(v>=min&&v<=max) cnt[v]++; }
    else { for(var j=0;j<arr.length;j++){ if(arr[j]>=min&&arr[j]<=max) cnt[arr[j]]++; } }
  }
  var cur=[];
  for(n=min;n<=max;n++){
    var c=0;
    for(i=upto-1;i>=0;i--){
      var a2=rows[i][key]||[];
      var hit = posIdx>=0 ? (a2[posIdx]===n) : (a2.indexOf(n)>=0);
      if(hit) break;
      c++;
    }
    cur[n]=c;
  }
  return {cnt:cnt, cur:cur, N:upto};
}
/* 权重：z-score 标准化 + exp(bias·z) 温度放大。
   历史演进：v1 用 (次数+1)²，多注几乎雷同；v2 改成「排名归一化 + 温和偏置」，
   多注是岔开了，但热号冷号的权重比被压到 1.7:1，实测 hot 与 cold 的
   平均热度只差 1% —— 策略完全失效，点「博冷」拿到的是和随机一样的号。
   v3（当前）：先按 z-score 保留分数的真实离散度，再用 exp 放大，
   实测 hot 命中历史前 8 热号 45%（随机基准 24%），cold 命中后 8 冷号 40%，
   区分度与对称性都成立。多注分散另由 guessPenalty 降权负责，两者解耦。 */
function guessWeights(st, min, max, strategy, per){
  var arr=[], n, i, vs=[];
  for(n=min;n<=max;n++){
    var c=st.cnt[n]||0, g=st.cur[n]||0, v;
    if(strategy==='hot')            v=c;                                      /* 追热：历史开出越多越好 */
    else if(strategy==='cold')      v=-c;                                     /* 博冷：历史开出越少越好（与追热严格对称） */
    else if(strategy==='gap')       v=g;                                      /* 遗漏回补：当前遗漏越久越"该出" */
    else if(strategy==='balance'){ var e=st.N*(per||0.1); v=-Math.abs(c-e); } /* 趋均值：越接近理论次数越好 */
    else v=0;                                                                  /* morph / random：不偏向任何号 */
    arr.push({n:n, v:v}); vs.push(v);
  }
  var w=[];
  var noB=(strategy==='morph'||strategy==='random');
  if(noB){ for(i=0;i<arr.length;i++) w[arr[i].n]=1; return w; }
  /* z-score：保留分数的真实离散度，再按温度放大。
     旧版用「排名归一化」，把 33 个号压成 0~1 均匀间隔，
     冷热号的实际差距（标准差 17.6 / 均值 378）被彻底抹平，
     实测 hot 与 cold 的平均热度只差 1%，等于策略失效。 */
  var m=0; for(i=0;i<vs.length;i++) m+=vs[i]; m/= (vs.length||1);
  var sd=0; for(i=0;i<vs.length;i++) sd+=(vs[i]-m)*(vs[i]-m);
  sd=Math.sqrt(sd/(vs.length||1));
  if(!(sd>0)){ for(i=0;i<arr.length;i++) w[arr[i].n]=1; return w; }
  var bias=+S.guessBias; if(isNaN(bias)||bias<=0) bias=0.6;
  for(i=0;i<arr.length;i++){
    var z=(arr[i].v-m)/sd;
    if(z>3) z=3; if(z<-3) z=-3;                 /* 截断，避免单个号权重爆表 */
    w[arr[i].n]=Math.exp(bias*z);

/* 加权不重复抽样（轮盘赌） */
function guessSample(w, min, max, k, pen, ban){

  var out=[];
  for(var t=0;t<k&&cand.length;t++){
    var tot=0, i, ww=[];
    for(i=0;i<cand.length;i++){
      var v=(w[cand[i]]||0);
      if(pen && pen[cand[i]]) v*= pen[cand[i]];      /* 已被前面注用过的号降权 */
      ww.push(v); tot+=v;
    }
    if(!(tot>0)){ for(i=0;i<cand.length;i++){ ww[i]=1; } tot=cand.length; }
    var r=Math.random()*tot, acc=0, idx=cand.length-1;
    for(i=0;i<cand.length;i++){ acc+=ww[i]; if(r<=acc){ idx=i; break; } }
    out.push(cand[idx]); cand.splice(idx,1);

/* ─── 形态：口径与「区间分布」「形态统计」页一致 ─── */
function guessMorph(r, last){
  var d=D[S.lot], i, sum=0, odd=0, big=0, link=0;
  var z1=Math.ceil(d.redMax/3), z2=Math.ceil(d.redMax*2/3), zc=[0,0,0];
  var mid=Math.floor((d.redMax+1)/2);
  for(i=0;i<r.length;i++){
    sum+=r[i]; if(r[i]%2) odd++;
    if(r[i]>mid) big++;
    if(r[i]<=z1) zc[0]++; else if(r[i]<=z2) zc[1]++; else zc[2]++;
    if(i>0 && r[i]===r[i-1]+1) link++;

  var tm={}, tail=0, k;
  for(i=0;i<r.length;i++){ var t=r[i]%10; tm[t]=(tm[t]||0)+1; }
  for(k in tm) if(tm[k]>=2) tail+=tm[k]-1;
  var repeat=0;
  if(last) for(i=0;i<r.length;i++) if(last.indexOf(r[i])>=0) repeat++;
  return {sum:sum, odd:odd, big:big, zc:zc, link:link, tail:tail,
          repeat:repeat, span:r[r.length-1]-r[0]};
}
/* 按位玩法（福彩3D / 排列三）形态 */
function guessMorphPos(r, last){
  var i, sum=0, link=0, rep=0;
  for(i=0;i<r.length;i++){ sum+=r[i]; if(i>0&&r[i]===r[i-1]+1) link++; }
  if(last) for(i=0;i<r.length;i++) if(last[i]===r[i]) rep++;
  var mn=Math.min.apply(null,r), mx=Math.max.apply(null,r);
  var u={}, k, ks=[];
  for(i=0;i<r.length;i++) u[r[i]]=(u[r[i]]||0)+1;
  for(k in u) ks.push(u[k]);

function _gpct(a, p){

function _gavg(a){ if(!a||!a.length) return 0; var s=0,i; for(i=0;i<a.length;i++) s+=a[i]; return s/a.length; }
/* 历史形态画像：只用 [0,upto) 期，取最近 600 期作统计窗口 */
var _guessProf={}, _guessProfN=0;
function guessProfile(upto){

  var d=D[S.lot], rows=d.rows, i, prof;
  var from=Math.max(1, upto-600);
  var last=rows[upto-1]?(rows[upto-1][2]||[]):null;
  if(isPos()){

    for(i=from;i<upto;i++){

      repHi:_gpct(rp,0.95), linkHi:_gpct(lk,0.97),

    for(i=from;i<upto;i++){
      var m2=guessMorph(rows[i][2]||[], rows[i-1]?(rows[i-1][2]||[]):null);
      SM.push(m2.sum); OD.push(m2.odd); LK.push(m2.link); RP.push(m2.repeat);
      SP.push(m2.span); TL.push(m2.tail);

      sumLo:_gpct(SM,0.015), sumHi:_gpct(SM,0.985),
      oddLo:0, oddHi:6,
      linkHi:_gpct(LK,0.98), repHi:_gpct(RP,0.96),
      spanLo:_gpct(SP,0.015), spanHi:_gpct(SP,0.985),
      tailHi:_gpct(TL,0.95),
      zLo:[_gpct(Z0,0.02),_gpct(Z1,0.02),_gpct(Z2,0.02)],
      zHi:[_gpct(Z0,0.98),_gpct(Z1,0.98),_gpct(Z2,0.98)],
      avgSum:_gavg(SM), avgLink:_gavg(LK), avgRep:_gavg(RP), avgSpan:_gavg(SP)};

/* 形态是否落在历史常见范围（宽松：只挡极端，不追求精确复刻） */
function guessMorphOK(m, prof){
  if(!prof||!prof.n||!m) return true;
  if(prof.pos){
    if(m.sum<prof.sumLo||m.sum>prof.sumHi) return false;
    if(m.span<prof.spanLo||m.span>prof.spanHi) return false;
    if(m.repeat>prof.repHi+1) return false;
    if(m.kind==='baozi' && Math.random()>0.02) return false;   /* 豹子历史约 1%，不刻意多给 */
    return true;
  }
  /* 只挡真正罕见的极端，不做"精确复刻"。
     旧版分位太严（3%~97%），把和值标准差从历史 20.8 压到 17.1，
     生成的号反而比真实开奖更"规整"，看着更假。 */
  if(m.sum<prof.sumLo||m.sum>prof.sumHi) return false;
  if(m.span<prof.spanLo||m.span>prof.spanHi) return false;
  if(m.odd<prof.oddLo||m.odd>prof.oddHi) return false;
  if(m.link>prof.linkHi+1) return false;
  if(m.repeat>prof.repHi+1) return false;
  if(m.tail>prof.tailHi+1) return false;
  var i;
  for(i=0;i<3;i++){ if(m.zc[i]<prof.zLo[i]||m.zc[i]>prof.zHi[i]) return false; }
  return true;
}
/* 两注红球重合个数 */
function guessOverlap(a, b){
  var c=0, i;
  for(i=0;i<a.length;i++) if(b.indexOf(a[i])>=0) c++;
  return c;
}
/* 权重缓存：guessOneRaw 每次抽样都要扫全史算次数，回放里会重复几千次。

var _gwCache={}, _gwN=0;
function guessWeightsCached(strategy, upto, key, min, max, per, posIdx){
  var b=+S.guessBias; if(isNaN(b)||b<=0) b=0.6;
  var ck=S.lot+'|'+strategy+'|'+upto+'|'+key+'|'+min+'-'+max+'|'+posIdx+'|'+b;
  if(_gwCache[ck]) return _gwCache[ck];
  var st=guessStatArr(key, upto, min, max, posIdx);
  var w=guessWeights(st, min, max, strategy, per);
  _gwCache[ck]=w;
  if(++_gwN>1500){ _gwCache={}; _gwN=0; }      /* 回放会换 upto，防止无限增长 */
  return w;
}
/* ═════════ 近 N 期避重约束 ═════════
   默认 A（逐期）：与近 N 期每一期分别比，任意一期重合 ≤ M 个。
   严格 B（并集）：与近 N 期出现过的所有红球（并集）合计重合 ≤ M 个。
   按位玩法：数字全集只有 10 个，近 5 期约覆盖 8 个，并集口径几乎不可能满足；
   改用「同位命中 ≤ min(M,1) 且数字集合不与近 N 期任一期完全相同」。
   返回「违反程度」而不是布尔：0 = 完全合规，数值越大越不合规，
   这样试不出来时能取最接近的一注，而不是硬拒绝导致生成器退化。 */
function guessRecentRows(upto, N){
  var d=D[S.lot]; if(!d||!d.rows) return [];
  var rows=d.rows, out=[], i, from=Math.max(0, upto-(N||5));
  for(i=from;i<upto;i++){
    var r=rows[i]||{};
    out.push({issue:r[0]||'', date:r[1]||'', r:(r[2]||[]).slice(), b:(r[3]||[]).slice()});
  }
  return out;
}
function guessRecentViolation(g, recent, N, M, strict){
  if(!recent||!recent.length) return 0;
  var i, j, qi, v=0, lim=+M||2;
  if(isPos()){
    var pl=strict?Math.min(lim,1):lim;
    for(i=0;i<recent.length;i++){
      var same=0, rr=recent[i].r||[];
      for(qi=0;qi<(g.r||[]).length&&qi<rr.length;qi++) if(g.r[qi]===rr[qi]) same++;
      if(same>pl) v+=same-pl;
      if(strict && (g.r||[]).slice().sort().join(',')===rr.slice().sort().join(',')) v+=3;
    }
    return v;
  }
  if(strict){
    /* B：并集里命中了几个 */
    var seen={};
    for(i=0;i<recent.length;i++){
      var ar=recent[i].r||[];
      for(j=0;j<ar.length;j++) seen[ar[j]]=1;
    }
    var hit=0;
    for(j=0;j<(g.r||[]).length;j++) if(seen[g.r[j]]) hit++;
    if(hit>lim) v+=hit-lim;
  }else{
    /* A：逐期比较，累加每期超出 M 的部分 */
    for(i=0;i<recent.length;i++){
      var ov=guessOverlap(g.r||[], recent[i].r||[]);
      if(ov>lim) v+=ov-lim;
    }
  }
  return v;
}
function guessRecentOK(g, cfg){
  if(!cfg||!cfg.recent||!cfg.recent.length) return true;
  return guessRecentViolation(g, cfg.recent, cfg.N, cfg.M, cfg.strict)===0;
}
/* 与已生成的一批相比是否过于雷同 */
function guessTooSimilar(g, list, maxOv){
  var i;
  if(!list||!list.length) return false;
  if(isPos()){                                   /* 123 与 321 数字集合相同，也算雷同 */
    var m1=(g.r||[]).slice().sort().join(',');
    for(i=0;i<list.length;i++)
      if(m1===(list[i].r||[]).slice().sort().join(',')) return true;
    return false;
  }
  for(i=0;i<list.length;i++) if(guessOverlap(g.r, list[i].r)>maxOv) return true;
  return false;
}
/* 单注原始生成（不含形态约束）。
   rbCfg={rb:'any'|'avoid'|'must', blues:[...]}：先定蓝球再采红球，
   must 把某个蓝球数字作为红球种子强制入选，avoid 从候选里剔除蓝球数字。
   两者都在采样阶段完成，不存在「事后补救」导致部分注不达标。
   双色球蓝球 1~16、大乐透后区 1~12 都落在红球范围内，
   所以「指定号码 + 必须重合」永远有解，不需要任何冲突标注。
   不传 rbCfg（偏好回放）时保持原来的按权重采样行为。 */
function guessOneRaw(strategy, upto, pen, rbCfg){
  var d=D[S.lot];
  if(isPos()){
    var out=[], p;
    for(p=0;p<3;p++){
      var w=guessWeightsCached(strategy, upto, 2, 0, 9, 0.1, p);
      out.push(guessSample(w, 0, 9, 1, pen)[0]);
    }
    return {r:out, b:[]};
  }
  var rb=rbCfg?rbCfg.rb:'any', blues=(rbCfg&&rbCfg.blues)||[];
  var ban={}, seed=0, pool=[], i;
  if(rb==='avoid'){
    for(i=0;i<blues.length;i++) if(blues[i]>=1&&blues[i]<=d.redMax) ban[blues[i]]=1;
  }else if(rb==='must'){
    for(i=0;i<blues.length;i++) if(blues[i]>=1&&blues[i]<=d.redMax) pool.push(blues[i]);
    if(pool.length){ seed=pool[Math.floor(Math.random()*pool.length)]; ban[seed]=1; }
  }
  var wR=guessWeightsCached(strategy, upto, 2, 1, d.redMax, d.redCount/d.redMax, -1);
  var reds=seed?[seed]:[];
  reds=reds.concat(guessSample(wR, 1, d.redMax, d.redCount-reds.length, pen, ban))

  var bs=blues.slice();
  if(!bs.length && d.blueMax){
    var wB=guessWeightsCached(strategy, upto, 3, 1, d.blueMax,

    bs=guessSample(wB, 1, d.blueMax, d.blueCount||1);
  }
  return {r:reds, b:bs};

/* 由已生成的一批算出「降权表」：被用过的号权重打折。
   旧版靠 guessTooSimilar 硬拒绝，偏好一强就频繁撞车、
   走到放宽分支，反雷同等于失效。降权是软约束，
   既让各注自然岔开，又不会因拒绝率过高而退化。 */
function guessPenalty(list, spread){
  var pen={}, i, j;
  if(!list||!list.length) return null;
  var f=+spread; if(isNaN(f)||f<=0) f=0.3;      /* 0.3 = 用过的号降到 30% */
  for(i=0;i<list.length;i++){
    var r=list[i].r||[];
    for(j=0;j<r.length;j++){
      var n=r[j];
      pen[n]=(pen[n]===undefined)?f:(pen[n]*f);
    }
  }
  return pen;
}
/* 单注生成：形态 + 多注反雷同 + 近 N 期避重，三级放宽，绝不硬拒绝。
   cfg = {N,M,strict,recent}；tries 供回放降低尝试次数（省时）。
   阶段①全满足 → ②放宽形态 → ③放宽避重（取违反程度最小的一注并标记）。
   严格 B 的通过率约 12%，若用硬拒绝会频繁撞车、连带把反雷同也拖垮，
   这正是前几轮「多注雷同」复发的老毛病。 */
function guessOne(strategy, upto, prof, avoid, maxOv, cfg, tries, rbCfg){
  var t, g, m;
  var pen=guessPenalty(avoid, S.guessSpread);
  var T1=tries?tries[0]:80, T2=tries?tries[1]:60, T3=tries?tries[2]:60;
  var hasCfg=!!(cfg&&cfg.recent&&cfg.recent.length);
  function simOK(x){ return !(avoid && maxOv<90 && guessTooSimilar(x, avoid, maxOv)); }
  function recentOK(x){ return !hasCfg || guessRecentOK(x, cfg); }
  function viol(x){ return hasCfg ? guessRecentViolation(x,cfg.recent,cfg.N,cfg.M,cfg.strict) : 0; }
  function rbOK(x){
    if(!rbCfg||rbCfg.rb==='any'||isPos()) return true;
    var m={}, i, hit=0;
    for(i=0;i<x.r.length;i++) m[x.r[i]]=1;
    for(i=0;i<x.b.length;i++) if(m[x.b[i]]) hit++;
    return rbCfg.rb==='must' ? hit>0 : hit===0;
  }
  for(t=0;t<T1;t++){
    g=guessOneRaw(strategy, upto, pen, rbCfg);
    if(prof){
      m = prof.pos ? guessMorphPos(g.r, prof.last) : guessMorph(g.r, prof.last);
      if(!guessMorphOK(m, prof)) continue;
    }
    if(!simOK(g)) continue;
    if(!recentOK(g)) continue;
    if(!rbOK(g)) continue;
    return g;
  }
  for(t=0;t<T2;t++){                       /* 放宽形态，仍守住反雷同、避重与红蓝重合 */
    g=guessOneRaw(strategy, upto, pen, rbCfg);
    if(!simOK(g)) continue;
    if(!recentOK(g)) continue;
    if(!rbOK(g)) continue;
    return g;
  }
  /* 软约束：优先同时满足反雷同；实在不行只按避重最接近取，并标注未达标 */
  var bestBoth=null, bestBothV=1e9, bestAny=null, bestAnyV=1e9;
  for(t=0;t<T3;t++){
    g=guessOneRaw(strategy, upto, pen, rbCfg);
    if(!rbOK(g)) continue;                 /* 红蓝重合绝不放宽 */
    var v=viol(g);
    if(v<bestAnyV){ bestAnyV=v; bestAny=g; }
    if(simOK(g) && v<bestBothV){ bestBothV=v; bestBoth=g; }
    if(v===0 && simOK(g)) return g;
  }
  var pick=bestBoth||bestAny;
  if(!pick){
    pick=guessOneRaw(strategy, upto, pen, rbCfg);
    /* 极端兜底：把种子号写进红球，保证 must 一定有重合号 */
    if(rbCfg&&rbCfg.rb==='must'){
      var d2=D[S.lot], pp=(rbCfg.blues||[]).filter(function(x){return x>=1&&x<=d2.redMax;});
      if(pp.length && pick.r.indexOf(pp[0])<0){
        pick.r[0]=pp[0]; pick.r.sort(function(a,b){return a-b});
      }
    }
  }
  pick._recentWarn = hasCfg && (viol(pick)>0);
  return pick;
}
function guessUpTo(){ var d=D[S.lot]; return (d&&d.rows)?d.rows.length:0; }
/* 理论期望命中数：红球 = 选号个数² / 号码总数 */
function guessTheory(){
  var d=D[S.lot];
  if(!d) return {red:0, blue:0};              /* 数据未加载时安全返回，避免崩溃 */
  if(isPos()) return {red:3*0.1, blue:0};
  return {red:d.redCount*(d.redCount/d.redMax),
          blue:d.blueMax?((d.blueCount||1)*((d.blueCount||1)/d.blueMax)):0};
}
/* 偏好回放：对最近 K 期，每期只用「该期之前」的数据生成一注，统计平均命中。
   cfg 非空时，同一期再生成一注「叠加近 N 期避重」的，单独统计一列——
   用来验证避重约束同样不改变命中数（仍围绕理论值波动）。
   避重所用的近 N 期也全部取自该期之前，绝不使用未来数据。 */
function guessBacktest(strategy, K, rounds, cfg){
  var d=D[S.lot], rows=d.rows, N=rows.length;
  if(N<40) return null;
  K=Math.min(K||24, N-12); rounds=rounds||2;
  var sumR=0, sumB=0, sumRR=0, sumRB=0, cnt=0, t, rd;
  var TR=[24,16,16];
  for(rd=0;rd<rounds;rd++){
    for(t=0;t<K;t++){
      var upto=N-K+t;
      var prof=guessProfile(upto);
      var g=guessOne(strategy, upto, prof, null, 99, null, TR);
      var ar=rows[upto][2]||[], ab=rows[upto][3]||[], i, hr=0, hb=0;
      for(i=0;i<g.r.length;i++) if(ar.indexOf(g.r[i])>=0) hr++;
      for(i=0;i<g.b.length;i++) if(ab.indexOf(g.b[i])>=0) hb++;
      sumR+=hr; sumB+=hb;
      if(cfg){
        var one={N:cfg.N, M:cfg.M, strict:cfg.strict,
                 recent:guessRecentRows(upto, cfg.N)};
        var g2=guessOne(strategy, upto, prof, null, 99, one, TR);
        var hr2=0, hb2=0;
        for(i=0;i<g2.r.length;i++) if(ar.indexOf(g2.r[i])>=0) hr2++;
        for(i=0;i<g2.b.length;i++) if(ab.indexOf(g2.b[i])>=0) hb2++;
        sumRR+=hr2; sumRB+=hb2;
      }
      cnt++;
    }
  }
  return {K:K, rounds:rounds, n:cnt,
          red:cnt?sumR/cnt:0, blue:cnt?sumB/cnt:0,
          rRed:cfg?(cnt?sumRR/cnt:0):null, rBlue:cfg?(cnt?sumRB/cnt:0):null};

/* ─── 蓝球 / 后区：指定号码或排除号码 ───
   只在「生成号码」这一批生效；偏好回放仍走自动，不受指定影响。 */
function guessBlueSpec(){
  var d=D[S.lot];
  if(!d||!d.blueMax||isPos()) return {mode:'auto',list:[],err:''};
  var mode=S.guessBlueMode||'auto';
  if(mode==='auto') return {mode:'auto',list:[],err:''};
  var raw=String(S.guessBlueNums||'').trim();
  if(!raw) return {mode:mode,list:[],err:'请填写号码'};
  var parts=raw.split(/[\s,，、;；]+/), seen={}, list=[], bad=[], i, v;
  for(i=0;i<parts.length;i++){
    if(!parts[i]) continue;
    v=parseInt(String(parts[i]).replace(/^0+/,''),10);
    if(isNaN(v)||v<1||v>d.blueMax){ bad.push(parts[i]); continue; }
    if(seen[v]) continue; seen[v]=1; list.push(v);
  }
  if(bad.length) return {mode:mode,list:list,err:'超出范围：'+bad.join('、')+'（应为 1~'+d.blueMax+'）'};
  if(!list.length) return {mode:mode,list:[],err:'没有有效号码'};
  return {mode:mode,list:list,err:''};
}
function guessBluePad(list){
  return list.map(function(x){return pad(x)}).join(' ');
}
/* 为第 i 注先确定蓝球 / 后区：指定多个时按注轮流分配；排除模式从剩余号随机取。
   先定蓝球，红球再按重合口径采样——这是「指定 13 + 必须重合」能注注达标的关键。 */
function guessPlanBlues(spec, i, need, blueMax){
  var j, v, used={}, out=[], pool=[], ex={};
  if(spec.mode==='only'){
    for(j=0;j<need&&spec.list.length;j++){
      v=spec.list[(i*need+j)%spec.list.length];
      if(!used[v]){ out.push(v); used[v]=1; }
    }
    for(v=1;v<=blueMax&&out.length<need;v++) if(!used[v]){ out.push(v); used[v]=1; }
  }else{
    if(spec.mode==='exclude') for(j=0;j<spec.list.length;j++) ex[spec.list[j]]=1;
    for(v=1;v<=blueMax;v++) if(!ex[v]) pool.push(v);
    out=guessTake(pool,need);
  }
  return out.sort(function(a,b){return a-b});
}
/* 红球与蓝球（后区）数字是否重合：any 不限 / avoid 避开 / must 至少重合一个。
   按位玩法没有蓝球，控件与约束都自动隐藏。 */

/* 从候选里随机取 cnt 个（不重复） */
function guessTake(arr,cnt){
  var p=[],q=arr.slice();

/* 蓝球在 guessRun 里先定好，红球在 guessOneRaw 里按重合口径采样，

function guessRun(){

  var cfg={N:rN, M:rM, strict:rStrict, recent:guessRecentRows(upto, rN)};
  var out=[];
  for(i=0;i<n;i++){
    var blues=needBlue?guessPlanBlues(bspec,i,need,d.blueMax):[];
    var rbCfg=needBlue?{rb:rb, blues:blues}:null;
    var g=guessOne(strat, upto, prof, out, maxOv, cfg, null, rbCfg);
    g._bluePinned=(bspec.mode==='only'); g._rbMode=rb;
    if(prof){
      g._m = prof.pos ? guessMorphPos(g.r, prof.last) : guessMorph(g.r, prof.last);
      g._ok = guessMorphOK(g._m, prof);
    }
    g._recent={N:rN, M:rM, strict:rStrict, rows:cfg.recent,
               viol:guessRecentViolation(g, cfg.recent, rN, rM, rStrict)};
    out.push(g);

  S.guessList=out; S.guessLot=S.lot; S.guessAt=guessNow();

/* ═════════ 每注的详细分析 ═════════
   用户反馈「生成出来不知道这注什么来头」。这里把每个号的冷热、整注与理论值的偏离、
   历史上最相近的一期、形态的逐项明细全部摊开。
   目的是让你看得明白，而不是暗示这些信息能预测——它们不能，每处都写了边界。 */
/* 号码统计表：出现次数 / 当前遗漏 / 最大遗漏 / 上次开出日期。
   按「期数」缓存挂在 d 上，数据重载自动失效；同批多注只算一次。 */
function guessNumTable(){
  var d=D[S.lot];
  if(!d||!d.rows||!d.rows.length) return null;
  var upto=d.rows.length;
  if(d._gnt && d._gnt.upto===upto) return d._gnt;
  var rows=d.rows, i, n, p;
  var t={upto:upto, pos:!!d.positional};
  function blank(lo,hi){ var a=[]; for(var k=lo;k<=hi;k++) a[k]={c:0,run:0,max:0,last:'',cur:0}; return a; }
  function finish(a,lo,hi){ for(var k=lo;k<=hi;k++){ if(a[k].run>a[k].max) a[k].max=a[k].run; a[k].cur=a[k].run; } }
  if(t.pos){
    t.posStat=[];
    for(p=0;p<3;p++){
      var a=blank(0,9), pp=p;
      for(i=0;i<upto;i++){
        var v=(rows[i][2]||[])[pp];
        for(n=0;n<=9;n++){
          if(v===n){ a[n].c++; a[n].last=rows[i][1]; if(a[n].run>a[n].max) a[n].max=a[n].run; a[n].run=0; }
          else a[n].run++;
        }
      }
      finish(a,0,9); t.posStat[pp]=a;
    }
    var a2=blank(0,9);
    for(i=0;i<upto;i++){
      var r2=rows[i][2]||[];
      for(n=0;n<=9;n++){
        if(r2.indexOf(n)>=0){ a2[n].c++; a2[n].last=rows[i][1]; if(a2[n].run>a2[n].max) a2[n].max=a2[n].run; a2[n].run=0; }
        else a2[n].run++;
      }
    }
    finish(a2,0,9); t.any=a2;
  }else{
    var rmax=d.redMax, bmax=d.blueMax;
    var R=blank(1,rmax), B=blank(1,bmax);
    for(i=0;i<upto;i++){
      var rr=rows[i][2]||[], bb=rows[i][3]||[];
      for(n=1;n<=rmax;n++){
        if(rr.indexOf(n)>=0){ R[n].c++; R[n].last=rows[i][1]; if(R[n].run>R[n].max) R[n].max=R[n].run; R[n].run=0; }
        else R[n].run++;
      }
      for(n=1;n<=bmax;n++){
        if(bb.indexOf(n)>=0){ B[n].c++; B[n].last=rows[i][1]; if(B[n].run>B[n].max) B[n].max=B[n].run; B[n].run=0; }
        else B[n].run++;
      }
    }
    finish(R,1,rmax); finish(B,1,bmax);
    t.red=R; t.blue=B; t.rmax=rmax; t.bmax=bmax; t.redCount=d.redCount;
  }
  d._gnt=t; return t;
}
/* 和值在全部历史中处于什么位置（百分位）。和值数组排序后缓存 */
function guessSumPct(sum){
  var d=D[S.lot];
  if(!d||!d.rows||!d.rows.length) return null;
  if(!d._gsp){
    var arr=[], i, j, s2;
    for(i=0;i<d.rows.length;i++){
      var r=d.rows[i][2]||[]; s2=0;
      for(j=0;j<r.length;j++) s2+=r[j];
      arr.push(s2);
    }
    arr.sort(function(a,b){return a-b;});
    d._gsp=arr;
  }
  var a=d._gsp, lo=0, hi=a.length, mid;
  while(lo<hi){ mid=(lo+hi)>>1; if(a[mid]<sum) lo=mid+1; else hi=mid; }
  return lo/a.length*100;
}
/* 历史最相近的一期 + 全史命中分布。
   非按位走 analyze（已有缓存）；按位玩法必须单独算「同位相同位数」，
   不能套用红球命中个数的口径 */
function guessNearest(g){
  var d=D[S.lot];
  if(!d||!d.rows||!d.rows.length) return null;
  var upto=d.rows.length, rows=d.rows, i, k;
  if(d.positional){
    var ck=(g.r||[]).join(',');
    if(!d._gnp) d._gnp={};
    if(d._gnp[ck]) return d._gnp[ck];
    var best={k:-1}, kd={};
    for(i=0;i<upto;i++){
      var v=rows[i][2]||[]; if(v.length<3) continue;
      k=0; if(v[0]===(g.r||[])[0])k++; if(v[1]===(g.r||[])[1])k++; if(v[2]===(g.r||[])[2])k++;
      kd[k]=(kd[k]||0)+1;
      if(k>best.k) best={k:k,issue:rows[i][0],date:rows[i][1],red:v.slice()};
    }
    var out={pos:true,best:best,kdist:kd,n:upto};
    d._gnp[ck]=out; return out;
  }
  var a=analyze(g.r||[], g.b||[]);
  /* analyze 的 best 字段是 overlap，这里统一映射成 k，避免调用方读 undefined */
  return {pos:false, kdist:a.kdist, n:a.draws, exact:a.exact,
          best:{k:a.best.overlap, issue:a.best.issue, date:a.best.date,
                red:a.best.red, shared:a.best.shared}};
}
/* 冷热标签：在这组号码内部按出现次数排名，前 1/3 热、后 1/3 冷 */

  for(i=0;i<nums.length;i++) arr.push({n:nums[i], c:(cntMap[nums[i]]||{c:0}).c});
